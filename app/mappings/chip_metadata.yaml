# Chip-level metadata for soc.yaml header
# This data is typically not in TRM chapters, so we hardcode it

chip: "RM46L852"
vendor: "Texas Instruments"
family: "Hercules RM46"
revision: "Rev B"

cpu:
  cores:
    - name: "Cortex-R4F"
      arch: "armv7-r"
      endianness: little
      word_size_bits: 32
      fpu: "VFPv3-D16"
