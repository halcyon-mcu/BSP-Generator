ir_schema_version: "1.1.0"

peripherals:
  SYSTEM:
    base_address: "0xFFFFFF00"
    desc: "Primary System Control Registers (SYS). Controls clocks, resets, and global system configurations."
    registers:
      SYSPC1:
        offset: "0x00"
        access: RW
        reset: "0x00000000"
        desc: "SYS Pin Control Register 1. Controls ECLK pin function."
        fields:
          - { name: ECPCLKFUN, bit: 0, access: RW, desc: "ECLK function. 0: GIO mode, 1: Functional mode (clock output)." }
      SYSPC2:
        offset: "0x04"
        access: RW
        reset: "0x00000000"
        desc: "SYS Pin Control Register 2. Controls ECLK direction in GIO mode."
        fields:
          - { name: ECPCLKDIR, bit: 0, access: RW, desc: "ECLK direction. 0: Input, 1: Output." }
      SYSPC3:
        offset: "0x08"
        access: RO
        reset: "0x00000000"
        desc: "SYS Pin Control Register 3. ECLK input data."
        fields:
          - { name: ECPCLKDIN, bit: 0, access: RO, desc: "ECLK data input. Reads the logic state of the ECLK pin." }
      SYSPC4:
        offset: "0x0C"
        access: RW
        reset: "0x00000000"
        desc: "SYS Pin Control Register 4. ECLK output data."
        fields:
          - { name: ECPCLKDOUT, bit: 0, access: RW, desc: "ECLK data output. 0: Drive low, 1: Drive high." }
      SYSPC5:
        offset: "0x10"
        access: RW
        reset: "0x00000000"
        desc: "SYS Pin Control Register 5. ECLK output set."
        fields:
          - { name: ECPCLKSET, bit: 0, access: RW, desc: "ECLK data set. Writing 1 drives pin high." }
      SYSPC6:
        offset: "0x14"
        access: RW
        reset: "0x00000000"
        desc: "SYS Pin Control Register 6. ECLK output clear."
        fields:
          - { name: ECPCLKCLR, bit: 0, access: RW, desc: "ECLK data clear. Writing 1 drives pin low." }
      SYSPC7:
        offset: "0x18"
        access: RW
        reset: "0x00000000"
        desc: "SYS Pin Control Register 7. ECLK open drain enable."
        fields:
          - { name: ECPCLKODE, bit: 0, access: RW, desc: "ECLK open drain enable. 0: Push/pull, 1: Open drain." }
      SYSPC8:
        offset: "0x1C"
        access: RW
        reset: "0x00000000"
        desc: "SYS Pin Control Register 8. ECLK pull enable."
        fields:
          - { name: ECPCLKPUE, bit: 0, access: RW, desc: "ECLK pull enable. 0: Enabled, 1: Disabled." }
      SYSPC9:
        offset: "0x20"
        access: RW
        reset: "0x00000000"
        desc: "SYS Pin Control Register 9. ECLK pull select."
        fields:
          - { name: ECPCLKPS, bit: 0, access: RW, desc: "ECLK pull select. 0: Pull down, 1: Pull up." }
      CSDIS:
        offset: "0x30"
        access: RW
        reset: "0x00000000"
        desc: "Clock Source Disable Register."
        fields:
          - { name: CLKSR7OFF, bit: 7, access: RW, desc: "Disable Clock Source 7 (EXTCLKIN2)." }
          - { name: CLKSR6OFF, bit: 6, access: RW, desc: "Disable Clock Source 6 (PLL2)." }
          - { name: CLKSR5OFF, bit: 5, access: RW, desc: "Disable Clock Source 5 (High Freq LPO)." }
          - { name: CLKSR4OFF, bit: 4, access: RW, desc: "Disable Clock Source 4 (Low Freq LPO)." }
          - { name: CLKSR3OFF, bit: 3, access: RW, desc: "Disable Clock Source 3 (EXTCLKIN1)." }
          - { name: CLKSR1OFF, bit: 1, access: RW, desc: "Disable Clock Source 1 (PLL1)." }
          - { name: CLKSR0OFF, bit: 0, access: RW, desc: "Disable Clock Source 0 (Oscillator)." }
      CSDISSET:
        offset: "0x34"
        access: RW
        reset: "0x00000000"
        desc: "Clock Source Disable Set Register. Writing 1 disables the clock source."
        fields:
          - { name: SETCLKSR7OFF, bit: 7, access: RW, desc: "Set disable for Clock Source 7." }
          - { name: SETCLKSR6OFF, bit: 6, access: RW, desc: "Set disable for Clock Source 6." }
          - { name: SETCLKSR5OFF, bit: 5, access: RW, desc: "Set disable for Clock Source 5." }
          - { name: SETCLKSR4OFF, bit: 4, access: RW, desc: "Set disable for Clock Source 4." }
          - { name: SETCLKSR3OFF, bit: 3, access: RW, desc: "Set disable for Clock Source 3." }
          - { name: SETCLKSR1OFF, bit: 1, access: RW, desc: "Set disable for Clock Source 1." }
          - { name: SETCLKSR0OFF, bit: 0, access: RW, desc: "Set disable for Clock Source 0." }
      CSDISCLR:
        offset: "0x38"
        access: RW
        reset: "0x00000000"
        desc: "Clock Source Disable Clear Register. Writing 1 enables the clock source."
        fields:
          - { name: CLRCLKSR7OFF, bit: 7, access: RW, desc: "Clear disable (enable) for Clock Source 7." }
          - { name: CLRCLKSR6OFF, bit: 6, access: RW, desc: "Clear disable (enable) for Clock Source 6." }
          - { name: CLRCLKSR5OFF, bit: 5, access: RW, desc: "Clear disable (enable) for Clock Source 5." }
          - { name: CLRCLKSR4OFF, bit: 4, access: RW, desc: "Clear disable (enable) for Clock Source 4." }
          - { name: CLRCLKSR3OFF, bit: 3, access: RW, desc: "Clear disable (enable) for Clock Source 3." }
          - { name: CLRCLKSR1OFF, bit: 1, access: RW, desc: "Clear disable (enable) for Clock Source 1." }
          - { name: CLRCLKSR0OFF, bit: 0, access: RW, desc: "Clear disable (enable) for Clock Source 0." }
      CDDIS:
        offset: "0x3C"
        access: RW
        reset: "0x00000000"
        desc: "Clock Domain Disable Register."
        fields:
          - { name: VCLKA4OFF, bit: 11, access: RW, desc: "VCLKA4 domain off." }
          - { name: VCLKA3OFF, bit: 10, access: RW, desc: "VCLKA3 domain off." }
          - { name: VCLK4OFF, bit: 9, access: RW, desc: "VCLK4 domain off." }
          - { name: VCLK3OFF, bit: 8, access: RW, desc: "VCLK3 domain off." }
          - { name: RTICLK1OFF, bit: 6, access: RW, desc: "RTICLK1 domain off." }
          - { name: VCLKA1OFF, bit: 4, access: RW, desc: "VCLKA1 domain off." }
          - { name: VCLK2OFF, bit: 3, access: RW, desc: "VCLK2 domain off." }
          - { name: VCLKPOFF, bit: 2, access: RW, desc: "VCLK_periph domain off." }
          - { name: HCLKOFF, bit: 1, access: RW, desc: "HCLK and VCLK_sys domains off." }
          - { name: GCLKOFF, bit: 0, access: RW, desc: "GCLK domain off." }
      CDDISSET:
        offset: "0x40"
        access: RW
        reset: "0x00000000"
        desc: "Clock Domain Disable Set Register. Writing 1 disables the clock domain."
        fields:
          - { name: SETVCLKA4OFF, bit: 11, access: RW, desc: "Set disable for VCLKA4 domain." }
          - { name: SETVCLKA3OFF, bit: 10, access: RW, desc: "Set disable for VCLKA3 domain." }
          - { name: SETVCLK4OFF, bit: 9, access: RW, desc: "Set disable for VCLK4 domain." }
          - { name: SETVCLK3OFF, bit: 8, access: RW, desc: "Set disable for VCLK3 domain." }
          - { name: SETRTI1CLKOFF, bit: 6, access: RW, desc: "Set disable for RTICLK1 domain." }
          - { name: SETVCLKA1OFF, bit: 4, access: RW, desc: "Set disable for VCLKA1 domain." }
          - { name: SETVCLK2OFF, bit: 3, access: RW, desc: "Set disable for VCLK2 domain." }
          - { name: SETVCLKPOFF, bit: 2, access: RW, desc: "Set disable for VCLK_periph domain." }
          - { name: SETHCLKOFF, bit: 1, access: RW, desc: "Set disable for HCLK domain." }
          - { name: SETGCLKOFF, bit: 0, access: RW, desc: "Set disable for GCLK domain." }
      CDDISCLR:
        offset: "0x44"
        access: RW
        reset: "0x00000000"
        desc: "Clock Domain Disable Clear Register. Writing 1 enables the clock domain."
        fields:
          - { name: CLRVCLKA4OFF, bit: 11, access: RW, desc: "Clear disable for VCLKA4 domain." }
          - { name: CLRVCLKA3OFF, bit: 10, access: RW, desc: "Clear disable for VCLKA3 domain." }
          - { name: CLRVCLK4OFF, bit: 9, access: RW, desc: "Clear disable for VCLK4 domain." }
          - { name: CLRVCLK3OFF, bit: 8, access: RW, desc: "Clear disable for VCLK3 domain." }
          - { name: CLRRTI1CLKOFF, bit: 6, access: RW, desc: "Clear disable for RTICLK1 domain." }
          - { name: CLRVCLKA1OFF, bit: 4, access: RW, desc: "Clear disable for VCLKA1 domain." }
          - { name: CLRVCLK2OFF, bit: 3, access: RW, desc: "Clear disable for VCLK2 domain." }
          - { name: CLRVCLKPOFF, bit: 2, access: RW, desc: "Clear disable for VCLK_periph domain." }
          - { name: CLRHCLKOFF, bit: 1, access: RW, desc: "Clear disable for HCLK domain." }
          - { name: CLRGCLKOFF, bit: 0, access: RW, desc: "Clear disable for GCLK domain." }
      GHVSRC:
        offset: "0x48"
        access: RW
        reset: "0x00000000"
        desc: "GCLK, HCLK, VCLK, and VCLK2 Source Register."
        fields:
          - { name: GHVWAKE, msb: 27, lsb: 24, access: RW, desc: "Source on wakeup. 0: Osc, 1: PLL1, 4: LF LPO, 5: HF LPO, 6: PLL2." }
          - { name: HVLPM, msb: 19, lsb: 16, access: RW, desc: "Source when GCLK off. 0: Osc, 1: PLL1, 4: LF LPO, 5: HF LPO, 6: PLL2." }
          - { name: GHVSRC, msb: 3, lsb: 0, access: RW, desc: "Current source. 0: Osc, 1: PLL1, 4: LF LPO, 5: HF LPO, 6: PLL2." }
      VCLKASRC:
        offset: "0x4C"
        access: RW
        reset: "0x00000000"
        desc: "Peripheral Asynchronous Clock Source Register."
        fields:
          - { name: VCLKA1S, msb: 3, lsb: 0, access: RW, desc: "VCLKA1 Source. 0: Osc, 1: PLL1, 2: Reserved, 3: EXTCLKIN1, 4: LF LPO, 5: HF LPO, 6: PLL2, 7: EXTCLKIN2, 8+: VCLK." }
      RCLKSRC:
        offset: "0x50"
        access: RW
        reset: "0x00000000"
        desc: "RTI Clock Source Register."
        fields:
          - { name: RTI1DIV, msb: 9, lsb: 8, access: RW, desc: "RTI1 Clock Divider. 0: /1, 1: /2, 2: /4, 3: /8." }
          - { name: RTI1SRC, msb: 3, lsb: 0, access: RW, desc: "RTI1 Source. 0: Osc, 1: PLL1, 2: Reserved, 3: EXTCLKIN1, 4: LF LPO, 5: HF LPO, 6: PLL2, 7: EXTCLKIN2, 8+: VCLK." }
      CSVSTAT:
        offset: "0x54"
        access: RO
        reset: "0x00000000"
        desc: "Clock Source Valid Status Register."
        fields:
          - { name: CLKSR7V, bit: 7, access: RO, desc: "Clock Source 7 (EXTCLKIN2) valid." }
          - { name: CLKSR6V, bit: 6, access: RO, desc: "Clock Source 6 (PLL2) valid." }
          - { name: CLKSR5V, bit: 5, access: RO, desc: "Clock Source 5 (HF LPO) valid." }
          - { name: CLKSR4V, bit: 4, access: RO, desc: "Clock Source 4 (LF LPO) valid." }
          - { name: CLKSR3V, bit: 3, access: RO, desc: "Clock Source 3 (EXTCLKIN1) valid." }
          - { name: CLKSR1V, bit: 1, access: RO, desc: "Clock Source 1 (PLL1) valid." }
          - { name: CLKSR0V, bit: 0, access: RO, desc: "Clock Source 0 (Oscillator) valid." }
      MSTGCR:
        offset: "0x58"
        access: RW
        reset: "0x00000000"
        desc: "Memory Self-Test Global Control Register."
        fields:
          - { name: MBIST_ALGSEL, msb: 23, lsb: 16, access: RW, desc: "Algorithm select. 1: Checkerboard, 2: March13N (0/1), 4: March11N (5/A), 8: March13N (3/C/F/0/6/9)." }
          - { name: ROM_DIV, msb: 9, lsb: 8, access: RW, desc: "ROM Clock Divider. 0: /1, 1: /2, 2: /4, 3: /8." }
          - { name: MSTGENA, msb: 3, lsb: 0, access: RW, desc: "Global Enable Key. 0xA: Enabled, Others: Disabled." }
      MINITGCR:
        offset: "0x5C"
        access: RW
        reset: "0x00000000"
        desc: "Memory Hardware Initialization Global Control Register."
        fields:
          - { name: MINITGENA, msb: 3, lsb: 0, access: RW, desc: "Global Enable Key. 0xA: Enabled, Others: Disabled." }
      MSINENA:
        offset: "0x60"
        access: RW
        reset: "0x00000000"
        desc: "Memory Self-Test/Initialization Enable Register."
        fields:
          - { name: MSIENA, msb: 31, lsb: 0, access: RW, desc: "Enable bits for each memory module (bit definition in Table 2-5)." }
      MSTFAIL:
        offset: "0x64"
        access: RW
        reset: "0x00000000"
        desc: "Memory Self-Test Fail Status Register."
        fields:
          - { name: MSTF, msb: 31, lsb: 0, access: RW, desc: "Fail status for each memory module. Write 1 to clear." }
      MSTCGSTAT:
        offset: "0x68"
        access: RW
        reset: "0x00000000"
        desc: "MSTC Global Status Register."
        fields:
          - { name: MINIDONE, bit: 8, access: RW, desc: "Memory initialization done. Write 1 to clear." }
          - { name: MSTDONE, bit: 0, access: RW, desc: "Memory self-test done. Write 1 to clear." }
      MINISTAT:
        offset: "0x6C"
        access: RW
        reset: "0x00000000"
        desc: "Memory Hardware Initialization Status Register."
        fields:
          - { name: MIDONE, msb: 31, lsb: 0, access: RW, desc: "Initialization done status for each memory module. Write 1 to clear." }
      PLLCTL1:
        offset: "0x70"
        access: RW
        reset: "0x00000000"
        desc: "PLL Control Register 1."
        fields:
          - { name: ROS, bit: 31, access: RW, desc: "Reset on Slip. 1: Reset system on PLL slip." }
          - { name: MASK_SLIP, msb: 30, lsb: 29, access: RW, desc: "Slip Mask. 0x2: Disable Bypass on Slip, Others: Enable Bypass on Slip." }
          - { name: PLLDIV, msb: 28, lsb: 24, access: RW, desc: "PLL Output Divider (R). R = PLLDIV + 1." }
          - { name: ROF, bit: 23, access: RW, desc: "Reset on Oscillator Fail. 1: Reset system." }
          - { name: REFCLKDIV, msb: 21, lsb: 16, access: RW, desc: "Reference Clock Divider (NR). NR = REFCLKDIV + 1." }
          - { name: PLLMUL, msb: 15, lsb: 0, access: RW, desc: "PLL Multiplier (NF). NF = (PLLMUL / 256) + 1." }
      PLLCTL2:
        offset: "0x74"
        access: RW
        reset: "0x00000000"
        desc: "PLL Control Register 2."
        fields:
          - { name: FMENA, bit: 31, access: RW, desc: "Frequency Modulation Enable. 1: Enable." }
          - { name: SPREADINGRATE, msb: 30, lsb: 22, access: RW, desc: "Spreading Rate (NS). NS = SPREADINGRATE + 1." }
          - { name: MULMOD, msb: 20, lsb: 12, access: RW, desc: "Multiplier Correction. Delta NF = MULMOD / 256." }
          - { name: ODPLL, msb: 11, lsb: 9, access: RW, desc: "Internal Output Divider (OD). OD = ODPLL + 1." }
          - { name: SPR_AMOUNT, msb: 8, lsb: 0, access: RW, desc: "Spreading Amount (NV). NV = (SPR_AMOUNT + 1) / 2048." }
      SYSPC10:
        offset: "0x78"
        access: RW
        reset: "0x00000000"
        desc: "SYS Pin Control Register 10."
        fields:
          - { name: ECPCLK_SLEW, bit: 0, access: RW, desc: "ECLK Slew Rate. 0: Fast, 1: Slow." }
      DIEIDL:
        offset: "0x7C"
        access: RO
        reset: "0x00000000"
        desc: "Die Identification Register Lower Word."
        fields:
          - { name: WAFER_NUM, msb: 31, lsb: 24, access: RO, desc: "Wafer Number." }
          - { name: Y_COORD, msb: 23, lsb: 12, access: RO, desc: "Y Wafer Coordinate." }
          - { name: X_COORD, msb: 11, lsb: 0, access: RO, desc: "X Wafer Coordinate." }
      DIEIDH:
        offset: "0x80"
        access: RO
        reset: "0x00000000"
        desc: "Die Identification Register Upper Word."
        fields:
          - { name: LOT_NUM, msb: 23, lsb: 0, access: RO, desc: "Lot Number." }
      LPOMONCTL:
        offset: "0x88"
        access: RW
        reset: "0x00000000"
        desc: "LPO/Clock Monitor Control Register."
        fields:
          - { name: BIAS_ENABLE, bit: 24, access: RW, desc: "LPO Bias Enable. 1: Enabled." }
          - { name: OSCFRQCONFIGCNT, bit: 16, access: RW, desc: "Oscillator Frequency Range. 0: <= 20MHz, 1: > 20MHz." }
          - { name: HFTRIM, msb: 12, lsb: 8, access: RW, desc: "HF LPO Trim." }
          - { name: LFTRIM, msb: 4, lsb: 0, access: RW, desc: "LF LPO Trim." }
      CLKTEST:
        offset: "0x8C"
        access: RW
        reset: "0x00000000"
        desc: "Clock Test Register."
        fields:
          - { name: ALTLIMPCLOCKENABLE, bit: 26, access: RW, desc: "Alternate Limp Clock Enable (GIOB[0])." }
          - { name: RANGEDETCTRL, bit: 25, access: RW, desc: "Range Detection Control." }
          - { name: RANGEDETENASSEL, bit: 24, access: RW, desc: "Range Detection Enable Select." }
          - { name: CLK_TEST_EN, msb: 19, lsb: 16, access: RW, desc: "Clock Test Enable. 0x5: Enabled." }
          - { name: SEL_GIO_PIN, msb: 11, lsb: 8, access: RW, desc: "GIOB[0] Clock Source Select." }
          - { name: SEL_ECP_PIN, msb: 3, lsb: 0, access: RW, desc: "ECLK Clock Source Select." }
      DFTCTRLREG:
        offset: "0x90"
        access: RW
        reset: "0x00000000"
        desc: "DFT Control Register."
        fields:
          - { name: DFTWRITE, msb: 13, lsb: 12, access: RW, desc: "DFT Logic Write Access." }
          - { name: DFTREAD, msb: 9, lsb: 8, access: RW, desc: "DFT Logic Read Access." }
          - { name: TEST_MODE_KEY, msb: 3, lsb: 0, access: RW, desc: "Test Mode Key. 0xA: Enable." }
      DFTCTRLREG2:
        offset: "0x94"
        access: RW
        reset: "0x00000000"
        desc: "DFT Control Register 2."
        fields:
          - { name: IMPDF, msb: 31, lsb: 4, access: RW, desc: "Implementation Defined." }
          - { name: TEST_MODE_KEY, msb: 3, lsb: 0, access: RW, desc: "Test Mode Key. 0xA: Enable." }
      GPREG1:
        offset: "0xA0"
        access: RW
        reset: "0x00000000"
        desc: "General Purpose Register 1."
        fields:
          - { name: EMIF_FUNC, bit: 31, access: RW, desc: "Enable EMIF output functions." }
          - { name: PLL1_FBSLIP_FILTER_COUNT, msb: 25, lsb: 20, access: RW, desc: "FBSLIP Filter Count." }
          - { name: PLL1_FBSLIP_FILTER_KEY, msb: 19, lsb: 16, access: RW, desc: "FBSLIP Filter Key. 0x5: Enable." }
          - { name: OUTPUT_BUFFER_LOW_EMI_MODE, msb: 15, lsb: 0, access: RW, desc: "Low EMI Mode for Output Buffers." }
      IMPFASTS:
        offset: "0xA8"
        access: RW
        reset: "0x00000000"
        desc: "Imprecise Fault Status Register."
        fields:
          - { name: MASTERID, msb: 23, lsb: 16, access: RW, desc: "Master ID responsible for abort." }
          - { name: EMIFA, bit: 10, access: RW, desc: "EMIF Abort Flag." }
          - { name: NCBA, bit: 9, access: RW, desc: "Non-cacheable Bufferable Abort Flag." }
          - { name: VBUSA, bit: 8, access: RW, desc: "VBUS Abort Flag." }
          - { name: ATYPE, bit: 0, access: RW, desc: "Abort Type. 0: Precise, 1: Imprecise." }
      IMPFTADD:
        offset: "0xAC"
        access: RO
        reset: "0x00000000"
        desc: "Imprecise Fault Write Address Register."
        fields:
          - { name: IMPFTADD, msb: 31, lsb: 0, access: RO, desc: "Fault Address." }
      SSIR1:
        offset: "0xB0"
        access: RW
        reset: "0x00000000"
        desc: "System Software Interrupt Request 1."
        fields:
          - { name: SSKEY1, msb: 15, lsb: 8, access: RW, desc: "Key (0x75) to trigger interrupt." }
          - { name: SSDATA1, msb: 7, lsb: 0, access: RW, desc: "Data associated with interrupt." }
      SSIR2:
        offset: "0xB4"
        access: RW
        reset: "0x00000000"
        desc: "System Software Interrupt Request 2."
        fields:
          - { name: SSKEY2, msb: 15, lsb: 8, access: RW, desc: "Key (0x84) to trigger interrupt." }
          - { name: SSDATA2, msb: 7, lsb: 0, access: RW, desc: "Data associated with interrupt." }
      SSIR3:
        offset: "0xB8"
        access: RW
        reset: "0x00000000"
        desc: "System Software Interrupt Request 3."
        fields:
          - { name: SSKEY3, msb: 15, lsb: 8, access: RW, desc: "Key (0x93) to trigger interrupt." }
          - { name: SSDATA3, msb: 7, lsb: 0, access: RW, desc: "Data associated with interrupt." }
      SSIR4:
        offset: "0xBC"
        access: RW
        reset: "0x00000000"
        desc: "System Software Interrupt Request 4."
        fields:
          - { name: SSKEY4, msb: 15, lsb: 8, access: RW, desc: "Key (0xA2) to trigger interrupt." }
          - { name: SSDATA4, msb: 7, lsb: 0, access: RW, desc: "Data associated with interrupt." }
      RAMGCR:
        offset: "0xC0"
        access: RW
        reset: "0x00000000"
        desc: "RAM Control Register."
        fields:
          - { name: RAM_DFT_EN, msb: 19, lsb: 16, access: RW, desc: "RAM DFT Enable (TI Internal)." }
          - { name: WST_AENA0, bit: 2, access: RW, desc: "Wait state address enable. 1: +1 HCLK cycle." }
          - { name: WST_DENA0, bit: 0, access: RW, desc: "Wait state data enable. 1: +1 HCLK cycle." }
      BMMCR1:
        offset: "0xC4"
        access: RW
        reset: "0x00000005"
        desc: "Bus Matrix Module Control Register 1."
        fields:
          - { name: MEMSW, msb: 3, lsb: 0, access: RW, desc: "Memory Swap Key. 0x5: Swapped, 0xA: Default." }
      CPURSTCR:
        offset: "0xCC"
        access: RW
        reset: "0x00000000"
        desc: "CPU Reset Control Register."
        fields:
          - { name: CPU_RESET, bit: 0, access: RW, desc: "CPU Reset. Write to toggle." }
      CLKCNTL:
        offset: "0xD0"
        access: RW
        reset: "0x00000000"
        desc: "Clock Control Register."
        fields:
          - { name: VCLK2R, msb: 27, lsb: 24, access: RW, desc: "VCLK2 Ratio. 0: /1 ... F: /16." }
          - { name: VCLKR, msb: 19, lsb: 16, access: RW, desc: "VCLK Ratio. 0: /1 ... F: /16." }
          - { name: PENA, bit: 8, access: RW, desc: "Peripheral Enable. 1: Peripherals out of reset." }
      ECPCNTL:
        offset: "0xD4"
        access: RW
        reset: "0x00000000"
        desc: "ECP Control Register."
        fields:
          - { name: ECPSSEL, bit: 24, access: RW, desc: "Clock Source Select. 0: VCLK, 1: OSCIN." }
          - { name: ECPCOS, bit: 23, access: RW, desc: "Continue On Suspend. 1: Continue." }
          - { name: ECPINSEL, msb: 17, lsb: 16, access: RW, desc: "Input Source Select. 1: HCLK, 2: External." }
          - { name: ECPDIV, msb: 15, lsb: 0, access: RW, desc: "Clock Divider. Output = Input / (ECPDIV + 1)." }
      DEVCR1:
