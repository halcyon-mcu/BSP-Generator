        desc: "LIN Receive Buffer 1 Register"
        fields:
          - { name: RD4, msb: 31, lsb: 24, access: RO, desc: "Receive buffer 4 (Byte 4)." }
          - { name: RD5, msb: 23, lsb: 16, access: RO, desc: "Receive buffer 5 (Byte 5)." }
          - { name: RD6, msb: 15, lsb: 8, access: RO, desc: "Receive buffer 6 (Byte 6)." }
          - { name: RD7, msb: 7, lsb: 0, access: RO, desc: "Receive buffer 7 (Byte 7)." }
      LINMASK:
        offset: "0x6C"
        access: RW
        reset: "0x00000000"
        desc: "LIN Mask Register"
        fields:
          - { name: RX_ID_MASK, msb: 23, lsb: 16, access: RW, desc: "Receive ID mask." }
          - { name: TX_ID_MASK, msb: 7, lsb: 0, access: RW, desc: "Transmit ID mask." }
      LINID:
        offset: "0x70"
        access: RW
        reset: "0x00000000"
        desc: "LIN Identification Register"
        fields:
          - { name: RECEIVED_ID, msb: 23, lsb: 16, access: RO, desc: "Received identification." }
          - { name: ID_SLAVETASK_BYTE, msb: 15, lsb: 8, access: RW, desc: "ID-SlaveTask Byte." }
          - { name: ID_BYTE, msb: 7, lsb: 0, access: RW, desc: "ID byte." }
      LINTD0:
        offset: "0x74"
        access: RW
        reset: "0x00000000"
        desc: "LIN Transmit Buffer 0 Register"
        fields:
          - { name: TD0, msb: 31, lsb: 24, access: RW, desc: "Transmit buffer 0 (Byte 0)." }
          - { name: TD1, msb: 23, lsb: 16, access: RW, desc: "Transmit buffer 1 (Byte 1)." }
          - { name: TD2, msb: 15, lsb: 8, access: RW, desc: "Transmit buffer 2 (Byte 2)." }
          - { name: TD3, msb: 7, lsb: 0, access: RW, desc: "Transmit buffer 3 (Byte 3)." }
      LINTD1:
        offset: "0x78"
        access: RW
        reset: "0x00000000"
        desc: "LIN Transmit Buffer 1 Register"
        fields:
          - { name: TD4, msb: 31, lsb: 24, access: RW, desc: "Transmit buffer 4 (Byte 4)." }
          - { name: TD5, msb: 23, lsb: 16, access: RW, desc: "Transmit buffer 5 (Byte 5)." }
          - { name: TD6, msb: 15, lsb: 8, access: RW, desc: "Transmit buffer 6 (Byte 6)." }
          - { name: TD7, msb: 7, lsb: 0, access: RW, desc: "Transmit buffer 7 (Byte 7)." }
      MBRS:
        offset: "0x7C"
        access: RW
        desc: "Maximum Baud Rate Selection Register"
      IODFTCTRL:
        offset: "0x90"
        access: RW
        reset: "0x00000000"
        desc: "Input/Output Error Enable Register"
        fields:
          - { name: BEN, bit: 31, access: RW, desc: "Bit error enable." }
          - { name: PBEN, bit: 30, access: RW, desc: "Physical bus error enable." }
          - { name: CEN, bit: 29, access: RW, desc: "Checksum error enable." }
          - { name: ISFE, bit: 28, access: RW, desc: "Inconsistent synch field error enable." }
          - { name: FEN, bit: 26, access: RW, desc: "Frame error enable." }
          - { name: PEN, bit: 25, access: RW, desc: "Parity error enable." }
          - { name: BRKDT_ENA, bit: 24, access: RW, desc: "Break detect error enable." }
          - { name: PIN_SAMPLE_MASK, msb: 20, lsb: 19, access: RW, desc: "Pin sample mask." }
          - { name: TX_SHIFT, msb: 18, lsb: 16, access: RW, desc: "Transmit shift." }
          - { name: IODFTENA, msb: 11, lsb: 8, access: RW, desc: "IODFT enable key." }
          - { name: LPB_ENA, bit: 1, access: RW, desc: "Module loopback enable." }
          - { name: RXP_ENA, bit: 0, access: RW, desc: "Module analog loopback through receive pin enable." }

  VIM:
    base_address: "0xFFFFFE00"
    desc: "Vectored Interrupt Manager (VIM) Control Registers"
    registers:
      # Parity-related VIM regs live at base 0xFFFFFD00 per TRM; keep separate peripheral for clarity.
      IRQINDEX:    { offset: "0x0000", access: RO, reset: "0x00000000", desc: "IRQ Index Offset Vector Register" }
      FIQINDEX:    { offset: "0x0004", access: RO, reset: "0x00000000", desc: "FIQ Index Offset Vector Register" }

      FIRQPR0:     { offset: "0x0010", access: RW, reset: "0x00000000", desc: "FIQ/IRQ Program Control Register 0" }
      FIRQPR1:     { offset: "0x0014", access: RW, reset: "0x00000000", desc: "FIQ/IRQ Program Control Register 1" }
      FIRQPR2:     { offset: "0x0018", access: RW, reset: "0x00000000", desc: "FIQ/IRQ Program Control Register 2" }
      FIRQPR3:     { offset: "0x001C", access: RW, reset: "0x00000000", desc: "FIQ/IRQ Program Control Register 3" }

      INTREQ0:     { offset: "0x0020", access: RO, reset: "0x00000000", desc: "Pending Interrupt Read Location Register 0" }
      INTREQ1:     { offset: "0x0024", access: RO, reset: "0x00000000", desc: "Pending Interrupt Read Location Register 1" }
      INTREQ2:     { offset: "0x0028", access: RO, reset: "0x00000000", desc: "Pending Interrupt Read Location Register 2" }
      INTREQ3:     { offset: "0x002C", access: RO, reset: "0x00000000", desc: "Pending Interrupt Read Location Register 3" }

      REQENASET0:  { offset: "0x0030", access: RW, reset: "0x00000000", desc: "Interrupt Enable Set Register 0" }
      REQENASET1:  { offset: "0x0034", access: RW, reset: "0x00000000", desc: "Interrupt Enable Set Register 1" }
      REQENASET2:  { offset: "0x0038", access: RW, reset: "0x00000000", desc: "Interrupt Enable Set Register 2" }
      REQENASET3:  { offset: "0x003C", access: RW, reset: "0x00000000", desc: "Interrupt Enable Set Register 3" }

      REQENACLR0:  { offset: "0x0040", access: RW, reset: "0x00000000", desc: "Interrupt Enable Clear Register 0" }
      REQENACLR1:  { offset: "0x0044", access: RW, reset: "0x00000000", desc: "Interrupt Enable Clear Register 1" }
      REQENACLR2:  { offset: "0x0048", access: RW, reset: "0x00000000", desc: "Interrupt Enable Clear Register 2" }
      REQENACLR3:  { offset: "0x004C", access: RW, reset: "0x00000000", desc: "Interrupt Enable Clear Register 3" }

      WAKENASET0:  { offset: "0x0050", access: RW, reset: "0x00000000", desc: "Wake-up Enable Set Register 0" }
      WAKENASET1:  { offset: "0x0054", access: RW, reset: "0x00000000", desc: "Wake-up Enable Set Register 1" }
      WAKENASET2:  { offset: "0x0058", access: RW, reset: "0x00000000", desc: "Wake-up Enable Set Register 2" }
      WAKENASET3:  { offset: "0x005C", access: RW, reset: "0x00000000", desc: "Wake-up Enable Set Register 3" }

      WAKENACLR0:  { offset: "0x0060", access: RW, reset: "0x00000000", desc: "Wake-up Enable Clear Register 0" }
      WAKENACLR1:  { offset: "0x0064", access: RW, reset: "0x00000000", desc: "Wake-up Enable Clear Register 1" }
      WAKENACLR2:  { offset: "0x0068", access: RW, reset: "0x00000000", desc: "Wake-up Enable Clear Register 2" }
      WAKENACLR3:  { offset: "0x006C", access: RW, reset: "0x00000000", desc: "Wake-up Enable Clear Register 3" }

      IRQVECREG:   { offset: "0x0070", access: RO, reset: "0x00000000", desc: "IRQ Interrupt Vector Register" }
      FIQVECREG:   { offset: "0x0074", access: RO, reset: "0x00000000", desc: "FIQ Interrupt Vector Register" }
      CAPEVT:      { offset: "0x0078", access: RO, reset: "0x00000000", desc: "Capture Event Register" }

      # CHANCTRL0..31 occupy 0x0080..0x00FC (one per channel). Model the base + note range.
      CHANCTRL0:   { offset: "0x0080", access: RW, reset: "0x00000000", desc: "VIM Interrupt Control Register (Channel 0)" }
      CHANCTRL1:   { offset: "0x0084", access: RW, reset: "0x00000000", desc: "VIM Interrupt Control Register (Channel 1)" }
      # ...
      CHANCTRL31:  { offset: "0x00FC", access: RW, reset: "0x00000000", desc: "VIM Interrupt Control Register (Channel 31)" }

  VIM_PARITY:
    base_address: "0xFFFFFD00"
    desc: "VIM parity-related registers"
    registers:
      PARFLG:    { offset: "0x00EC", access: RW, reset: "0x00000000", desc: "Interrupt Vector Table Parity Flag Register" }
      PARCTL:    { offset: "0x00F0", access: RW, reset: "0x00000000", desc: "Interrupt Vector Table Parity Control Register" }
      ADDERR:    { offset: "0x00F4", access: RO, reset: "0x00000000", desc: "Address Parity Error Register" }
      FBPARERR:  { offset: "0x00F8", access: RO, reset: "0x00000000", desc: "Fall-Back Address Parity Error Register" }

  IOMM:
    base_address: "0xFFFFEA00"
    desc: "I/O Multiplexing and Control Module (IOMM)"
    provenance:
      source: "4 IO Multiplexing and Control Module IOMM.pdf"
      page: "252-264"
    registers:
      REVISION_REG:
        offset: "0x00"
        access: R
        reset: "0x4E840102"
        desc: "Revision Register"
        fields:
          - { name: REV_SCHEME, msb: 31, lsb: 30, access: R, desc: "Revision Scheme, value = 01." }
          - { name: RESERVED_29_28, msb: 29, lsb: 28, access: R, desc: "Reserved" }
          - { name: REV_MODULE, msb: 27, lsb: 16, access: R, desc: "Module Id, value = E84h." }
          - { name: REV_RTL, msb: 15, lsb: 11, access: R, desc: "RTL Revision, value = 0." }
          - { name: REV_MAJOR, msb: 10, lsb: 8, access: R, desc: "Major Revision, value = 001." }
          - { name: REV_CUSTOM, msb: 7, lsb: 6, access: R, desc: "Custom Revision, value = 0." }
          - { name: REV_MINOR, msb: 5, lsb: 0, access: R, desc: "Minor Revision, value = 2h." }
      ENDIAN_REG:
        offset: "0x20"
        access: R
        reset: "0x00000000"
        desc: "Device Endianness Register"
        fields:
          - { name: RESERVED_31_1, msb: 31, lsb: 1, access: R, desc: "Reserved" }
          - { name: ENDIAN, bit: 0, access: R, desc: "Device endianness. 0: Little-endian, 1: Big-endian." }
      KICK_REG0:
        offset: "0x38"
        access: RW
        reset: "0x00000000"
        desc: "Kicker Register 0"
        fields:
          - { name: KICK0, msb: 31, lsb: 0, access: RW, desc: "Kicker 0 Register. Write 0x83E70B13 to unlock." }
      KICK_REG1:
        offset: "0x3C"
        access: RW
        reset: "0x00000000"
        desc: "Kicker Register 1"
        fields:
          - { name: KICK1, msb: 31, lsb: 0, access: RW, desc: "Kicker 1 Register. Write 0x95A4F1E0 to unlock." }
      ERR_RAW_STATUS_REG:
        offset: "0xE0"
        access: RW
        reset: "0x00000000"
        desc: "Error Raw Status / Set Register"
        fields:
          - { name: RESERVED_31_2, msb: 31, lsb: 2, access: R, desc: "Reserved" }
          - { name: ADDR_ERR, bit: 1, access: RW, desc: "Addressing Error Status. 1: Error detected. Write 0 has no effect." }
          - { name: PROT_ERR, bit: 0, access: RW, desc: "Protection Error Status. 1: Error detected. Write 0 has no effect." }
      ERR_ENABLED_STATUS_REG:
        offset: "0xE4"
        access: RW
        reset: "0x00000000"
        desc: "Error Enabled Status / Clear Register"
        fields:
          - { name: RESERVED_31_2, msb: 31, lsb: 2, access: R, desc: "Reserved" }
          - { name: ENABLED_ADDR_ERR, bit: 1, access: RW, desc: "Addressing Error Signaling Status. Read 1: Enabled. Write 1: Clear status." }
          - { name: ENABLED_PROT_ERR, bit: 0, access: RW, desc: "Protection Error Signaling Status. Read 1: Enabled. Write 1: Clear status." }
      ERR_ENABLE_REG:
        offset: "0xE8"
        access: RW
        reset: "0x00000000"
        desc: "Error Signaling Enable Register"
        fields:
          - { name: RESERVED_31_2, msb: 31, lsb: 2, access: R, desc: "Reserved" }
          - { name: ADDR_ERR_EN, bit: 1, access: RW, desc: "Addressing Error Signaling Enable. 1: Enable." }
          - { name: PROT_ERR_EN, bit: 0, access: RW, desc: "Protection Error Signaling Enable. 1: Enable." }
      ERR_ENABLE_CLR_REG:
        offset: "0xEC"
        access: RW
        reset: "0x00000000"
        desc: "Error Signaling Enable Clear Register"
        fields:
          - { name: RESERVED_31_2, msb: 31, lsb: 2, access: R, desc: "Reserved" }
          - { name: ADDR_ERR_EN_CLR, bit: 1, access: RW, desc: "Addressing Error Signaling Enable Clear. Write 1 to disable." }
          - { name: PROT_ERR_EN_CLR, bit: 0, access: RW, desc: "Protection Error Signaling Enable Clear. Write 1 to disable." }
      FAULT_ADDRESS_REG:
        offset: "0xF4"
        access: RW
        reset: "0x00000000"
        desc: "Fault Address Register"
        fields:
          - { name: RESERVED_31_9, msb: 31, lsb: 9, access: R, desc: "Reserved" }
          - { name: FAULT_ADDR, msb: 8, lsb: 0, access: RW, desc: "Fault Address offset." }
      FAULT_STATUS_REG:
        offset: "0xF8"
        access: R
        reset: "0x00000000"
        desc: "Fault Status Register"
        fields:
          - { name: RESERVED_31_28, msb: 31, lsb: 28, access: R, desc: "Reserved" }
          - { name: FAULT_ID, msb: 27, lsb: 24, access: R, desc: "Faulting Transaction ID." }
          - { name: FAULT_MSTID, msb: 23, lsb: 16, access: R, desc: "ID of Master that initiated the faulting transaction." }
          - { name: RESERVED_15_13, msb: 15, lsb: 13, access: R, desc: "Reserved" }
          - { name: FAULT_PRIVID, msb: 12, lsb: 9, access: R, desc: "Faulting Privilege ID." }
          - { name: RESERVED_8_6, msb: 8, lsb: 6, access: R, desc: "Reserved" }
          - { name: FAULT_TYPE, msb: 5, lsb: 0, access: R, desc: "Type of fault detected. 1=User Exec, 2=User Write, 4=User Read, 8=Sup Exec, 10h=Sup Write, 20h=Sup Read." }
      FAULT_CLEAR_REG:
        offset: "0xFC"
        access: RW
        reset: "0x00000000"
        desc: "Fault Clear Register"
        fields:
          - { name: RESERVED_31_1, msb: 31, lsb: 1, access: R, desc: "Reserved" }
          - { name: FAULT_CLEAR, bit: 0, access: RW, desc: "Fault Clear. Write 1 to clear current fault." }
      PINMMR_0_47:
        offset: "0xB10"
        access: RW
        reset: "0x01010101"
        desc: "Pin Multiplexing Control Registers 0 to 47. Each register controls multiplexing for 4 pins."
        x-ext:
          range: "PINMMR_0 to PINMMR_47"
          count: 48
          stride: 4
        fields:
          - { name: PINMMRx_31_24, msb: 31, lsb: 24, access: RW, desc: "Control functionality for ball/pin (Byte 3). See Output Multiplexing table." }
          - { name: PINMMRx_23_16, msb: 23, lsb: 16, access: RW, desc: "Control functionality for ball/pin (Byte 2). See Output Multiplexing table." }
          - { name: PINMMRx_15_8, msb: 15, lsb: 8, access: RW, desc: "Control functionality for ball/pin (Byte 1). See Output Multiplexing table." }
          - { name: PINMMRx_7_0, msb: 7, lsb: 0, access: RW, desc: "Control functionality for ball/pin (Byte 0). See Output Multiplexing table." }

  



