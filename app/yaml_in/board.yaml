        pin: 97
      - name: MII_RXCLK / RMII_REFCLK
        pin: 107
      - name: MII_RX_DV
        pin: 127
      - name: MII_RX_ER / RMII_RX_ER
        pin: 86
      - name: MII_CRS / RMII_CRS_DV
        pin: 124
      - name: MII_COL
        pin: 130
      - name: MDIO
        pin: 40
      - name: MDCLK
        pin: 37
      notes: Ethernet PHY not populated on this board
    phy_populated: false
