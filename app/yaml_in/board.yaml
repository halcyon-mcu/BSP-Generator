connectors:
- designator: J2, J3, J4, J5
  type: BoosterPack Site 1
  pins: 40
  description: TI BoosterPack 40-pin expansion connector (site 1)
  standards_compatible: 20-pin and 40-pin BoosterPack
- designator: J6, J7, J8, J9
  type: BoosterPack Site 2
  pins: 40
  description: TI BoosterPack 40-pin expansion connector (site 2)
  standards_compatible: 20-pin and 40-pin BoosterPack
- designator: J11
  type: Proto Header
  pins: 50
  description: General purpose prototype header with additional signals
- designator: J1
  type: JTAG Debug
  pins: 20
  description: 20-pin JTAG connector (0.1" pitch) for Hercules MCU
  signals_available:
  - TMS
  - TCK
  - TDI
  - TDO
  - nTRST
  - RTCK
  - CAN1/2/3 (RX/TX)
  - LIN1 (RX/TX)
  - SCI (RX/TX)
gpio_mapping:
  GIOB[2]:
    function: USER LED
    pin: 142
    component: LED2
    type: output
  GIOB[1]:
    function: USER LED
    pin: 133
    component: LED3
    type: output
  GIOB[?]:
    function: USER button
    pin: 55
    component: S3
    type: input
hardware_limitations:
  missing_components:
  - CAN transceivers (DCAN1, DCAN2, DCAN3) - signals available, external transceiver required
  - LIN transceiver (LIN1) - signals available, external transceiver required
  - Ethernet PHY chip - MII/RMII signals available, external PHY required
  - Target USB connector - USB signals available but not routed to connector
  notes:
  - USB connector (J13) is for debug interface only (XDS ICDIv2), not target MCU USB
  - CAN, LIN, and Ethernet require external transceiver/PHY for operation
  - Debug MCU (TM4C129) provides JTAG, UART passthrough, and current monitoring
  - BoosterPack connectors support standard TI BoosterPack expansion modules
  - Light sensor (TEMT6000) is populated and connected to AD1IN[6]
  - 'Two reset buttons: S1 (power-on reset), S2 (warm reset)'
  - Voltage supervisor (TPS3106K33) monitors both 1.2V and 3.3V rails
x-ext:
  extraction_date: '2026-02-03'
  reset:
    supervisor:
      part_number: TPS3106K33
      package: DBV_6
      designator: U2
      description: Voltage supervisor with reset output
      threshold:
        sense_voltage_min: 0.542
        sense_voltage_max: 0.559
        units: V
        description: 'SENSE threshold: 0.542V - 0.559V'
      connections:
        vdd:
          pin: 6
          connected_to: +3V3
        sense:
          pin: 4
          connected_to: +1V2
          description: Monitors 1.2V core voltage
        reset_vdd:
          pin: 1
          net_name: NPORRST
          description: Reset output for VDD monitoring
        reset_sense:
          pin: 5
          description: Reset output for SENSE monitoring
        mr:
          pin: 3
          description: Manual Reset input
          connection: HERCULES_MR_PB
    buttons:
      power_on_reset:
        designator: S1
        type: TACT6MM_NO_MOM
        function: POWER ON RESET
        connection: HERCULES_MR_PB
        pull_up:
          resistor: R8
          value: 2.2kΩ
          connection: +3V3
      warm_reset:
        designator: S2
        type: TACT6MM_NO_MOM
        function: WARM RESET
        connection: HERCULES_NRST
        pull_up:
          resistor: R9
          value: 2.2kΩ
          connection: +3V3
    mcu_connections:
      nporrst:
        mcu_pin: 46
        net_name: NPORRST
        description: Power-On Reset (active low)
        pull_up:
          resistor: R7
          value: 2.2kΩ
          connection: +3V3
      nrst:
        mcu_pin: 116
        net_name: NRST / HERCULES_NRST
        description: System Reset (active low)
        decoupling:
          capacitor: C3
          value: 1000pF
          connection: GND
  error_signal:
    mcu_pin: 117
    net_name: NERROR
    description: Error output signal (active low)
  power_leds:
  - designator: LED4
    color: GRN
    function: +3V3 Power Indicator
    series_resistor:
      designator: R22
      value: 2.2kΩ
    connection: +3V3
  - designator: LED6
    color: GRN
    function: +5V Power Indicator
    series_resistor:
      designator: R27
      value: 2.2kΩ
    connection: +5V
  - designator: LED9
    color: RED
    function: USB Power Indicator
    series_resistor:
      designator: R42
      value: 2.2kΩ
    connection: +5V_USB
  debug_mcu_leds:
    description: LEDs on TM4C debug controller
    leds:
    - designator: LED7
      color: GRN
      function: Debug status
    - designator: LED8
      color: GRN
      function: Debug status
