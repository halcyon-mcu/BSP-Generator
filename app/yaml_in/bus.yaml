clock_sources:
  XTAL:
    type: crystal
    frequency_hz: 16000000
    x-ext:
      schematic:
        designator: Y1
        frequency_mhz: 16.0
        load_capacitors:
        - designator: C1
          value: 33pF
          tolerance: ±5%
          pin: 18
        - designator: C2
          value: 33pF
          tolerance: ±5%
          pin: 20
        pins:
          oscin: 18
          oscout: 20
          kelvin_gnd: 19
        source: RM46_schematic.pdf
