target_board: LAUNCHXL2-TMS57012-RM46
modules:
  enabled:
  - SCI
  - GIO
  - LIN
  - PLL
  - IOMM
  - PCR
  - SYSTEM
  - VIM
sci:
  default_baud: 9600
pins:
  lock_board_mapping: true
clocks:
  mode: board_default
strict_validation: true
contract_mode: auto_fix_then_fail
contract_lock_mode: strict
bringup_mode:
  default: direct_init
startup_contract:
  gate_mode: warn
parity_guard:
  mode: critical_only
  baseline_path: app/output_working_with_manual_changes
  critical_registers:
    - CSDIS
    - CSDISSET
    - CSDISCLR
    - CDDIS
    - GHVSRC
    - RCLKSRC
    - VCLKASRC
    - CSVSTAT
    - PLLCTL1
    - PLLCTL2
    - PLLCTL3
    - CLKCNTL
    - GLBSTAT
    - PINMMR7
    - PINMMR8
    - SCIPIO0
    - GCR0
    - BRS
    - FORMAT
    - PSPWRDWNCLR0
    - PSPWRDWNCLR1
    - PSPWRDWNCLR2
    - PSPWRDWNCLR3
    - PCSPWRDWNCLR0
    - PCSPWRDWNCLR1
bsp_validation:
  enabled: false
  baud: 9600
  primary_serial_path: lin_only
  force_sci_init: false
  force_sci_tx: false
  frame:
    data_bits: 8
    stop_bits: 1
    parity: none
  banners:
    sci: "SCI path active (A)\\r\\n"
    lin: "LIN path active (B)\\r\\n"
  timing:
    heartbeat_ticks: 1000
    tx_period_ticks: 200
    busy_delay: 200
build_gate:
  enabled: true
  mode: strict
  external_workspace_path: "C:/Users/dovyd/workspace_v10"
  project_name: "Blinky2"
  configuration: Debug
  # User preference: one extra correction round (no full runs by Codex).
  max_fix_rounds: 4
  allow_targeted_llm_rewrite: true
  fail_on_compile_error: true
  clean_stale_project_files: true
  clean_build: true
  llm_rewrite:
    enabled: true
    scope: top_files
    top_k_files: 2
    apply_policy: diff_only
    model: inherit
    max_tokens: 6000
    max_attempts: 2
    include_contract_context: true
bringup:
  mode: strict
  contract_file: app/yaml_in/bringup_contract.yaml
  fail_on_contract_mismatch: true
  emit_debug_probes: false
app_intent:
  enabled: true
  critical_file_freeze: true
  allow_llm_on_critical: false
  task_library_path: app/yaml_in/firmware_tasks.yaml
  intent_refs_mode: proven_only
  generate_firmware_pass: true
  post_gen_max_tokens: 8000
