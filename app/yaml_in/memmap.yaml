ir_schema_version: "1.1.0"
memory:
  - name: "FLASH"
    origin: "0x00000000"
    length: "0x00150000"   # 1,382,400 bytes (~1.3125 MB) per file range
    attrs: "rx"
  - name: "SRAM"
    origin: "0x08000000"
    length: "0x00030000"   # 192 KB
    attrs: "rwx"

  # Optional peripheral RAMs (documented for future use)
  - name: "MIBSPI1_RAM"
    origin: "0xFF0E0000"
    length: 0x00002000      # TODO: confirm exact size from TRM
    attrs: "rwx"
  - name: "MIBSPI3_RAM"
    origin: "0xFF0C0000"
    length: 0x00002000      # TODO
    attrs: "rwx"
  - name: "MIBSPI5_RAM"
    origin: "0xFF0A0000"
    length: 0x00002000      # TODO
    attrs: "rwx"

link:
  vector_table: "0x00000000"   # IVT at start of flash
startup:
  reset_handler: "0x00001000"  # as noted in md (can be relocated by linker)
provenance:
  notes:
    - "Flash/RAM ranges and IVT/reset handler locations from RM46_Hardware_Info.md"
