        fields:
          - { name: "TEC", msb: 7, lsb: 0, access: RW, desc: "Transmit Error Counter" }
          - { name: "REC", msb: 14, lsb: 8, access: RW, desc: "Receive Error Counter" }
          - { name: "RP", bit: 15, access: RW, desc: "Receive Error Passive" }
      DCAN_BTR:
        offset: '0x0C'
        access: RW
        reset: '0x00002301'
        desc: "Bit Timing Register"
        fields:
          - { name: "BRP", msb: 5, lsb: 0, access: RW, desc: "Baud Rate Prescaler" }
          - { name: "SJW", msb: 7, lsb: 6, access: RW, desc: "Synchronization Jump Width" }
          - { name: "TSeg1", msb: 11, lsb: 8, access: RW, desc: "Time segment before the sample point" }
          - { name: "TSeg2", msb: 14, lsb: 12, access: RW, desc: "Time segment after the sample point" }
          - { name: "BRPE", msb: 19, lsb: 16, access: RW, desc: "Baud Rate Prescaler Extension" }
      DCAN_INT:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Register"
        fields:
          - { name: "Int0ID", msb: 15, lsb: 0, access: RW, desc: "Interrupt 0 Identifier" }
          - { name: "Int1ID", msb: 23, lsb: 16, access: RW, desc: "Interrupt 1 Identifier" }
      DCAN_TEST:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "Test Register"
        fields:
          - { name: "Silent", bit: 3, access: RW, desc: "Silent Mode" }
          - { name: "LBack", bit: 4, access: RW, desc: "Loop Back Mode" }
          - { name: "Tx", msb: 6, lsb: 5, access: RW, desc: "Control of CAN_TX pin" }
          - { name: "Rx", bit: 7, access: RW, desc: "Receive Pin monitor" }
          - { name: "EXL", bit: 8, access: RW, desc: "External Loop Back Mode" }
          - { name: "RDA", bit: 9, access: RW, desc: "RAM Direct Access Enable" }
      DCAN_PERR:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "Parity Error Code Register"
        fields:
          - { name: "MessageNumber", msb: 7, lsb: 0, access: RW, desc: "Message object number where parity error detected" }
          - { name: "WordNumber", msb: 10, lsb: 8, access: RW, desc: "Word number where parity error detected" }
      DCAN_ABOTR:
        offset: '0x80'
        access: RW
        reset: '0x00000000'
