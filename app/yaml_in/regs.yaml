      DCCCNT1:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "DCC Counter1 Value Register"
        fields:
          - { name: "COUNT1", msb: 19, lsb: 0, access: RO, desc: "Current value for DCC counter1. Read-only" }
      DCCCNT1CLKSRC:
        offset: '0x24'
        access: RW
        reset: '0x00005000'
        desc: "DCC Counter1 Clock Source Selection Register"
        fields:
          - { name: "KEY", msb: 15, lsb: 12, access: RW, desc: "Key to enable clock source selection. Ah=Enable CNT1_CLKSRC field, Other=N2HET signal used" }
          - { name: "CNT1_CLKSRC", msb: 3, lsb: 0, access: RW, desc: "Clock source for counter1 when KEY is Ah. Refer to device datasheet for options" }
      DCCCNT0CLKSRC:
        offset: '0x28'
        access: RW
        reset: '0x00000005'
        desc: "DCC Counter0 Clock Source Selection Register"
        fields:
          - { name: "CNT0_CLKSRC", msb: 3, lsb: 0, access: RW, desc: "Clock source for counter0. Refer to device datasheet for available options" }

  DMA:
    base_address: '0xFFFFF000'
    desc: ''
    registers:
      GCTRL:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "Global Control Register"
        fields:
          - { name: "DMA_EN", bit: 16, access: RW, desc: "DMA enable bit. Configuration registers and channel control packets should be setup first before DMA_EN bit is set to 1 to prevent state machines from carrying out bus transactions." }
          - { name: "BUS_BUSY", bit: 14, access: RW, desc: "Status of DMA external AHB bus status. 0=DMAs external bus is not busy in data transfers, 1=DMAs external bus is busy in data transfers" }
          - { name: "DEBUG_MODE", msb: 9, lsb: 8, access: RW, desc: "Debug Mode. 0=Ignore suspend, 1h=Finish current block transfer, 2h=Finish current frame transfer, 3h=Immediately stop at DMA arbitration boundary and continue after suspend" }
          - { name: "DMA_RES", bit: 0, access: RW, desc: "DMA software reset. 0=Software reset disabled, 1=DMA state machine and all control registers in software reset" }
      PEND:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "Channel Pending Register"
        fields:
          - { name: "PEND", msb: 15, lsb: 0, access: RW, desc: "Channel pending register. Bit 0 corresponds to channel 0, bit 1 to channel 1. Reading gives channel pending information if channel was initiated by SW or HW." }
