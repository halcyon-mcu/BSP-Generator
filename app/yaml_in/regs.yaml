        desc: "FTC Interrupt Mapping Register"
        fields:
          - { name: "FTCAB", msb: 15, lsb: 0, access: RW, desc: "Frame transfer complete (FTC) interrupt to Group A or Group B. 0=routed to Group A, 1=routed to Group B" }
      LFSMAP:
        offset: '0xBC'
        access: RW
        reset: '0x00000000'
        desc: "LFS Interrupt Mapping Register"
        fields:
          - { name: "LFSAB", msb: 15, lsb: 0, access: RW, desc: "Last frame started (LFS) interrupt to Group A or Group B. 0=routed to Group A, 1=routed to Group B" }
      HBCMAP:
        offset: '0xC4'
        access: RW
        reset: '0x00000000'
        desc: "HBC Interrupt Mapping Register"
        fields:
          - { name: "HBCAB", msb: 15, lsb: 0, access: RW, desc: "Half block complete (HBC) interrupt to Group A or Group B. 0=routed to Group A, 1=routed to Group B" }
      BTCMAP:
        offset: '0xCC'
        access: RW
        reset: '0x00000000'
        desc: "BTC Interrupt Mapping Register"
        fields:
          - { name: "BTCAB", msb: 15, lsb: 0, access: RW, desc: "Block transfer complete (BTC) interrupt to Group A or Group B. 0=routed to Group A, 1=routed to Group B" }
      FTCINTENAS:
        offset: '0xDC'
        access: RW
        reset: '0x00000000'
        desc: "FTC Interrupt Enable Set"
        fields:
          - { name: "FTCINTENA", msb: 15, lsb: 0, access: RW, desc: "Frame transfer complete (FTC) interrupt enable. Write 1 to enable." }
      FTCINTENAR:
        offset: '0xE4'
        access: RW
        reset: '0x00000000'
        desc: "FTC Interrupt Enable Reset"
        fields:
          - { name: "FTCINTDIS", msb: 15, lsb: 0, access: RW, desc: "Frame transfer complete (FTC) interrupt disable. Write 1 to disable." }
      LFSINTENAS:
        offset: '0xEC'
        access: RW
        reset: '0x00000000'
        desc: "LFS Interrupt Enable Set"
        fields:
          - { name: "LFSINTENA", msb: 15, lsb: 0, access: RW, desc: "Last frame started (LFS) interrupt enable. Write 1 to enable." }
      LFSINTENAR:
        offset: '0xF4'
        access: RW
        reset: '0x00000000'
        desc: "LFS Interrupt Enable Reset"
        fields:
          - { name: "LFSINTDIS", msb: 15, lsb: 0, access: RW, desc: "Last frame started (LFS) interrupt disable. Write 1 to disable." }
      HBCINTENAS:
        offset: '0xFC'
        access: RW
        reset: '0x00000000'
        desc: "HBC Interrupt Enable Set"
        fields:
          - { name: "HBCINTENA", msb: 15, lsb: 0, access: RW, desc: "Half block complete (HBC) interrupt enable. Write 1 to enable." }
      HBCINTENAR:
        offset: '0x104'
        access: RW
        reset: '0x00000000'
        desc: "HBC Interrupt Enable Reset"
        fields:
          - { name: "HBCINTDIS", msb: 15, lsb: 0, access: RW, desc: "Half block complete (HBC) interrupt disable. Write 1 to disable." }
      BTCINTENAS:
        offset: '0x10C'
        access: RW
        reset: '0x00000000'
        desc: "BTC Interrupt Enable Set"
        fields:
          - { name: "BTCINTENA", msb: 15, lsb: 0, access: RW, desc: "Block transfer complete (BTC) interrupt enable. Write 1 to enable." }
      BTCINTENAR:
        offset: '0x114'
        access: RW
        reset: '0x00000000'
        desc: "BTC Interrupt Enable Reset"
        fields:
          - { name: "BTCINTDIS", msb: 15, lsb: 0, access: RW, desc: "Block transfer complete (BTC) interrupt disable. Write 1 to disable." }
      GINTFLAG:
        offset: '0x11C'
        access: RW
        reset: '0x00000000'
        desc: "Global Interrupt Flag Register"
        fields:
          - { name: "GINT", msb: 15, lsb: 0, access: RW, desc: "Global interrupt flags. Global interrupt flag bit is OR function of FTC, LFS, HBC, and BTC interrupt flags." }
      FTCFLAG:
        offset: '0x124'
        access: RW
        reset: '0x00000000'
        desc: "FTC Interrupt Flag Register"
        fields:
          - { name: "FTCI", msb: 15, lsb: 0, access: RWC, desc: "Frame transfer complete (FTC) flags. Write 1 to clear." }
      LFSFLAG:
        offset: '0x12C'
        access: RW
        reset: '0x00000000'
        desc: "LFS Interrupt Flag Register"
        fields:
          - { name: "LFSI", msb: 15, lsb: 0, access: RWC, desc: "Last frame started (LFS) flags. Write 1 to clear." }
      HBCFLAG:
        offset: '0x134'
        access: RW
        reset: '0x00000000'
        desc: "HBC Interrupt Flag Register"
        fields:
          - { name: "HBCI", msb: 15, lsb: 0, access: RWC, desc: "Half block transfer (HBC) complete flags. Write 1 to clear." }
      BTCFLAG:
        offset: '0x13C'
        access: RW
        reset: '0x00000000'
        desc: "BTC Interrupt Flag Register"
        fields:
          - { name: "BTCI", msb: 15, lsb: 0, access: RWC, desc: "Block transfer complete (BTC) flags. Write 1 to clear." }
      BERFLAG:
        offset: '0x144'
        access: RW
        reset: '0x00000000'
        desc: "BER Interrupt Flag Register"
      FTCAOFFSET:
        offset: '0x14C'
        access: RW
        reset: '0x00000000'
        desc: "FTCA Interrupt Channel Offset Register"
        fields:
          - { name: "FTCA", msb: 5, lsb: 0, access: RW, desc: "Channel causing FTC interrupt Group A. 0=No interrupt pending, 1h=Channel 0, 10h=Channel 15. Reading clears corresponding flag." }
      LFSAOFFSET:
        offset: '0x150'
        access: RW
        reset: '0x00000000'
        desc: "LFSA Interrupt Channel Offset Register"
        fields:
          - { name: "LFSA", msb: 5, lsb: 0, access: RW, desc: "Channel causing LFS interrupt Group A. Reading clears corresponding flag." }
      HBCAOFFSET:
        offset: '0x154'
        access: RW
        reset: '0x00000000'
        desc: "HBCA Interrupt Channel Offset Register"
        fields:
          - { name: "HBCA", msb: 5, lsb: 0, access: RW, desc: "Channel causing HBC interrupt Group A. Reading clears corresponding flag." }
      BTCAOFFSET:
        offset: '0x158'
        access: RW
        reset: '0x00000000'
        desc: "BTCA Interrupt Channel Offset Register"
        fields:
          - { name: "BTCA", msb: 5, lsb: 0, access: RW, desc: "Channel causing BTC interrupt Group A. Reading clears corresponding flag." }
      FTCBOFFSET:
        offset: '0x160'
        access: RW
        reset: '0x00000000'
        desc: "FTCB Interrupt Channel Offset Register"
        fields:
          - { name: "FTCB", msb: 5, lsb: 0, access: RW, desc: "Channel causing FTC interrupt Group B. Reading clears corresponding flag." }
      LFSBOFFSET:
        offset: '0x164'
        access: RW
        reset: '0x00000000'
        desc: "LFSB Interrupt Channel Offset Register"
        fields:
          - { name: "LFSB", msb: 5, lsb: 0, access: RW, desc: "Channel causing LFS interrupt Group B. Reading clears corresponding flag." }
      HBCBOFFSET:
        offset: '0x168'
        access: RW
        reset: '0x00000000'
        desc: "HBCB Interrupt Channel Offset Register"
        fields:
          - { name: "HBCB", msb: 5, lsb: 0, access: RW, desc: "Channel causing HBC interrupt Group B. Reading clears corresponding flag." }
      BTCBOFFSET:
        offset: '0x16C'
        access: RW
        reset: '0x00000000'
        desc: "BTCB Interrupt Channel Offset Register"
        fields:
          - { name: "BTCB", msb: 5, lsb: 0, access: RW, desc: "Channel causing BTC interrupt Group B. Reading clears corresponding flag." }
      PTCRL:
        offset: '0x178'
        access: RW
        reset: '0x00000000'
        desc: "Port Control Register"
        fields:
          - { name: "PENDB", bit: 24, access: RW, desc: "Transfers pending for Port B. 0=No transfers pending, 1=Transfers pending" }
          - { name: "BYB", bit: 18, access: RW, desc: "Bypass FIFO B. 0=FIFO B not bypassed, 1=FIFO B bypassed" }
          - { name: "PSFRHQPB", bit: 17, access: RW, desc: "Priority scheme fix or rotate for high priority queue of Port B. 0=Fixed priority, 1=Rotation priority" }
          - { name: "PSFRLQPB", bit: 16, access: RW, desc: "Priority scheme fix or rotate for low priority queue of Port B. 0=Fixed priority, 1=Rotation priority" }
      RTCTRL:
        offset: '0x17C'
        access: RW
        reset: '0x00000000'
        desc: "RAM Test Control"
        fields:
          - { name: "RTC", bit: 0, access: RW, desc: "RAM Test Control. Writing 1 opens write access to reserved locations of control packet RAM. Should be cleared to 0 during normal operation." }
      DCTRL:
        offset: '0x180'
        access: RW
        reset: '0x00000000'
        desc: "Debug Control"
        fields:
          - { name: "CHNUM", msb: 28, lsb: 24, access: RW, desc: "Channel Number. Indicates channel number that causes watch point to match." }
          - { name: "DMADBGS", bit: 16, access: RWC, desc: "DMA debug status. When watch point condition is detected, bit is set to 1 and debug request signal is asserted. CPU must write 1 to clear." }
          - { name: "DBGEN", bit: 0, access: RW, desc: "Debug Enable. Can only be set when using debugger. 0=Debug disabled, 1=Watch point checking enabled" }
      WPR:
        offset: '0x184'
        access: RW
        reset: '0x00000000'
        desc: "Watch Point Register"
        fields:
          - { name: "WP", msb: 31, lsb: 0, access: RW, desc: "Watch point. 32-bit address can be programmed as watch point. Used with watch mask register." }
      WMR:
        offset: '0x188'
        access: RW
        reset: '0x00000000'
        desc: "Watch Mask Register"
        fields:
          - { name: "WM", msb: 31, lsb: 0, access: RW, desc: "Watch mask. 0=Allows corresponding bit in WPR to be used for address matching, 1=Masks corresponding bit in WPR and is disregarded" }
      PBACSADDR:
        offset: '0x198'
        access: RW
        reset: '0x00000000'
        desc: "Port B Active Channel Source Address Register"
        fields:
          - { name: "PBACSA", msb: 31, lsb: 0, access: RW, desc: "Port B Active Channel Source Address. Contains current source address of active channel for Port B." }
      PBACDADDR:
        offset: '0x19C'
        access: RW
        reset: '0x00000000'
        desc: "Port B Active Channel Destination Address Register"
        fields:
          - { name: "PBACDA", msb: 31, lsb: 0, access: RW, desc: "Port B Active Channel Destination Address. Contains current destination address of active channel for Port B." }
      PBACTC:
        offset: '0x1A0'
        access: RW
        reset: '0x00000000'
        desc: "Port B Active Channel Transfer Count Register"
        fields:
          - { name: "PBFTCOUNT", msb: 28, lsb: 16, access: RW, desc: "Port B active channel frame count. Contains current frame count value of active channel for Port B." }
          - { name: "PBETCOUNT", msb: 12, lsb: 0, access: RW, desc: "Port B active channel element count. Contains current element count value of active channel for Port B." }
      DMAPCR:
        offset: '0x1A8'
        access: RW
        reset: '0x00000005'
        desc: "Parity Control Register"
        fields:
          - { name: "ERRA", bit: 16, access: RW, desc: "Error action. 0=If parity error detected on control packet x, enable/disable state unchanged. 1=If parity error detected, DMA controller disabled immediately." }
          - { name: "TEST", bit: 8, access: RW, desc: "When set, parity bits are memory mapped to make accessible by CPU. 0=Parity bits not memory mapped, 1=Parity bits memory mapped" }
          - { name: "PARITY_ENA", msb: 3, lsb: 0, access: RW, desc: "Parity error detection enable. 5h=Parity check disabled, All other values=Parity check enabled. Recommended to write Ah to enable." }
      DMAPAR:
        offset: '0x1AC'
        access: RW
        reset: '0x00000000'
        desc: "DMA Parity Error Address Register"
        fields:
          - { name: "EDFLAG", bit: 24, access: RWC, desc: "Parity Error Detection Flag. Indicates if parity error occurred on reading DMA Control packet RAM. Write 1 to clear." }
          - { name: "ERRORADDRESS", msb: 11, lsb: 0, access: RW, desc: "Error address. Holds address of first parity error generated in RAM. Address frozen from being updated until read by CPU." }
      DMAMPCTRL:
        offset: '0x1B0'
        access: RW
        reset: '0x00000000'
        desc: "DMA Memory Protection Control Register"
        fields:
          - { name: "INT3AB", bit: 28, access: RW, desc: "Interrupt assignment of region 3 to Group A or Group B. 0=routed to VIM (Group A), 1=routed to second CPU (Group B)" }
          - { name: "INT3ENA", bit: 27, access: RW, desc: "Interrupt enable of region 3. 0=disabled, 1=enabled" }
          - { name: "REG3AP", msb: 26, lsb: 25, access: RO, desc: "Region 3 access permission. 0=All accesses allowed, 1h=Read only, 2h=Write only, 3h=No access" }
          - { name: "REG3ENA", bit: 24, access: RW, desc: "Region 3 enable. 0=disabled (no address checking), 1=enabled (address and permission checking)" }
          - { name: "INT2AB", bit: 20, access: RW, desc: "Interrupt assignment of region 2 to Group A or Group B" }
          - { name: "INT2ENA", bit: 19, access: RW, desc: "Interrupt enable of region 2" }
          - { name: "REG2AP", msb: 18, lsb: 17, access: RW, desc: "Region 2 access permission" }
          - { name: "REG2ENA", bit: 16, access: RW, desc: "Region 2 enable" }
          - { name: "INT1AB", bit: 12, access: RW, desc: "Interrupt assignment of region 1 to Group A or Group B" }
          - { name: "INT1ENA", bit: 11, access: RW, desc: "Interrupt enable of region 1" }
          - { name: "REG1AP", msb: 10, lsb: 9, access: RW, desc: "Region 1 access permission" }
          - { name: "REG1ENA", bit: 8, access: RW, desc: "Region 1 enable" }
          - { name: "INT0AB", bit: 4, access: RW, desc: "Interrupt assignment of region 0 to Group A or Group B" }
          - { name: "INT0ENA", bit: 3, access: RW, desc: "Interrupt enable of region 0" }
          - { name: "REG0AP", msb: 2, lsb: 1, access: RW, desc: "Region 0 access permission" }
          - { name: "REG0ENA", bit: 0, access: RW, desc: "Region 0 enable" }
      DMAMPST:
        offset: '0x1B4'
        access: RO
        reset: '0x00000000'
        desc: "DMA Memory Protection Status Register"
        fields:
          - { name: "REG3FT", bit: 24, access: RWC, desc: "Region 3 fault. Determines if access permission violation detected in this region. Write 1 to clear." }
          - { name: "REG2FT", bit: 16, access: RWC, desc: "Region 2 fault. Write 1 to clear." }
          - { name: "REG1FT", bit: 8, access: RWC, desc: "Region 1 fault. Write 1 to clear." }
          - { name: "REG0FT", bit: 0, access: RWC, desc: "Region 0 fault. Write 1 to clear." }
      DMAMPR0S:
        offset: '0x1B8'
        access: RW
        reset: '0x00000000'
        desc: "DMA Memory Protection Region 0 Start Address Register"
        fields:
          - { name: "STARTADDRESS", msb: 31, lsb: 0, access: RW, desc: "Start Address defines address at which region begins. Effective start address truncated to nearest word address." }
      DMAMPR0E:
        offset: '0x1BC'
        access: RW
        reset: '0x00000000'
        desc: "DMA Memory Protection Region 0 End Address Register"
        fields:
          - { name: "ENDADDRESS", msb: 31, lsb: 0, access: RW, desc: "End Address defines address at which region ends. Effective end address rounded up to nearest word end address." }
      DMAMPR1S:
        offset: '0x1C0'
        access: RW
        reset: '0x00000000'
        desc: "DMA Memory Protection Region 1 Start Address Register"
        fields:
          - { name: "STARTADDRESS", msb: 31, lsb: 0, access: RW, desc: "Start Address defines address at which region begins" }
      DMAMPR1E:
        offset: '0x1C4'
        access: RW
        reset: '0x00000000'
        desc: "DMA Memory Protection Region 1 End Address Register"
        fields:
          - { name: "ENDADDRESS", msb: 31, lsb: 0, access: RW, desc: "End Address defines address at which region ends" }
      DMAMPR2S:
        offset: '0x1C8'
        access: RW
        reset: '0x00000000'
        desc: "DMA Memory Protection Region 2 Start Address Register"
        fields:
          - { name: "STARTADDRESS", msb: 31, lsb: 0, access: RW, desc: "Start Address defines address at which region begins" }
      DMAMPR2E:
        offset: '0x1CC'
        access: RW
        reset: '0x00000000'
        desc: "DMA Memory Protection Region 2 End Address Register"
        fields:
          - { name: "ENDADDRESS", msb: 31, lsb: 0, access: RW, desc: "End Address defines address at which region ends" }
      DMAMPR3S:
        offset: '0x1D0'
        access: RW
        reset: '0x00000000'
        desc: "DMA Memory Protection Region 3 Start Address Register"
        fields:
          - { name: "STARTADDRESS", msb: 31, lsb: 0, access: RW, desc: "Start Address defines address at which region begins" }
      DMAMPR3E:
        offset: '0x1D4'
        access: RW
        reset: '0x00000000'
        desc: "DMA Memory Protection Region 3 End Address Register"
        fields:
          - { name: "ENDADDRESS", msb: 31, lsb: 0, access: RW, desc: "End Address defines address at which region ends" }
      ISADDR:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "Initial Source Address (Control Packet)"
        fields:
          - { name: "ISADDR", msb: 31, lsb: 0, access: RW, desc: "Initial source address. Absolute 32-bit source address (physical)" }
      IDADDR:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "Initial Destination Address Register (Control Packet)"
        fields:
          - { name: "IDADDR", msb: 31, lsb: 0, access: RW, desc: "Initial destination address. Absolute 32-bit destination address (physical)" }
      ITCOUNT:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "Initial Transfer Count Register (Control Packet)"
        fields:
          - { name: "IFTCOUNT", msb: 28, lsb: 16, access: RW, desc: "Initial frame transfer count. Defines number of frame transfers" }
          - { name: "IETCOUNT", msb: 12, lsb: 0, access: RW, desc: "Initial element transfer count. Defines number of element transfers. Block transfer size = IETCOUNT x IFTCOUNT" }
      CHCTRL:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "Channel Control Register (Control Packet)"
        fields:
          - { name: "CHAIN", msb: 21, lsb: 16, access: RW, desc: "Next channel to be triggered. At end of programmed number of frames, specified channel will be triggered. 0=No channel, 1h=Channel 0, 10h=Channel 15" }
          - { name: "RES", msb: 15, lsb: 14, access: RW, desc: "Read element size. 0=8-bit, 1h=16-bit, 2h=32-bit, 3h=64-bit" }
          - { name: "WES", msb: 13, lsb: 12, access: RW, desc: "Write element size. 0=8-bit, 1h=16-bit, 2h=32-bit, 3h=64-bit" }
          - { name: "TTYPE", bit: 8, access: RW, desc: "Transfer type. 0=Request triggers one frame transfer, 1=Request triggers one block transfer" }
          - { name: "ADDMR", msb: 4, lsb: 3, access: RW, desc: "Addressing mode read. 0=Constant, 1h=Post-increment, 3h=Indexed" }
          - { name: "ADDMW", msb: 2, lsb: 1, access: RW, desc: "Addressing mode write. 0=Constant, 1h=Post-increment, 3h=Indexed" }
          - { name: "AIM", bit: 0, access: RW, desc: "Auto-initiation mode. 0=disabled, 1=enabled" }
      EIOFF:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "Element Index Offset Register (Control Packet)"
        fields:
          - { name: "EIDXD", msb: 28, lsb: 16, access: RW, desc: "Destination address element index. Offset to be added to destination address after each element transfer" }
          - { name: "EIDXS", msb: 12, lsb: 0, access: RW, desc: "Source address element index. Offset to be added to source address after each element transfer" }
      FIOFF:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "Frame Index Offset Register (Control Packet)"
        fields:
          - { name: "FIDXD", msb: 28, lsb: 16, access: RW, desc: "Destination address frame index. Offset to be added to destination address after element count reached 1" }
          - { name: "FIDXS", msb: 12, lsb: 0, access: RW, desc: "Source address frame index. Offset to be added to source address after element count reached 1" }
      CSADDR:
        offset: '0x800'
        access: RW
        reset: '0x00000000'
        desc: "Current Source Address Register (Control Packet Working)"
        fields:
          - { name: "CSADDR", msb: 31, lsb: 0, access: RW, desc: "Current source address. Contains current working absolute 32-bit source address (physical). Only updated after channel arbitrated out from priority queue" }
      CDADDR:
        offset: '0x804'
        access: RW
        reset: '0x00000000'
        desc: "Current Destination Address Register (Control Packet Working)"
        fields:
          - { name: "CDADDR", msb: 31, lsb: 0, access: RW, desc: "Current destination address. Contains current working absolute 32-bit destination address (physical). Only updated after channel arbitrated out from priority queue" }
      CTCOUNT:
        offset: '0x808'
        access: RW
        reset: '0x00000000'
        desc: "Current Transfer Count Register (Control Packet Working)"
        fields:
          - { name: "CFTCOUNT", msb: 28, lsb: 16, access: RW, desc: "Current frame transfer count. Returns current remaining frame counts" }
          - { name: "CETCOUNT", msb: 12, lsb: 0, access: RW, desc: "Current element transfer count. Returns current remaining element counts. Only updated after channel arbitrated out from priority queue" }

  ECAP:
    base_address: '0x00000000'
    desc: ''
    registers:
      TSCTR:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "Active 32-bit counter register that is used as the capture time-base"
        fields:
          - { name: "TSCTR", msb: 31, lsb: 0, access: RW, desc: "Active 32-bit counter register that is used as the capture time-base" }
      CTRPHS:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "Counter phase value register that can be programmed for phase lag/lead"
        fields:
          - { name: "CTRPHS", msb: 31, lsb: 0, access: RW, desc: "Counter phase value register that can be programmed for phase lag/lead. This register shadows TSCTR and is loaded into TSCTR upon either a SYNCI event or software force via a control bit" }
      CAP1:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "Capture 1 Register / Period Register in APWM mode"
        fields:
          - { name: "CAP1", msb: 31, lsb: 0, access: RW, desc: "Time-Stamp (counter value) during a capture event, or APRD shadow register when used in APWM mode" }
      CAP2:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "Capture 2 Register / Compare Register in APWM mode"
        fields:
          - { name: "CAP2", msb: 31, lsb: 0, access: RW, desc: "Time-Stamp (counter value) during a capture event, or APRD shadow register when used in APWM mode" }
      CAP3:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "Capture 3 Register / Period Shadow Register in APWM mode"
        fields:
          - { name: "CAP3", msb: 31, lsb: 0, access: RW, desc: "In CMP mode, this is a time-stamp capture register. In APWM mode, this is the period shadow (APRD) register" }
      CAP4:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "Capture 4 Register / Compare Shadow Register in APWM mode"
        fields:
          - { name: "CAP4", msb: 31, lsb: 0, access: RW, desc: "In CMP mode, this is a time-stamp capture register. In APWM mode, this is the compare shadow (ACMP) register" }
      ECCTL1:
        offset: '0x28'
        access: RW
        reset: '0x0000'
        desc: "Capture Control Register 1"
        fields:
          - { name: "FREE_SOFT", msb: 15, lsb: 14, access: RW, desc: "Emulation Control. 0h=TSCTR stops immediately, 1h=TSCTR runs until 0, 2h/3h=Run Free" }
          - { name: "PRESCALE", msb: 13, lsb: 9, access: RW, desc: "Event Filter prescale select. Valid values 0 to 1Fh for divide by 1 to 62" }
          - { name: "CAPLDEN", bit: 8, access: RW, desc: "Enable Loading of CAP1-4 registers on a capture event" }
          - { name: "CTRRST4", bit: 7, access: RW, desc: "Counter Reset on Capture Event 4" }
          - { name: "CAP4POL", bit: 6, access: RW, desc: "Capture Event 4 Polarity select. 0=Rising edge, 1=Falling edge" }
          - { name: "CTRRST3", bit: 5, access: RW, desc: "Counter Reset on Capture Event 3" }
          - { name: "CAP3POL", bit: 4, access: RW, desc: "Capture Event 3 Polarity select. 0=Rising edge, 1=Falling edge" }
          - { name: "CTRRST2", bit: 3, access: RW, desc: "Counter Reset on Capture Event 2" }
          - { name: "CAP2POL", bit: 2, access: RW, desc: "Capture Event 2 Polarity select. 0=Rising edge, 1=Falling edge" }
          - { name: "CTRRST1", bit: 1, access: RW, desc: "Counter Reset on Capture Event 1" }
          - { name: "CAP1POL", bit: 0, access: RW, desc: "Capture Event 1 Polarity select. 0=Rising edge, 1=Falling edge" }
      ECCTL2:
        offset: '0x2A'
        access: RW
        reset: '0x0002'
        desc: "Capture Control Register 2"
        fields:
          - { name: "APWMPOL", bit: 10, access: RW, desc: "APWM output polarity select. 0=Active high, 1=Active low" }
          - { name: "CAP_APWM", bit: 9, access: RW, desc: "CAP/APWM operating mode select. 0=Capture mode, 1=APWM mode" }
          - { name: "SWSYNC", bit: 8, access: RW, desc: "Software-forced Counter (TSCTR) Synchronizing" }
          - { name: "SYNCO_SEL", msb: 7, lsb: 6, access: RW, desc: "Sync-Out Select. 0=Pass through, 1=CTR=PRD event, 2/3=Disable" }
          - { name: "SYNCI_EN", bit: 5, access: RW, desc: "Counter (TSCTR) Sync-In select mode" }
          - { name: "TSCTRSTOP", bit: 4, access: RW, desc: "Time Stamp (TSCTR) Counter Stop (freeze) Control. 0=Stopped, 1=Free-running" }
          - { name: "REARM", bit: 3, access: RW, desc: "One-Shot Re-Arming Control" }
          - { name: "STOP_WRAP", msb: 2, lsb: 1, access: RW, desc: "Stop value for one-shot mode or Wrap value for continuous mode (1-4 events)" }
          - { name: "CONT_ONESHT", bit: 0, access: RW, desc: "Continuous or one-shot mode control. 0=Continuous, 1=One-shot" }
      ECEINT:
        offset: '0x2C'
        access: RW
        reset: '0x0000'
        desc: "Capture Interrupt Enable Register"
        fields:
          - { name: "CTR_CMP", bit: 7, access: RW, desc: "Counter Equal Compare Interrupt Enable" }
          - { name: "CTR_PRD", bit: 6, access: RW, desc: "Counter Equal Period Interrupt Enable" }
          - { name: "CTROVF", bit: 5, access: RW, desc: "Counter Overflow Interrupt Enable" }
          - { name: "CEVT4", bit: 4, access: RW, desc: "Capture Event 4 Interrupt Enable" }
          - { name: "CEVT3", bit: 3, access: RW, desc: "Capture Event 3 Interrupt Enable" }
          - { name: "CEVT2", bit: 2, access: RW, desc: "Capture Event 2 Interrupt Enable" }
          - { name: "CEVT1", bit: 1, access: RW, desc: "Capture Event 1 Interrupt Enable" }
      ECFLG:
        offset: '0x2E'
        access: RW
        reset: '0x0000'
        desc: "Capture Interrupt Flag Register"
        fields:
          - { name: "CTR_CMP", bit: 7, access: RW, desc: "Compare Equal Compare Status Flag (APWM mode only)" }
          - { name: "CTR_PRD", bit: 6, access: RW, desc: "Counter Equal Period Status Flag (APWM mode only)" }
          - { name: "CTROVF", bit: 5, access: RW, desc: "Counter Overflow Status Flag" }
          - { name: "CEVT4", bit: 4, access: RW, desc: "Capture Event 4 Status Flag (CAP mode only)" }
          - { name: "CEVT3", bit: 3, access: RW, desc: "Capture Event 3 Status Flag (CAP mode only)" }
          - { name: "CEVT2", bit: 2, access: RW, desc: "Capture Event 2 Status Flag (CAP mode only)" }
          - { name: "CEVT1", bit: 1, access: RW, desc: "Capture Event 1 Status Flag (CAP mode only)" }
          - { name: "INT", bit: 0, access: RW, desc: "Global Interrupt Status Flag" }
      ECCLR:
        offset: '0x30'
        access: RW
        reset: '0x0000'
        desc: "Capture Interrupt Clear Register"
        fields:
          - { name: "CTR_CMP", bit: 7, access: RW, desc: "Counter Equal Compare Status Flag Clear" }
          - { name: "CTR_PRD", bit: 6, access: RW, desc: "Counter Equal Period Status Flag Clear" }
          - { name: "CTROVF", bit: 5, access: RW, desc: "Counter Overflow Status Flag Clear" }
          - { name: "CEVT4", bit: 4, access: RW, desc: "Capture Event 4 Status Flag Clear" }
          - { name: "CEVT3", bit: 3, access: RW, desc: "Capture Event 3 Status Flag Clear" }
          - { name: "CEVT2", bit: 2, access: RW, desc: "Capture Event 2 Status Flag Clear" }
          - { name: "CEVT1", bit: 1, access: RW, desc: "Capture Event 1 Status Flag Clear" }
          - { name: "INT", bit: 0, access: RW, desc: "Global Interrupt Clear Flag" }
      ECFRC:
        offset: '0x32'
        access: RW
        reset: '0x0000'
        desc: "Capture Interrupt Force Register"
        fields:
          - { name: "CTR_CMP", bit: 7, access: RW, desc: "Force Counter Equal Compare Interrupt" }
          - { name: "CTR_PRD", bit: 6, access: RW, desc: "Force Counter Equal Period Interrupt" }
          - { name: "CTROVF", bit: 5, access: RW, desc: "Force Counter Overflow" }
          - { name: "CEVT4", bit: 4, access: RW, desc: "Force Capture Event 4" }
          - { name: "CEVT3", bit: 3, access: RW, desc: "Force Capture Event 3" }
          - { name: "CEVT2", bit: 2, access: RW, desc: "Force Capture Event 2" }
          - { name: "CEVT1", bit: 1, access: RW, desc: "Force Capture Event 1" }

  EFUSE:
    base_address: '0x00000000'
    desc: ''
    registers:
      EFCBOUND:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: >-
          EFC Boundary Control Register - Used to test connections between eFuse controller and ESM module and initiate ECC self-test
        fields:
          - { name: "EFC_SELF_TEST_ERROR", bit: 21, access: RW, desc: "Drives self test error signal when bit 17 is high. Attached to ESM Group 1, Channel 41" }
          - { name: "EFC_SINGLE_BIT_ERROR", bit: 20, access: RW, desc: "Drives single bit error signal when bit 16 is high. Attached to ESM Group 1, Channel 40" }
          - { name: "EFC_INSTRUCTION_ERROR", bit: 19, access: RW, desc: "Drives instruction error signal when bit 15 is high. Denotes error during e-fuse programming. Not attached to ESM" }
          - { name: "EFC_AUTOLOAD_ERROR", bit: 18, access: RW, desc: "Drives Autoload Error signal when bit 14 is high. Attached to ESM Group 3, Channel 1" }
          - { name: "SELF_TEST_ERROR_OE", bit: 17, access: RW, desc: "Determines if EFC Self Test signal comes from eFuse controller or boundary register bit 21" }
          - { name: "SINGLE_BIT_ERROR_OE", bit: 16, access: RW, desc: "Determines if EFC Single Bit Error signal comes from eFuse controller or boundary register bit 20" }
          - { name: "INSTRUCTION_ERROR_OE", bit: 15, access: RW, desc: "Determines if EFC Instruction Error signal comes from eFuse controller or boundary register bit 19" }
          - { name: "AUTOLOAD_ERROR_OE", bit: 14, access: RW, desc: "Determines if EFC Autoload Error signal comes from eFuse controller or boundary register bit 18" }
          - { name: "EFC_ECC_SELFTEST_ENABLE", bit: 13, access: RW, desc: "Starts selftest of ECC logic if input enable bits [3:0] are all 1s" }
          - { name: "INPUT_ENABLE", msb: 3, lsb: 0, access: RW, desc: "Must be 0xF to enable ECC selftest when bit 13 is set" }
      EFCPINS:
        offset: '0x2C'
        access: RO
        reset: '0xXXXXXXXX'
        desc: "EFC Pins Register - Status of eFuse controller signals"
        fields:
          - { name: "EFC_SELFTEST_DONE", bit: 15, access: RW, desc: "Indicates when EFC ECC selftest is complete" }
          - { name: "EFC_SELFTEST_ERROR", bit: 14, access: RW, desc: "Pass/fail status of EFC ECC Selftest once Selftest Done bit is set" }
          - { name: "EFC_SINGLE_BIT_ERROR", bit: 12, access: RW, desc: "Indicates if single bit error was corrected by ECC logic during autoload after reset" }
          - { name: "EFC_INSTRUCTION_ERROR", bit: 11, access: RW, desc: "Indicates error during factory test or program operation" }
          - { name: "EFC_AUTOLOAD_ERROR", bit: 10, access: RW, desc: "Indicates non-correctable error during autoload sequence after reset. Also sets ESM Group 3, Channel 1" }
      EFCERRSTAT:
        offset: '0x3C'
        access: RO
        reset: '0x00000000'
        desc: "EFC Error Status Register - Error status of eFuse controller operations"
        fields:
          - { name: "INSTRUC_DONE", bit: 5, access: RW, desc: "Instruction done. Indicates eFuse self test has completed" }
          - { name: "ERROR_CODE", msb: 4, lsb: 0, access: RW, desc: "Error status of last instruction executed by eFuse Controller. 0x00=No error, 0x05=Uncorrectable error during autoload, 0x15=Single bit error corrected during autoload, 0x18=ECC selftest signature mismatch" }
      EFCSTCY:
        offset: '0x48'
        access: RW
        reset: '0x00000000'
        desc: >-
          EFC Self Test Cycles Register - Determines number of cycles for ECC logic self test
        fields:
          - { name: "CYCLES", msb: 31, lsb: 0, access: RW, desc: "Number of cycles to run eFuse controller ECC logic self test. Recommended value is 600 (0x00000258)" }
      EFCSTSIG:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: >-
          EFC Self Test Signature Register - Expected signature for eFuse ECC logic self test
        fields:
          - { name: "SIGNATURE", msb: 31, lsb: 0, access: RW, desc: "Expected signature for eFuse ECC logic self test. Recommended value is 0x5362F97F" }

  EMACMDIO:
    base_address: '0x00000000'
    desc: ''
    registers:
      REVID:
        offset: '0x00'
        access: RW
        reset: '0x4EC80100'
        desc: "EMAC Control Module Revision ID Register"
        fields:
          - { name: "REV", msb: 31, lsb: 0, access: RW, desc: "Identifies the EMAC Control Module revision" }
      SOFTRESET:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "EMAC Control Module Software Reset Register"
        fields:
          - { name: "RESET", bit: 0, access: RW, desc: "Software reset bit for EMAC Control Module" }
      INTCONTROL:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "EMAC Control Module Interrupt Control Register"
        fields:
          - { name: "C0TXPACEEN", bit: 17, access: RW, desc: "Enable pacing for TX interrupt pulse generation" }
          - { name: "C0RXPACEEN", bit: 16, access: RW, desc: "Enable pacing for RX interrupt pulse generation" }
          - { name: "INTPRESCALE", msb: 11, lsb: 0, access: RW, desc: "Number of internal EMAC module reference clock periods within 4us time window" }
      C0RXTHRESHEN:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "EMAC Control Module Receive Threshold Interrupt Enable Register"
        fields:
          - { name: "RXCH7THRESHEN", bit: 7, access: RW, desc: "Enable C0RXTHRESHPULSE interrupt generation for RX Channel 7" }
          - { name: "RXCH6THRESHEN", bit: 6, access: RW, desc: "Enable C0RXTHRESHPULSE interrupt generation for RX Channel 6" }
          - { name: "RXCH5THRESHEN", bit: 5, access: RW, desc: "Enable C0RXTHRESHPULSE interrupt generation for RX Channel 5" }
          - { name: "RXCH4THRESHEN", bit: 4, access: RW, desc: "Enable C0RXTHRESHPULSE interrupt generation for RX Channel 4" }
          - { name: "RXCH3THRESHEN", bit: 3, access: RW, desc: "Enable C0RXTHRESHPULSE interrupt generation for RX Channel 3" }
          - { name: "RXCH2THRESHEN", bit: 2, access: RW, desc: "Enable C0RXTHRESHPULSE interrupt generation for RX Channel 2" }
          - { name: "RXCH1THRESHEN", bit: 1, access: RW, desc: "Enable C0RXTHRESHPULSE interrupt generation for RX Channel 1" }
          - { name: "RXCH0THRESHEN", bit: 0, access: RW, desc: "Enable C0RXTHRESHPULSE interrupt generation for RX Channel 0" }
      C0RXEN:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "EMAC Control Module Receive Interrupt Enable Register"
        fields:
          - { name: "RXCH7EN", bit: 7, access: RW, desc: "Enable C0RXPULSE interrupt generation for RX Channel 7" }
          - { name: "RXCH6EN", bit: 6, access: RW, desc: "Enable C0RXPULSE interrupt generation for RX Channel 6" }
          - { name: "RXCH5EN", bit: 5, access: RW, desc: "Enable C0RXPULSE interrupt generation for RX Channel 5" }
          - { name: "RXCH4EN", bit: 4, access: RW, desc: "Enable C0RXPULSE interrupt generation for RX Channel 4" }
          - { name: "RXCH3EN", bit: 3, access: RW, desc: "Enable C0RXPULSE interrupt generation for RX Channel 3" }
          - { name: "RXCH2EN", bit: 2, access: RW, desc: "Enable C0RXPULSE interrupt generation for RX Channel 2" }
          - { name: "RXCH1EN", bit: 1, access: RW, desc: "Enable C0RXPULSE interrupt generation for RX Channel 1" }
          - { name: "RXCH0EN", bit: 0, access: RW, desc: "Enable C0RXPULSE interrupt generation for RX Channel 0" }
      C0TXEN:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "EMAC Control Module Transmit Interrupt Enable Register"
        fields:
          - { name: "TXCH7EN", bit: 7, access: RW, desc: "Enable C0TXPULSE interrupt generation for TX Channel 7" }
          - { name: "TXCH6EN", bit: 6, access: RW, desc: "Enable C0TXPULSE interrupt generation for TX Channel 6" }
          - { name: "TXCH5EN", bit: 5, access: RW, desc: "Enable C0TXPULSE interrupt generation for TX Channel 5" }
          - { name: "TXCH4EN", bit: 4, access: RW, desc: "Enable C0TXPULSE interrupt generation for TX Channel 4" }
          - { name: "TXCH3EN", bit: 3, access: RW, desc: "Enable C0TXPULSE interrupt generation for TX Channel 3" }
          - { name: "TXCH2EN", bit: 2, access: RW, desc: "Enable C0TXPULSE interrupt generation for TX Channel 2" }
          - { name: "TXCH1EN", bit: 1, access: RW, desc: "Enable C0TXPULSE interrupt generation for TX Channel 1" }
          - { name: "TXCH0EN", bit: 0, access: RW, desc: "Enable C0TXPULSE interrupt generation for TX Channel 0" }
      C0MISCEN:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "EMAC Control Module Miscellaneous Interrupt Enable Register"
        fields:
          - { name: "STATPENDEN", bit: 3, access: RW, desc: "Enable C0MISCPULSE interrupt generation when EMAC statistics interrupts are generated" }
          - { name: "HOSTPENDEN", bit: 2, access: RW, desc: "Enable C0MISCPULSE interrupt generation when EMAC host interrupts are generated" }
          - { name: "LINKINT0EN", bit: 1, access: RW, desc: "Enable C0MISCPULSE interrupt generation when MDIO LINKINT0 interrupts are generated" }
          - { name: "USERINT0EN", bit: 0, access: RW, desc: "Enable C0MISCPULSE interrupt generation when MDIO USERINT0 interrupts are generated" }
      C0RXIMAX:
        offset: '0x70'
        access: RW
        reset: '0x00000000'
        desc: "EMAC Control Module Receive Interrupts Per Millisecond Register"
        fields:
          - { name: "RXIMAX", msb: 5, lsb: 0, access: RW, desc: "Desired number of C0RXPULSE interrupts generated per millisecond when pacing enabled" }
      C0TXIMAX:
        offset: '0x74'
        access: RW
        reset: '0x00000000'
        desc: "EMAC Control Module Transmit Interrupts Per Millisecond Register"
        fields:
          - { name: "TXIMAX", msb: 5, lsb: 0, access: RW, desc: "Desired number of C0TXPULSE interrupts generated per millisecond when pacing enabled" }
      MDIO_REVID:
        offset: '0x00'
        access: RW
        reset: '0x00070105'
        desc: "MDIO Revision ID Register"
        fields:
          - { name: "REV", msb: 31, lsb: 0, access: RW, desc: "Identifies the MDIO Module revision" }
      MDIO_CONTROL:
        offset: '0x04'
        access: RW
        reset: '0x400000FF'
        desc: "MDIO Control Register"
        fields:
          - { name: "IDLE", bit: 31, access: RW, desc: "State machine IDLE status bit" }
          - { name: "ENABLE", bit: 30, access: RW, desc: "State machine enable control bit" }
          - { name: "HIGHEST_USER_CHANNEL", msb: 28, lsb: 24, access: RW, desc: "Highest user channel available in module (set to 1)" }
          - { name: "PREAMBLE", bit: 20, access: RW, desc: "Preamble disable" }
          - { name: "FAULT", bit: 19, access: RW, desc: "Fault indicator" }
          - { name: "FAULTENB", bit: 18, access: RW, desc: "Fault detect enable" }
          - { name: "CLKDIV", msb: 15, lsb: 0, access: RW, desc: "Clock Divider bits - MDIO_CLK frequency = peripheral clock / (CLKDIV + 1)" }
      MDIO_ALIVE:
        offset: '0x08'
        access: RO
        reset: '0x00000000'
        desc: "PHY Alive Status Register"
        fields:
          - { name: "ALIVE", msb: 31, lsb: 0, access: RW, desc: "MDIO Alive bits - set if PHY acknowledged most recent access" }
      MDIO_LINK:
        offset: '0x0C'
        access: RO
        reset: '0x00000000'
        desc: "PHY Link Status Register"
        fields:
          - { name: "LINK", msb: 31, lsb: 0, access: RW, desc: "MDIO Link state bits - set if PHY has link and acknowledged read transaction" }
      MDIO_LINKINTRAW:
        offset: '0x10'
        access: RO
        reset: '0x00000000'
        desc: "MDIO Link Status Change Interrupt (Unmasked) Register"
        fields:
          - { name: "USERPHY1", bit: 1, access: RW, desc: "MDIO Link change event for USERPHYSEL1" }
          - { name: "USERPHY0", bit: 0, access: RW, desc: "MDIO Link change event for USERPHYSEL0" }
      MDIO_LINKINTMASKED:
        offset: '0x14'
        access: RO
        reset: '0x00000000'
        desc: "MDIO Link Status Change Interrupt (Masked) Register"
        fields:
          - { name: "USERPHY1", bit: 1, access: RW, desc: "MDIO Link change interrupt masked value for USERPHYSEL1" }
          - { name: "USERPHY0", bit: 0, access: RW, desc: "MDIO Link change interrupt masked value for USERPHYSEL0" }
      MDIO_USERINTRAW:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "MDIO User Command Complete Interrupt (Unmasked) Register"
        fields:
          - { name: "USERACCESS1", bit: 1, access: RW, desc: "MDIO User command complete event for USERACCESS1" }
          - { name: "USERACCESS0", bit: 0, access: RW, desc: "MDIO User command complete event for USERACCESS0" }
      MDIO_USERINTMASKED:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "MDIO User Command Complete Interrupt (Masked) Register"
        fields:
          - { name: "USERACCESS1", bit: 1, access: RW, desc: "MDIO User command complete interrupt masked value for USERACCESS1" }
          - { name: "USERACCESS0", bit: 0, access: RW, desc: "MDIO User command complete interrupt masked value for USERACCESS0" }
      MDIO_USERINTMASKSET:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "MDIO User Command Complete Interrupt Mask Set Register"
        fields:
          - { name: "USERACCESS1", bit: 1, access: RW, desc: "MDIO user interrupt mask set for USERACCESS1" }
          - { name: "USERACCESS0", bit: 0, access: RW, desc: "MDIO user interrupt mask set for USERACCESS0" }
      MDIO_USERINTMASKCLEAR:
        offset: '0x2C'
        access: RW
        reset: '0x00000000'
        desc: "MDIO User Command Complete Interrupt Mask Clear Register"
        fields:
          - { name: "USERACCESS1", bit: 1, access: RW, desc: "MDIO user command complete interrupt mask clear for USERACCESS1" }
          - { name: "USERACCESS0", bit: 0, access: RW, desc: "MDIO user command complete interrupt mask clear for USERACCESS0" }
      MDIO_USERACCESS0:
        offset: '0x80'
        access: RW
        reset: '0x00000000'
        desc: "MDIO User Access Register 0"
        fields:
          - { name: "GO", bit: 31, access: RW, desc: "Go bit - initiates MDIO access when written to 1" }
          - { name: "WRITE", bit: 30, access: RW, desc: "Write enable bit - 1 for write, 0 for read" }
          - { name: "ACK", bit: 29, access: RW, desc: "Acknowledge bit - set if PHY acknowledged read transaction" }
          - { name: "REGADR", msb: 25, lsb: 21, access: RW, desc: "Register address bits - PHY register to be accessed" }
          - { name: "PHYADR", msb: 20, lsb: 16, access: RW, desc: "PHY address bits - PHY to be accessed" }
          - { name: "DATA", msb: 15, lsb: 0, access: RW, desc: "User data bits - data read from or written to PHY register" }
      MDIO_USERPHYSEL0:
        offset: '0x84'
        access: RW
        reset: '0x00000000'
        desc: "MDIO User PHY Select Register 0"
        fields:
          - { name: "LINKSEL", bit: 7, access: RW, desc: "Link status determination select bit" }
          - { name: "LINKINTENB", bit: 6, access: RW, desc: "Link change interrupt enable" }
          - { name: "PHYADRMON", msb: 4, lsb: 0, access: RW, desc: "PHY address whose link status is to be monitored" }
      MDIO_USERACCESS1:
        offset: '0x88'
        access: RW
        reset: '0x00000000'
        desc: "MDIO User Access Register 1"
        fields:
          - { name: "GO", bit: 31, access: RW, desc: "Go bit - initiates MDIO access when written to 1" }
          - { name: "WRITE", bit: 30, access: RW, desc: "Write enable bit - 1 for write, 0 for read" }
          - { name: "ACK", bit: 29, access: RW, desc: "Acknowledge bit - set if PHY acknowledged read transaction" }
          - { name: "REGADR", msb: 25, lsb: 21, access: RW, desc: "Register address bits - PHY register to be accessed" }
          - { name: "PHYADR", msb: 20, lsb: 16, access: RW, desc: "PHY address bits - PHY to be accessed" }
          - { name: "DATA", msb: 15, lsb: 0, access: RW, desc: "User data bits - data read from or written to PHY register" }
      MDIO_USERPHYSEL1:
        offset: '0x8C'
        access: RW
        reset: '0x00000000'
        desc: "MDIO User PHY Select Register 1"
        fields:
          - { name: "LINKSEL", bit: 7, access: RW, desc: "Link status determination select bit" }
          - { name: "LINKINTENB", bit: 6, access: RW, desc: "Link change interrupt enable" }
          - { name: "PHYADRMON", msb: 4, lsb: 0, access: RW, desc: "PHY address whose link status is to be monitored" }

  EMIF:
    base_address: '0x00000000'
    desc: ''
    registers:
      MIDR:
        offset: '0x00'
        access: RW
        reset: '0xXXXXXXXX'
        desc: "Module ID Register"
        fields:
          - { name: "REV", msb: 31, lsb: 0, access: RW, desc: "Module ID of EMIF" }
      AWCC:
        offset: '0x04'
        access: RW
        reset: '0x00000080'
        desc: "Asynchronous Wait Cycle Configuration Register"
        fields:
          - { name: "WP1", bit: 29, access: RW, desc: "EMIF_nWAIT[1] polarity bit. 0=insert wait if low, 1=insert wait if high" }
          - { name: "WP0", bit: 28, access: RW, desc: "EMIF_nWAIT[0] polarity bit. 0=insert wait if low, 1=insert wait if high" }
          - { name: "CS5_WAIT", msb: 23, lsb: 22, access: RW, desc: "Chip Select 5 WAIT signal selection (not supported)" }
          - { name: "CS4_WAIT", msb: 21, lsb: 20, access: RW, desc: "Chip Select 4 WAIT signal selection. 0=EMIF_nWAIT[0], 1=EMIF_nWAIT[1]" }
