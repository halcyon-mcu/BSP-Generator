ir_schema_version: 1.1.0

peripherals:
  PCR:
    base_address: '0xFFFFE000'
    desc: "Peripheral Central Resource (PCR) Controller"
    registers:
      PMPROTSET0:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Memory Protection Set Register 0"
        fields:
          - { name: "MP_PROTSET", msb: 31, lsb: 0, access: RW, desc: "Memory protection set. 0: No effect/Unprotected, 1: Set protection/Protected." }
      PMPROTSET1:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Memory Protection Set Register 1"
        fields:
          - { name: "MP_PROTSET", msb: 31, lsb: 0, access: RW, desc: "Memory protection set. 0: No effect/Unprotected, 1: Set protection/Protected." }
      PMPROTCLR0:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Memory Protection Clear Register 0"
        fields:
          - { name: "MP_PROTCLR", msb: 31, lsb: 0, access: RW, desc: "Memory protection clear. 0: No effect/Unprotected, 1: Clear protection/Protected." }
      PMPROTCLR1:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Memory Protection Clear Register 1"
        fields:
          - { name: "MP_PROTCLR", msb: 31, lsb: 0, access: RW, desc: "Memory protection clear. 0: No effect/Unprotected, 1: Clear protection/Protected." }
      PPROTSET0:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Protection Set Register 0"
        fields:
          - { name: "P_PROTSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral protection set for PS[7:0]. 0: No effect/Unprotected, 1: Set protection/Protected." }
      PPROTSET1:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Protection Set Register 1"
        fields:
          - { name: "P_PROTSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral protection set for PS[15:8]. 0: No effect/Unprotected, 1: Set protection/Protected." }
      PPROTSET2:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Protection Set Register 2"
        fields:
          - { name: "P_PROTSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral protection set for PS[23:16]. 0: No effect/Unprotected, 1: Set protection/Protected." }
      PPROTSET3:
        offset: '0x2C'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Protection Set Register 3"
        fields:
          - { name: "P_PROTSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral protection set for PS[31:24]. 0: No effect/Unprotected, 1: Set protection/Protected." }
      PPROTCLR0:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Protection Clear Register 0"
        fields:
          - { name: "P_PROTCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral protection clear for PS[7:0]. 0: No effect/Unprotected, 1: Clear protection/Protected." }
      PPROTCLR1:
        offset: '0x44'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Protection Clear Register 1"
        fields:
          - { name: "P_PROTCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral protection clear for PS[15:8]. 0: No effect/Unprotected, 1: Clear protection/Protected." }
      PPROTCLR2:
        offset: '0x48'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Protection Clear Register 2"
        fields:
          - { name: "P_PROTCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral protection clear for PS[23:16]. 0: No effect/Unprotected, 1: Clear protection/Protected." }
      PPROTCLR3:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Protection Clear Register 3"
        fields:
          - { name: "P_PROTCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral protection clear for PS[31:24]. 0: No effect/Unprotected, 1: Clear protection/Protected." }
      PCSPWRDWNSET0:
        offset: '0x60'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Memory Power-Down Set Register 0"
        fields:
          - { name: "PCSPWRDWNSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral memory power-down set for PCS[31:0]. 0: Active/No effect, 1: Inactive/Set power-down." }
      PCSPWRDWNSET1:
        offset: '0x64'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Memory Power-Down Set Register 1"
        fields:
          - { name: "PCSPWRDWNSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral memory power-down set for PCS[63:32]. 0: Active/No effect, 1: Inactive/Set power-down." }
      PCSPWRDWNCLR0:
        offset: '0x70'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Memory Power-Down Clear Register 0"
        fields:
          - { name: "PCSPWRDWNCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral memory power-down clear for PCS[31:0]. 0: Active/No effect, 1: Inactive/Clear power-down." }
      PCSPWRDWNCLR1:
        offset: '0x74'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Memory Power-Down Clear Register 1"
        fields:
          - { name: "PCSPWRDWNCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral memory power-down clear for PCS[63:32]. 0: Active/No effect, 1: Inactive/Clear power-down." }
      PSPWRDWNSET0:
        offset: '0x80'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Power-Down Set Register 0"
        fields:
          - { name: "PSPWRDWNSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral power-down set for PS[7:0]. 0: Active/No effect, 1: Inactive/Set power-down." }
      PSPWRDWNSET1:
        offset: '0x84'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Power-Down Set Register 1"
        fields:
          - { name: "PSPWRDWNSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral power-down set for PS[15:8]. 0: Active/No effect, 1: Inactive/Set power-down." }
      PSPWRDWNSET2:
        offset: '0x88'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Power-Down Set Register 2"
        fields:
          - { name: "PSPWRDWNSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral power-down set for PS[23:16]. 0: Active/No effect, 1: Inactive/Set power-down." }
      PSPWRDWNSET3:
        offset: '0x8C'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Power-Down Set Register 3"
        fields:
          - { name: "PSPWRDWNSET", msb: 31, lsb: 0, access: RW, desc: "Peripheral power-down set for PS[31:24]. 0: Active/No effect, 1: Inactive/Set power-down." }
      PSPWRDWNCLR0:
        offset: '0xA0'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Power-Down Clear Register 0"
        fields:
          - { name: "PSPWRDWNCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral power-down clear for PS[7:0]. 0: Active/No effect, 1: Inactive/Clear power-down." }
      PSPWRDWNCLR1:
        offset: '0xA4'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Power-Down Clear Register 1"
        fields:
          - { name: "PSPWRDWNCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral power-down clear for PS[15:8]. 0: Active/No effect, 1: Inactive/Clear power-down." }
      PSPWRDWNCLR2:
        offset: '0xA8'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Power-Down Clear Register 2"
        fields:
          - { name: "PSPWRDWNCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral power-down clear for PS[23:16]. 0: Active/No effect, 1: Inactive/Clear power-down." }
      PSPWRDWNCLR3:
        offset: '0xAC'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Peripheral Power-Down Clear Register 3"
        fields:
          - { name: "PSPWRDWNCLR", msb: 31, lsb: 0, access: RW, desc: "Peripheral power-down clear for PS[31:24]. 0: Active/No effect, 1: Inactive/Clear power-down." }

  SYSTEM:
    base_address: '0xFFFFFF00'
    desc: "Primary System Control Registers (SYS). Controls clocks, resets, and global system configurations."
    registers:
      SYSPC1:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "SYS Pin Control Register 1. Controls ECLK pin function."
        fields:
          - { name: "ECPCLKFUN", bit: 0, access: RW, desc: "ECLK function. 0: GIO mode, 1: Functional mode (clock output)." }
      SYSPC2:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "SYS Pin Control Register 2. Controls ECLK direction in GIO mode."
        fields:
          - { name: "ECPCLKDIR", bit: 0, access: RW, desc: "ECLK direction. 0: Input, 1: Output." }
      SYSPC3:
        offset: '0x08'
        access: RO
        reset: '0x00000000'
        desc: "SYS Pin Control Register 3. ECLK input data."
        fields:
          - { name: "ECPCLKDIN", bit: 0, access: RO, desc: "ECLK data input. Reads the logic state of the ECLK pin." }
      SYSPC4:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "SYS Pin Control Register 4. ECLK output data."
        fields:
          - { name: "ECPCLKDOUT", bit: 0, access: RW, desc: "ECLK data output. 0: Drive low, 1: Drive high." }
      SYSPC5:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "SYS Pin Control Register 5. ECLK output set."
        fields:
          - { name: "ECPCLKSET", bit: 0, access: RW, desc: "ECLK data set. Writing 1 drives pin high." }
      SYSPC6:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "SYS Pin Control Register 6. ECLK output clear."
        fields:
          - { name: "ECPCLKCLR", bit: 0, access: RW, desc: "ECLK data clear. Writing 1 drives pin low." }
      SYSPC7:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "SYS Pin Control Register 7. ECLK open drain enable."
        fields:
          - { name: "ECPCLKODE", bit: 0, access: RW, desc: "ECLK open drain enable. 0: Push/pull, 1: Open drain." }
      SYSPC8:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "SYS Pin Control Register 8. ECLK pull enable."
        fields:
          - { name: "ECPCLKPUE", bit: 0, access: RW, desc: "ECLK pull enable. 0: Enabled, 1: Disabled." }
      SYSPC9:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "SYS Pin Control Register 9. ECLK pull select."
        fields:
          - { name: "ECPCLKPS", bit: 0, access: RW, desc: "ECLK pull select. 0: Pull down, 1: Pull up." }
      CSDIS:
        offset: '0x30'
        access: RW
        reset: '0x00000000'
        desc: "Clock Source Disable Register."
        fields:
          - { name: "CLKSR7OFF", bit: 7, access: RW, desc: "Disable Clock Source 7 (EXTCLKIN2)." }
          - { name: "CLKSR6OFF", bit: 6, access: RW, desc: "Disable Clock Source 6 (PLL2)." }
          - { name: "CLKSR5OFF", bit: 5, access: RW, desc: "Disable Clock Source 5 (High Freq LPO)." }
          - { name: "CLKSR4OFF", bit: 4, access: RW, desc: "Disable Clock Source 4 (Low Freq LPO)." }
          - { name: "CLKSR3OFF", bit: 3, access: RW, desc: "Disable Clock Source 3 (EXTCLKIN1)." }
          - { name: "CLKSR1OFF", bit: 1, access: RW, desc: "Disable Clock Source 1 (PLL1)." }
          - { name: "CLKSR0OFF", bit: 0, access: RW, desc: "Disable Clock Source 0 (Oscillator)." }
      CSDISSET:
        offset: '0x34'
        access: RW
        reset: '0x00000000'
        desc: "Clock Source Disable Set Register. Writing 1 disables the clock source."
        fields:
          - { name: "SETCLKSR7OFF", bit: 7, access: RW, desc: "Set disable for Clock Source 7." }
          - { name: "SETCLKSR6OFF", bit: 6, access: RW, desc: "Set disable for Clock Source 6." }
          - { name: "SETCLKSR5OFF", bit: 5, access: RW, desc: "Set disable for Clock Source 5." }
          - { name: "SETCLKSR4OFF", bit: 4, access: RW, desc: "Set disable for Clock Source 4." }
          - { name: "SETCLKSR3OFF", bit: 3, access: RW, desc: "Set disable for Clock Source 3." }
          - { name: "SETCLKSR1OFF", bit: 1, access: RW, desc: "Set disable for Clock Source 1." }
          - { name: "SETCLKSR0OFF", bit: 0, access: RW, desc: "Set disable for Clock Source 0." }
      CSDISCLR:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "Clock Source Disable Clear Register. Writing 1 enables the clock source."
        fields:
          - { name: "CLRCLKSR7OFF", bit: 7, access: RW, desc: "Clear disable (enable) for Clock Source 7." }
          - { name: "CLRCLKSR6OFF", bit: 6, access: RW, desc: "Clear disable (enable) for Clock Source 6." }
          - { name: "CLRCLKSR5OFF", bit: 5, access: RW, desc: "Clear disable (enable) for Clock Source 5." }
          - { name: "CLRCLKSR4OFF", bit: 4, access: RW, desc: "Clear disable (enable) for Clock Source 4." }
          - { name: "CLRCLKSR3OFF", bit: 3, access: RW, desc: "Clear disable (enable) for Clock Source 3." }
          - { name: "CLRCLKSR1OFF", bit: 1, access: RW, desc: "Clear disable (enable) for Clock Source 1." }
          - { name: "CLRCLKSR0OFF", bit: 0, access: RW, desc: "Clear disable (enable) for Clock Source 0." }
      CDDIS:
        offset: '0x3C'
        access: RW
        reset: '0x00000000'
        desc: "Clock Domain Disable Register."
        fields:
          - { name: "VCLKA4OFF", bit: 11, access: RW, desc: "VCLKA4 domain off." }
          - { name: "VCLKA3OFF", bit: 10, access: RW, desc: "VCLKA3 domain off." }
          - { name: "VCLK4OFF", bit: 9, access: RW, desc: "VCLK4 domain off." }
          - { name: "VCLK3OFF", bit: 8, access: RW, desc: "VCLK3 domain off." }
          - { name: "RTICLK1OFF", bit: 6, access: RW, desc: "RTICLK1 domain off." }
          - { name: "VCLKA1OFF", bit: 4, access: RW, desc: "VCLKA1 domain off." }
          - { name: "VCLK2OFF", bit: 3, access: RW, desc: "VCLK2 domain off." }
          - { name: "VCLKPOFF", bit: 2, access: RW, desc: "VCLK_periph domain off." }
          - { name: "HCLKOFF", bit: 1, access: RW, desc: "HCLK and VCLK_sys domains off." }
          - { name: "GCLKOFF", bit: 0, access: RW, desc: "GCLK domain off." }
      CDDISSET:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: "Clock Domain Disable Set Register. Writing 1 disables the clock domain."
        fields:
          - { name: "SETVCLKA4OFF", bit: 11, access: RW, desc: "Set disable for VCLKA4 domain." }
          - { name: "SETVCLKA3OFF", bit: 10, access: RW, desc: "Set disable for VCLKA3 domain." }
          - { name: "SETVCLK4OFF", bit: 9, access: RW, desc: "Set disable for VCLK4 domain." }
          - { name: "SETVCLK3OFF", bit: 8, access: RW, desc: "Set disable for VCLK3 domain." }
          - { name: "SETRTI1CLKOFF", bit: 6, access: RW, desc: "Set disable for RTICLK1 domain." }
          - { name: "SETVCLKA1OFF", bit: 4, access: RW, desc: "Set disable for VCLKA1 domain." }
          - { name: "SETVCLK2OFF", bit: 3, access: RW, desc: "Set disable for VCLK2 domain." }
          - { name: "SETVCLKPOFF", bit: 2, access: RW, desc: "Set disable for VCLK_periph domain." }
          - { name: "SETHCLKOFF", bit: 1, access: RW, desc: "Set disable for HCLK domain." }
          - { name: "SETGCLKOFF", bit: 0, access: RW, desc: "Set disable for GCLK domain." }
      CDDISCLR:
        offset: '0x44'
        access: RW
        reset: '0x00000000'
        desc: "Clock Domain Disable Clear Register. Writing 1 enables the clock domain."
        fields:
          - { name: "CLRVCLKA4OFF", bit: 11, access: RW, desc: "Clear disable for VCLKA4 domain." }
          - { name: "CLRVCLKA3OFF", bit: 10, access: RW, desc: "Clear disable for VCLKA3 domain." }
          - { name: "CLRVCLK4OFF", bit: 9, access: RW, desc: "Clear disable for VCLK4 domain." }
          - { name: "CLRVCLK3OFF", bit: 8, access: RW, desc: "Clear disable for VCLK3 domain." }
          - { name: "CLRRTI1CLKOFF", bit: 6, access: RW, desc: "Clear disable for RTICLK1 domain." }
          - { name: "CLRVCLKA1OFF", bit: 4, access: RW, desc: "Clear disable for VCLKA1 domain." }
          - { name: "CLRVCLK2OFF", bit: 3, access: RW, desc: "Clear disable for VCLK2 domain." }
          - { name: "CLRVCLKPOFF", bit: 2, access: RW, desc: "Clear disable for VCLK_periph domain." }
          - { name: "CLRHCLKOFF", bit: 1, access: RW, desc: "Clear disable for HCLK domain." }
          - { name: "CLRGCLKOFF", bit: 0, access: RW, desc: "Clear disable for GCLK domain." }
      GHVSRC:
        offset: '0x48'
        access: RW
        reset: '0x00000000'
        desc: "GCLK, HCLK, VCLK, and VCLK2 Source Register."
        fields:
          - { name: "GHVWAKE", msb: 27, lsb: 24, access: RW, desc: "Source on wakeup. 0: Osc, 1: PLL1, 4: LF LPO, 5: HF LPO, 6: PLL2." }
          - { name: "HVLPM", msb: 19, lsb: 16, access: RW, desc: "Source when GCLK off. 0: Osc, 1: PLL1, 4: LF LPO, 5: HF LPO, 6: PLL2." }
          - { name: "GHVSRC", msb: 3, lsb: 0, access: RW, desc: "Current source. 0: Osc, 1: PLL1, 4: LF LPO, 5: HF LPO, 6: PLL2." }
      VCLKASRC:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Asynchronous Clock Source Register."
        fields:
          - { name: "VCLKA1S", msb: 3, lsb: 0, access: RW, desc: "VCLKA1 Source. 0: Osc, 1: PLL1, 2: Reserved, 3: EXTCLKIN1, 4: LF LPO, 5: HF LPO, 6: PLL2, 7: EXTCLKIN2, 8+: VCLK." }
      RCLKSRC:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "RTI Clock Source Register."
        fields:
          - { name: "RTI1DIV", msb: 9, lsb: 8, access: RW, desc: "RTI1 Clock Divider. 0: /1, 1: /2, 2: /4, 3: /8." }
          - { name: "RTI1SRC", msb: 3, lsb: 0, access: RW, desc: "RTI1 Source. 0: Osc, 1: PLL1, 2: Reserved, 3: EXTCLKIN1, 4: LF LPO, 5: HF LPO, 6: PLL2, 7: EXTCLKIN2, 8+: VCLK." }
      CSVSTAT:
        offset: '0x54'
        access: RO
        reset: '0x00000000'
        desc: "Clock Source Valid Status Register."
        fields:
          - { name: "CLKSR7V", bit: 7, access: RO, desc: "Clock Source 7 (EXTCLKIN2) valid." }
          - { name: "CLKSR6V", bit: 6, access: RO, desc: "Clock Source 6 (PLL2) valid." }
          - { name: "CLKSR5V", bit: 5, access: RO, desc: "Clock Source 5 (HF LPO) valid." }
          - { name: "CLKSR4V", bit: 4, access: RO, desc: "Clock Source 4 (LF LPO) valid." }
          - { name: "CLKSR3V", bit: 3, access: RO, desc: "Clock Source 3 (EXTCLKIN1) valid." }
          - { name: "CLKSR1V", bit: 1, access: RO, desc: "Clock Source 1 (PLL1) valid." }
          - { name: "CLKSR0V", bit: 0, access: RO, desc: "Clock Source 0 (Oscillator) valid." }
      MSTGCR:
        offset: '0x58'
        access: RW
        reset: '0x00000000'
        desc: "Memory Self-Test Global Control Register."
        fields:
          - { name: "MBIST_ALGSEL", msb: 23, lsb: 16, access: RW, desc: "Algorithm select. 1: Checkerboard, 2: March13N (0/1), 4: March11N (5/A), 8: March13N (3/C/F/0/6/9)." }
          - { name: "ROM_DIV", msb: 9, lsb: 8, access: RW, desc: "ROM Clock Divider. 0: /1, 1: /2, 2: /4, 3: /8." }
          - { name: "MSTGENA", msb: 3, lsb: 0, access: RW, desc: "Global Enable Key. 0xA: Enabled, Others: Disabled." }
      MINITGCR:
        offset: '0x5C'
        access: RW
        reset: '0x00000000'
        desc: "Memory Hardware Initialization Global Control Register."
        fields:
          - { name: "MINITGENA", msb: 3, lsb: 0, access: RW, desc: "Global Enable Key. 0xA: Enabled, Others: Disabled." }
      MSINENA:
        offset: '0x60'
        access: RW
        reset: '0x00000000'
        desc: "Memory Self-Test/Initialization Enable Register."
        fields:
          - { name: "MSIENA", msb: 31, lsb: 0, access: RW, desc: "Enable bits for each memory module (bit definition in Table 2-5)." }
      MSTFAIL:
        offset: '0x64'
        access: RW
        reset: '0x00000000'
        desc: "Memory Self-Test Fail Status Register."
        fields:
          - { name: "MSTF", msb: 31, lsb: 0, access: RW, desc: "Fail status for each memory module. Write 1 to clear." }
      MSTCGSTAT:
        offset: '0x68'
        access: RW
        reset: '0x00000000'
        desc: "MSTC Global Status Register."
        fields:
          - { name: "MINIDONE", bit: 8, access: RW, desc: "Memory initialization done. Write 1 to clear." }
          - { name: "MSTDONE", bit: 0, access: RW, desc: "Memory self-test done. Write 1 to clear." }
      MINISTAT:
        offset: '0x6C'
        access: RW
        reset: '0x00000000'
        desc: "Memory Hardware Initialization Status Register."
        fields:
          - { name: "MIDONE", msb: 31, lsb: 0, access: RW, desc: "Initialization done status for each memory module. Write 1 to clear." }
      PLLCTL1:
        offset: '0x70'
        access: RW
        reset: '0x00000000'
        desc: "PLL Control Register 1."
        fields:
          - { name: "ROS", bit: 31, access: RW, desc: "Reset on Slip. 1: Reset system on PLL slip." }
          - { name: "MASK_SLIP", msb: 30, lsb: 29, access: RW, desc: "Slip Mask. 0x2: Disable Bypass on Slip, Others: Enable Bypass on Slip." }
          - { name: "PLLDIV", msb: 28, lsb: 24, access: RW, desc: "PLL Output Divider (R). R = PLLDIV + 1." }
          - { name: "ROF", bit: 23, access: RW, desc: "Reset on Oscillator Fail. 1: Reset system." }
          - { name: "REFCLKDIV", msb: 21, lsb: 16, access: RW, desc: "Reference Clock Divider (NR). NR = REFCLKDIV + 1." }
          - { name: "PLLMUL", msb: 15, lsb: 0, access: RW, desc: "PLL Multiplier (NF). NF = (PLLMUL / 256) + 1." }
      PLLCTL2:
        offset: '0x74'
        access: RW
        reset: '0x00000000'
        desc: "PLL Control Register 2."
        fields:
          - { name: "FMENA", bit: 31, access: RW, desc: "Frequency Modulation Enable. 1: Enable." }
          - { name: "SPREADINGRATE", msb: 30, lsb: 22, access: RW, desc: "Spreading Rate (NS). NS = SPREADINGRATE + 1." }
          - { name: "MULMOD", msb: 20, lsb: 12, access: RW, desc: "Multiplier Correction. Delta NF = MULMOD / 256." }
          - { name: "ODPLL", msb: 11, lsb: 9, access: RW, desc: "Internal Output Divider (OD). OD = ODPLL + 1." }
          - { name: "SPR_AMOUNT", msb: 8, lsb: 0, access: RW, desc: "Spreading Amount (NV). NV = (SPR_AMOUNT + 1) / 2048." }
      SYSPC10:
        offset: '0x78'
        access: RW
        reset: '0x00000000'
        desc: "SYS Pin Control Register 10."
        fields:
          - { name: "ECPCLK_SLEW", bit: 0, access: RW, desc: "ECLK Slew Rate. 0: Fast, 1: Slow." }
      DIEIDL:
        offset: '0x7C'
        access: RO
        reset: '0x00000000'
        desc: "Die Identification Register Lower Word."
        fields:
          - { name: "WAFER_NUM", msb: 31, lsb: 24, access: RO, desc: "Wafer Number." }
          - { name: "Y_COORD", msb: 23, lsb: 12, access: RO, desc: "Y Wafer Coordinate." }
          - { name: "X_COORD", msb: 11, lsb: 0, access: RO, desc: "X Wafer Coordinate." }
      DIEIDH:
        offset: '0x80'
        access: RO
        reset: '0x00000000'
        desc: "Die Identification Register Upper Word."
        fields:
          - { name: "LOT_NUM", msb: 23, lsb: 0, access: RO, desc: "Lot Number." }
      LPOMONCTL:
        offset: '0x88'
        access: RW
        reset: '0x00000000'
        desc: "LPO/Clock Monitor Control Register."
        fields:
          - { name: "BIAS_ENABLE", bit: 24, access: RW, desc: "LPO Bias Enable. 1: Enabled." }
          - { name: "OSCFRQCONFIGCNT", bit: 16, access: RW, desc: "Oscillator Frequency Range. 0: <= 20MHz, 1: > 20MHz." }
          - { name: "HFTRIM", msb: 12, lsb: 8, access: RW, desc: "HF LPO Trim." }
          - { name: "LFTRIM", msb: 4, lsb: 0, access: RW, desc: "LF LPO Trim." }
      CLKTEST:
        offset: '0x8C'
        access: RW
        reset: '0x00000000'
        desc: "Clock Test Register."
        fields:
          - { name: "ALTLIMPCLOCKENABLE", bit: 26, access: RW, desc: "Alternate Limp Clock Enable (GIOB[0])." }
          - { name: "RANGEDETCTRL", bit: 25, access: RW, desc: "Range Detection Control." }
          - { name: "RANGEDETENASSEL", bit: 24, access: RW, desc: "Range Detection Enable Select." }
          - { name: "CLK_TEST_EN", msb: 19, lsb: 16, access: RW, desc: "Clock Test Enable. 0x5: Enabled." }
          - { name: "SEL_GIO_PIN", msb: 11, lsb: 8, access: RW, desc: "GIOB[0] Clock Source Select." }
          - { name: "SEL_ECP_PIN", msb: 3, lsb: 0, access: RW, desc: "ECLK Clock Source Select." }
      DFTCTRLREG:
        offset: '0x90'
        access: RW
        reset: '0x00000000'
        desc: "DFT Control Register."
        fields:
          - { name: "DFTWRITE", msb: 13, lsb: 12, access: RW, desc: "DFT Logic Write Access." }
          - { name: "DFTREAD", msb: 9, lsb: 8, access: RW, desc: "DFT Logic Read Access." }
          - { name: "TEST_MODE_KEY", msb: 3, lsb: 0, access: RW, desc: "Test Mode Key. 0xA: Enable." }
      DFTCTRLREG2:
        offset: '0x94'
        access: RW
        reset: '0x00000000'
        desc: "DFT Control Register 2."
        fields:
          - { name: "IMPDF", msb: 31, lsb: 4, access: RW, desc: "Implementation Defined." }
          - { name: "TEST_MODE_KEY", msb: 3, lsb: 0, access: RW, desc: "Test Mode Key. 0xA: Enable." }
      GPREG1:
        offset: '0xA0'
        access: RW
        reset: '0x00000000'
        desc: "General Purpose Register 1."
        fields:
          - { name: "EMIF_FUNC", bit: 31, access: RW, desc: "Enable EMIF output functions." }
          - { name: "PLL1_FBSLIP_FILTER_COUNT", msb: 25, lsb: 20, access: RW, desc: "FBSLIP Filter Count." }
          - { name: "PLL1_FBSLIP_FILTER_KEY", msb: 19, lsb: 16, access: RW, desc: "FBSLIP Filter Key. 0x5: Enable." }
          - { name: "OUTPUT_BUFFER_LOW_EMI_MODE", msb: 15, lsb: 0, access: RW, desc: "Low EMI Mode for Output Buffers." }
      IMPFASTS:
        offset: '0xA8'
        access: RW
        reset: '0x00000000'
        desc: "Imprecise Fault Status Register."
        fields:
          - { name: "MASTERID", msb: 23, lsb: 16, access: RW, desc: "Master ID responsible for abort." }
          - { name: "EMIFA", bit: 10, access: RW, desc: "EMIF Abort Flag." }
          - { name: "NCBA", bit: 9, access: RW, desc: "Non-cacheable Bufferable Abort Flag." }
          - { name: "VBUSA", bit: 8, access: RW, desc: "VBUS Abort Flag." }
          - { name: "ATYPE", bit: 0, access: RW, desc: "Abort Type. 0: Precise, 1: Imprecise." }
      IMPFTADD:
        offset: '0xAC'
        access: RO
        reset: '0x00000000'
        desc: "Imprecise Fault Write Address Register."
        fields:
          - { name: "IMPFTADD", msb: 31, lsb: 0, access: RO, desc: "Fault Address." }
      SSIR1:
        offset: '0xB0'
        access: RW
        reset: '0x00000000'
        desc: "System Software Interrupt Request 1."
        fields:
          - { name: "SSKEY1", msb: 15, lsb: 8, access: RW, desc: "Key (0x75) to trigger interrupt." }
          - { name: "SSDATA1", msb: 7, lsb: 0, access: RW, desc: "Data associated with interrupt." }
      SSIR2:
        offset: '0xB4'
        access: RW
        reset: '0x00000000'
        desc: "System Software Interrupt Request 2."
        fields:
          - { name: "SSKEY2", msb: 15, lsb: 8, access: RW, desc: "Key (0x84) to trigger interrupt." }
          - { name: "SSDATA2", msb: 7, lsb: 0, access: RW, desc: "Data associated with interrupt." }
      SSIR3:
        offset: '0xB8'
        access: RW
        reset: '0x00000000'
        desc: "System Software Interrupt Request 3."
        fields:
          - { name: "SSKEY3", msb: 15, lsb: 8, access: RW, desc: "Key (0x93) to trigger interrupt." }
          - { name: "SSDATA3", msb: 7, lsb: 0, access: RW, desc: "Data associated with interrupt." }
      SSIR4:
        offset: '0xBC'
        access: RW
        reset: '0x00000000'
        desc: "System Software Interrupt Request 4."
        fields:
          - { name: "SSKEY4", msb: 15, lsb: 8, access: RW, desc: "Key (0xA2) to trigger interrupt." }
          - { name: "SSDATA4", msb: 7, lsb: 0, access: RW, desc: "Data associated with interrupt." }
      RAMGCR:
        offset: '0xC0'
        access: RW
        reset: '0x00000000'
        desc: "RAM Control Register."
        fields:
          - { name: "RAM_DFT_EN", msb: 19, lsb: 16, access: RW, desc: "RAM DFT Enable (TI Internal)." }
          - { name: "WST_AENA0", bit: 2, access: RW, desc: "Wait state address enable. 1: +1 HCLK cycle." }
          - { name: "WST_DENA0", bit: 0, access: RW, desc: "Wait state data enable. 1: +1 HCLK cycle." }
      BMMCR1:
        offset: '0xC4'
        access: RW
        reset: '0x00000005'
        desc: "Bus Matrix Module Control Register 1."
        fields:
          - { name: "MEMSW", msb: 3, lsb: 0, access: RW, desc: "Memory Swap Key. 0x5: Swapped, 0xA: Default." }
      CPURSTCR:
        offset: '0xCC'
        access: RW
        reset: '0x00000000'
        desc: "CPU Reset Control Register."
        fields:
          - { name: "CPU_RESET", bit: 0, access: RW, desc: "CPU Reset. Write to toggle." }
      CLKCNTL:
        offset: '0xD0'
        access: RW
        reset: '0x00000000'
        desc: "Clock Control Register."
        fields:
          - { name: "VCLK2R", msb: 27, lsb: 24, access: RW, desc: "VCLK2 Ratio. 0: /1 ... F: /16." }
          - { name: "VCLKR", msb: 19, lsb: 16, access: RW, desc: "VCLK Ratio. 0: /1 ... F: /16." }
          - { name: "PENA", bit: 8, access: RW, desc: "Peripheral Enable. 1: Peripherals out of reset." }
      ECPCNTL:
        offset: '0xD4'
        access: RW
        reset: '0x00000000'
        desc: "ECP Control Register."
        fields:
          - { name: "ECPSSEL", bit: 24, access: RW, desc: "Clock Source Select. 0: VCLK, 1: OSCIN." }
          - { name: "ECPCOS", bit: 23, access: RW, desc: "Continue On Suspend. 1: Continue." }
          - { name: "ECPINSEL", msb: 17, lsb: 16, access: RW, desc: "Input Source Select. 1: HCLK, 2: External." }
          - { name: "ECPDIV", msb: 15, lsb: 0, access: RW, desc: "Clock Divider. Output = Input / (ECPDIV + 1)." }
      DEVCR1:
        offset: '0xDC'
        access: RW
        reset: '0x00000000'
        desc: "DEV Parity Control Register 1."
        fields:
          - { name: "DEVPARSEL", msb: 3, lsb: 0, access: RW, desc: "Parity Select. 0x5: Odd, 0xA: Even." }
      SYSECR:
        offset: '0xE0'
        access: RW
        reset: '0x00000000'
        desc: "System Exception Control Register."
        fields:
          - { name: "RESET", msb: 15, lsb: 14, access: RW, desc: "Software Reset. 10: Reset." }
      SYSESR:
        offset: '0xE4'
        access: RW
        reset: '0x00000000'
        desc: "System Exception Status Register. Write 1 to clear flags."
        fields:
          - { name: "PORST", bit: 15, access: RW, desc: "Power-On Reset Flag." }
          - { name: "OSCRST", bit: 14, access: RW, desc: "Oscillator Fail/PLL Slip Reset Flag." }
          - { name: "WDRST", bit: 13, access: RW, desc: "Watchdog Reset Flag." }
          - { name: "CPURST", bit: 5, access: RW, desc: "CPU Reset Flag." }
          - { name: "SWRST", bit: 4, access: RW, desc: "Software Reset Flag." }
          - { name: "EXTRST", bit: 3, access: RW, desc: "External Reset Flag." }
      SYSTASR:
        offset: '0xE8'
        access: RW
        reset: '0x00000000'
        desc: "System Test Abort Status Register."
        fields:
          - { name: "EFUSE_Abort", msb: 4, lsb: 0, access: RW, desc: "EFUSE Abort Status." }
      GLBSTAT:
        offset: '0xEC'
        access: RW
        reset: '0x00000000'
        desc: "Global Status Register. Write 1 to clear flags."
        fields:
          - { name: "FBSLIP", bit: 9, access: RW, desc: "PLL Feedback Slip Flag." }
          - { name: "RFSLIP", bit: 8, access: RW, desc: "PLL Reference Slip Flag." }
          - { name: "OSCFAIL", bit: 0, access: RW, desc: "Oscillator Fail Flag." }
      DEVID:
        offset: '0xF0'
        access: RO
        reset: '0x00000000'
        desc: "Device Identification Register."
        fields:
          - { name: "CP15", bit: 31, access: RO, desc: "CP15 Present. 1: Yes." }
          - { name: "UNIQUE_ID", msb: 30, lsb: 17, access: RO, desc: "Unique Device ID." }
          - { name: "TECH", msb: 16, lsb: 13, access: RO, desc: "Process Technology." }
          - { name: "IO_VOLTAGE", bit: 12, access: RO, desc: "I/O Voltage. 0: 3.3V, 1: 5V." }
          - { name: "PERIPHERAL_PARITY", bit: 11, access: RO, desc: "Peripheral Parity Present." }
          - { name: "FLASH_ECC", bit: 10, access: RO, desc: "Flash ECC Present." }
          - { name: "RAM_ECC", bit: 9, access: RO, desc: "RAM ECC Present." }
          - { name: "VERSION", msb: 8, lsb: 3, access: RO, desc: "Device Version." }
          - { name: "PLATFORM_ID", msb: 2, lsb: 0, access: RO, desc: "Platform ID." }
      SSIVEC:
        offset: '0xF4'
        access: RO
        reset: '0x00000000'
        desc: "Software Interrupt Vector Register."
        fields:
          - { name: "SSIDATA", msb: 15, lsb: 8, access: RO, desc: "SSI Data from request." }
          - { name: "SSIVECT", msb: 7, lsb: 0, access: RO, desc: "SSI Vector (1-4)." }
      SSIF:
        offset: '0xF8'
        access: RW
        reset: '0x00000000'
        desc: "System Software Interrupt Flag Register. Write 1 to clear."
        fields:
          - { name: "SSI_FLAG4", bit: 3, access: RW, desc: "SSI 4 Flag." }
          - { name: "SSI_FLAG3", bit: 2, access: RW, desc: "SSI 3 Flag." }
          - { name: "SSI_FLAG2", bit: 1, access: RW, desc: "SSI 2 Flag." }
          - { name: "SSI_FLAG1", bit: 0, access: RW, desc: "SSI 1 Flag." }

  SYSTEM2:
    base_address: '0xFFFFE100'
    desc: "Secondary System Control Registers (SYS2). Additional control for PLL, clocks, and EFUSE."
    registers:
      PLLCTL3:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "PLL Control Register 3."
        fields:
          - { name: "ODPLL2", msb: 31, lsb: 29, access: RW, desc: "PLL2 Output Divider." }
          - { name: "REFCLKDIV2", msb: 21, lsb: 16, access: RW, desc: "PLL2 Reference Clock Divider." }
          - { name: "PLLMUL2", msb: 15, lsb: 0, access: RW, desc: "PLL2 Multiplier." }
      STCCLKDIV:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "CPU Logic BIST Clock Divider."
        fields:
          - { name: "CLKDIV", msb: 26, lsb: 24, access: RW, desc: "BIST Clock Divider." }
      CLK2CNTRL:
        offset: '0x3C'
        access: RW
        reset: '0x00000000'
        desc: "Clock 2 Control Register."
        fields:
          - { name: "VCLK4R", msb: 11, lsb: 8, access: RW, desc: "VCLK4 Ratio." }
          - { name: "VCLK3R", msb: 3, lsb: 0, access: RW, desc: "VCLK3 Ratio." }
      VCLKACON1:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: "Peripheral Asynchronous Clock Configuration 1 Register."
        fields:
          - { name: "VCLKA4R", msb: 26, lsb: 24, access: RW, desc: "VCLKA4 Ratio." }
          - { name: "VCLKA4_DIV_CDDIS", bit: 20, access: RW, desc: "VCLKA4 Divider Disable." }
          - { name: "VCLKA4S", msb: 19, lsb: 16, access: RW, desc: "VCLKA4 Source." }
          - { name: "VCLKA3R", msb: 10, lsb: 8, access: RW, desc: "VCLKA3 Ratio." }
          - { name: "VCLKA3_DIV_CDDIS", bit: 4, access: RW, desc: "VCLKA3 Divider Disable." }
          - { name: "VCLKA3S", msb: 3, lsb: 0, access: RW, desc: "VCLKA3 Source." }
      CLKSLIP:
        offset: '0x70'
        access: RW
        reset: '0x00000000'
        desc: "Clock Slip Register."
        fields:
          - { name: "PLL1_SLIP_FILTER_COUNT", msb: 13, lsb: 8, access: RW, desc: "PLL1 Slip Filter Count." }
          - { name: "PLL1_SLIP_FILTER_KEY", msb: 3, lsb: 0, access: RW, desc: "PLL1 Slip Filter Key." }
      EFC_CTLREG:
        offset: '0xEC'
        access: RW
        reset: '0x00000000'
        desc: "EFUSE Controller Control Register."
        fields:
          - { name: "EFC_INSTR_WEN", msb: 3, lsb: 0, access: RW, desc: "EFUSE Instruction Write Enable." }
      DIEIDL_REG0:
        offset: '0xF0'
        access: RO
        reset: '0x00000000'
        desc: "Die Identification Register Lower Word (Mirrored)."
        fields:
          - { name: "WAFER_NUM", msb: 31, lsb: 24, access: RO, desc: "Wafer Number." }
      DIEIDH_REG1:
        offset: '0xF4'
        access: RO
        reset: '0x00000000'
        desc: "Die Identification Register Upper Word (Mirrored)."
        fields:
          - { name: "LOT_NUM", msb: 23, lsb: 0, access: RO, desc: "Lot Number." }

  VIM_PARITY:
    base_address: '0xFFFFFD00'
    desc: "VIM parity-related registers"
    registers:
      PARFLG:
        offset: '0x00EC'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Vector Table Parity Flag Register"
      PARCTL:
        offset: '0x00F0'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Vector Table Parity Control Register"
      ADDERR:
        offset: '0x00F4'
        access: RO
        reset: '0x00000000'
        desc: "Address Parity Error Register"
      FBPARERR:
        offset: '0x00F8'
        access: RO
        reset: '0x00000000'
        desc: "Fall-Back Address Parity Error Register"

  ADC:
    base_address: '0x00000000'
    desc: ''
    registers:
      ADRSTCR:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "ADC Reset Control Register"
        fields:
          - { name: "RESET", bit: 0, access: RW, desc: "Reset ADC internal state machines and control/status registers" }
      ADOPMODECR:
        offset: '0x04'
        access: RW
        reset: '0x00140000'
        desc: "ADC Operating Mode Control Register"
        fields:
          - { name: "10_12_BIT", bit: 31, access: RW, desc: "10-bit or 12-bit resolution selection" }
          - { name: "COS", bit: 24, access: RW, desc: "Continue on Suspend - emulation mode control" }
          - { name: "CHN_TEST_EN", msb: 20, lsb: 17, access: RW, desc: "Channel impedance measurement mode (reserved for TI)" }
          - { name: "RAM_TEST_EN", bit: 16, access: RW, desc: "Enable ADC Results RAM Test Mode" }
          - { name: "POWERDOWN", bit: 8, access: RW, desc: "ADC core power down control" }
          - { name: "IDLE_PWRDN", bit: 4, access: RW, desc: "ADC auto power down when idle" }
          - { name: "ADC_EN", bit: 0, access: RW, desc: "ADC module enable" }
      ADCLOCKCR:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "ADC Clock Control Register"
        fields:
          - { name: "PS", msb: 4, lsb: 0, access: RW, desc: "ADC Clock Prescaler, ADCLK = VCLK/(PS+1)" }
      ADCALCR:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "ADC Calibration Mode Control Register"
        fields:
          - { name: "SELF_TEST", bit: 24, access: RW, desc: "ADC Self Test Enable" }
          - { name: "CAL_ST", bit: 16, access: RW, desc: "ADC Calibration Conversion Start" }
          - { name: "BRIDGE_EN", bit: 9, access: RW, desc: "Bridge Enable for calibration mode" }
          - { name: "HILO", bit: 8, access: RW, desc: "Reference source selection for self-test and calibration" }
          - { name: "CAL_EN", bit: 0, access: RW, desc: "ADC Calibration Enable" }
      ADEVMODECR:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "ADC Event Group Operating Mode Control Register"
        fields:
          - { name: "No_Reset_on_ChnSel", bit: 16, access: RW, desc: "No Event Group Results Memory Reset on New Channel Select" }
          - { name: "EV_DATA_FMT", msb: 9, lsb: 8, access: RW, desc: "Event Group Read Data Format (12-bit mode only)" }
          - { name: "EV_CHID", bit: 5, access: RW, desc: "Enable Channel Id for Event Group results" }
          - { name: "OVR_EV_RAM_IGN", bit: 4, access: RW, desc: "Event Group memory overwrite enable" }
          - { name: "EV_8BIT", bit: 2, access: RW, desc: "Event Group 8-bit result mode (10-bit mode only)" }
          - { name: "EV_MODE", bit: 1, access: RW, desc: "Event Group Conversion Mode (single/continuous)" }
          - { name: "FRZ_EV", bit: 0, access: RW, desc: "Event Group Freeze Enable" }
      ADG1MODECR:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "ADC Group1 Operating Mode Control Register"
        fields:
          - { name: "No_Reset_on_ChnSel", bit: 16, access: RW, desc: "No Group1 Results Memory Reset on New Channel Select" }
          - { name: "G1_DATA_FMT", msb: 9, lsb: 8, access: RW, desc: "Group1 Read Data Format (12-bit mode only)" }
          - { name: "G1_CHID", bit: 5, access: RW, desc: "Enable Channel Id for Group1 results" }
          - { name: "OVR_G1_RAM_IGN", bit: 4, access: RW, desc: "Group1 memory overwrite enable" }
          - { name: "G1_HW_TRIG", bit: 3, access: RW, desc: "Group1 Hardware Triggered" }
          - { name: "G1_8BIT", bit: 2, access: RW, desc: "Group1 8-bit result mode (10-bit mode only)" }
          - { name: "G1_MODE", bit: 1, access: RW, desc: "Group1 Conversion Mode (single/continuous)" }
          - { name: "FRZ_G1", bit: 0, access: RW, desc: "Group1 Freeze Enable" }
      ADG2MODECR:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "ADC Group2 Operating Mode Control Register"
        fields:
          - { name: "No_Reset_on_ChnSel", bit: 16, access: RW, desc: "No Group2 Results Memory Reset on New Channel Select" }
          - { name: "G2_DATA_FMT", msb: 9, lsb: 8, access: RW, desc: "Group2 Read Data Format (12-bit mode only)" }
          - { name: "G2_CHID", bit: 5, access: RW, desc: "Enable Channel Id for Group2 results" }
          - { name: "OVR_G2_RAM_IGN", bit: 4, access: RW, desc: "Group2 memory overwrite enable" }
          - { name: "G2_HW_TRIG", bit: 3, access: RW, desc: "Group2 Hardware Triggered" }
          - { name: "G2_8BIT", bit: 2, access: RW, desc: "Group2 8-bit result mode (10-bit mode only)" }
          - { name: "G2_MODE", bit: 1, access: RW, desc: "Group2 Conversion Mode (single/continuous)" }
          - { name: "FRZ_G2", bit: 0, access: RW, desc: "Group2 Freeze Enable" }
      ADEVSRC:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "ADC Event Group Trigger Source Select Register"
        fields:
          - { name: "EV_EDG_BOTH", bit: 4, access: RW, desc: "Event Group triggered on both rising and falling edge" }
          - { name: "EV_EDG_SEL", bit: 3, access: RW, desc: "Event Group Trigger Edge Polarity Select" }
          - { name: "EV_SRC", msb: 2, lsb: 0, access: RW, desc: "Event Group Trigger Source (0-7)" }
      ADG1SRC:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "ADC Group1 Trigger Source Select Register"
        fields:
          - { name: "G1_EDG_BOTH", bit: 4, access: RW, desc: "Group1 triggered on both rising and falling edge" }
          - { name: "G1_EDG_SEL", bit: 3, access: RW, desc: "Group1 Trigger Edge Polarity Select" }
          - { name: "G1_SRC", msb: 2, lsb: 0, access: RW, desc: "Group1 Trigger Source (0-7)" }
      ADG2SRC:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "ADC Group2 Trigger Source Select Register"
        fields:
          - { name: "G2_EDG_BOTH", bit: 4, access: RW, desc: "Group2 triggered on both rising and falling edge" }
          - { name: "G2_EDG_SEL", bit: 3, access: RW, desc: "Group2 Trigger Edge Polarity Select" }
          - { name: "G2_SRC", msb: 2, lsb: 0, access: RW, desc: "Group2 Trigger Source (0-7)" }
      ADEVINTENA:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "ADC Event Interrupt Enable Control Register"
