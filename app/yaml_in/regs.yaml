          - { name: "TxOK", bit: 3, access: RW, desc: "Transmitted a message successfully" }
          - { name: "RxOK", bit: 4, access: RW, desc: "Received a message successfully" }
          - { name: "EPass", bit: 5, access: RW, desc: "Error Passive State" }
          - { name: "EWarn", bit: 6, access: RW, desc: "Warning State" }
          - { name: "BOff", bit: 7, access: RW, desc: "Bus-Off State" }
          - { name: "PER", bit: 8, access: RW, desc: "Parity Error Detected" }
          - { name: "WakeUpPnd", bit: 9, access: RW, desc: "Wake Up Pending" }
          - { name: "PDA", bit: 10, access: RW, desc: "Local power-down mode acknowledge" }
      DCAN_ERRC:
        offset: '0x08'
