          - { name: "PINMMR29_18", bit: 18, access: RW, desc: "Enable fast mode for asynchronous EMIF interface" }
          - { name: "PINMMR29_17", bit: 17, access: RW, desc: "Enable fast mode for synchronous EMIF interface" }
          - { name: "PINMMR29_16", bit: 16, access: RW, desc: "Connect MibSPI3_nCS[0]/AD2EVT terminal to GIOB[2] input for N2HET2 PIN_nDIS interrupt generation" }
          - { name: "PINMMR29_8", bit: 8, access: RW, desc: "Block EMIF SDRAM clock (EMIF_CLK) from output when set (default). Clear to enable SDRAM clock output" }

  LIN:
    base_address: '0x00000000'
    desc: ''
    registers:
      SCIGCR0:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "SCI Global Control Register 0"
        fields:
          - { name: "RESET", bit: 0, access: RW, desc: "Module reset control. 0=module in reset, 1=module out of reset" }
      SCIGCR1:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: >-
          SCI Global Control Register 1 - defines frame format, protocol, and communication mode
        fields:
          - { name: "TXENA", bit: 25, access: RW, desc: "Transmit enable. 0=transfers disabled, 1=transfers enabled" }
          - { name: "RXENA", bit: 24, access: RW, desc: "Receive enable. 0=receive disabled, 1=receive enabled" }
          - { name: "CONT", bit: 17, access: RW, desc: "Continue on suspend (debug mode). 0=halt on debug, 1=continue on debug" }
          - { name: "LOOP_BACK", bit: 16, access: RW, desc: "Loopback bit. 0=disabled, 1=enabled (LINTX internally connected to LINRX)" }
          - { name: "STOP_EXT_FRAME", bit: 13, access: RW, desc: "Stop extended frame communication (LIN mode only)" }
          - { name: "HGEN_CTRL", bit: 12, access: RW, desc: "HGEN control (LIN mode). Controls mask filtering comparison type" }
          - { name: "CTYPE", bit: 11, access: RW, desc: "Checksum type (LIN mode). 0=classic, 1=enhanced" }
          - { name: "MBUF_MODE", bit: 10, access: RW, desc: "Multi-buffer mode. 0=disabled, 1=enabled (use 8 RX/TX buffers)" }
          - { name: "ADAPT", bit: 9, access: RW, desc: "Adapt mode (LIN). 0=disabled, 1=automatic baud rate adjustment enabled" }
          - { name: "SLEEP", bit: 8, access: RW, desc: "SCI sleep mode. 0=disabled, 1=enabled" }
          - { name: "SWnRST", bit: 7, access: RW, desc: "Software reset (active low). 0=in reset, 1=ready state" }
          - { name: "LIN_MODE", bit: 6, access: RW, desc: "LIN mode select. 0=SCI mode, 1=LIN mode" }
          - { name: "CLOCK", bit: 5, access: RW, desc: "Clock source. SCI: 0=external, 1=internal. LIN: 0=slave, 1=master" }
          - { name: "STOP", bit: 4, access: RW, desc: "Number of stop bits (SCI mode). 0=one stop bit, 1=two stop bits" }
          - { name: "PARITY", bit: 3, access: RW, desc: "Parity selection (SCI mode). 0=odd parity, 1=even parity" }
          - { name: "PARITY_ENA", bit: 2, access: RW, desc: "Parity enable. 0=disabled, 1=enabled" }
          - { name: "TIMING_MODE", bit: 1, access: RW, desc: "Timing mode (SCI). 0=synchronous, 1=asynchronous" }
          - { name: "COMM_MODE", bit: 0, access: RW, desc: "Communication mode. SCI: 0=idle-line, 1=address-bit. LIN: controls ID4/ID5 usage" }
      SCIGCR2:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "SCI Global Control Register 2 - controls checksum, wakeup, and power-down"
        fields:
          - { name: "CC", bit: 17, access: RW, desc: "Compare checksum (LIN mode, extended frames). Write 1 to trigger compare" }
          - { name: "SC", bit: 16, access: RW, desc: "Send checksum (LIN mode, extended frames). Write 1 to send checksum byte" }
          - { name: "GEN_WU", bit: 8, access: RW, desc: "Generate wakeup signal (LIN mode). Write 1 to transmit TDO for wakeup" }
          - { name: "POWERDOWN", bit: 0, access: RW, desc: "Power down mode. 0=normal operation, 1=enter local low-power mode" }
      SCISETINT:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "SCI Set Interrupt Register - enables various interrupts"
        fields:
          - { name: "SET_BE_INT", bit: 31, access: RW, desc: "Set bit error interrupt (LIN mode). Write 1 to enable" }
          - { name: "SET_PBE_INT", bit: 30, access: RW, desc: "Set physical bus error interrupt (LIN mode). Write 1 to enable" }
          - { name: "SET_CE_INT", bit: 29, access: RW, desc: "Set checksum error interrupt (LIN mode). Write 1 to enable" }
          - { name: "SET_ISFE_INT", bit: 28, access: RW, desc: "Set inconsistent synch field error interrupt (LIN mode). Write 1 to enable" }
          - { name: "SET_NRE_INT", bit: 27, access: RW, desc: "Set no-response error interrupt (LIN mode). Write 1 to enable" }
          - { name: "SET_FE_INT", bit: 26, access: RW, desc: "Set framing error interrupt. Write 1 to enable" }
          - { name: "SET_OE_INT", bit: 25, access: RW, desc: "Set overrun error interrupt. Write 1 to enable" }
          - { name: "SET_PE_INT", bit: 24, access: RW, desc: "Set parity error interrupt. Write 1 to enable" }
          - { name: "SET_RX_DMA_ALL", bit: 18, access: RW, desc: "Set receive DMA for all frames (SCI mode). 0=interrupt for address, DMA for data; 1=DMA for both" }
          - { name: "SET_RX_DMA", bit: 17, access: RW, desc: "Set receiver DMA. Write 1 to enable RX DMA requests" }
          - { name: "SET_TX_DMA", bit: 16, access: RW, desc: "Set transmit DMA. Write 1 to enable TX DMA requests" }
          - { name: "SET_ID_INT", bit: 13, access: RW, desc: "Set identification interrupt (LIN mode). Write 1 to enable on valid matching ID" }
          - { name: "SET_RX_INT", bit: 9, access: RW, desc: "Set receiver interrupt. Write 1 to enable" }
          - { name: "SET_TX_INT", bit: 8, access: RW, desc: "Set transmitter interrupt. Write 1 to enable" }
          - { name: "SET_TOA3WUS_INT", bit: 7, access: RW, desc: "Set timeout after three wakeup signals interrupt (LIN mode). Write 1 to enable" }
          - { name: "SET_TOAWUS_INT", bit: 6, access: RW, desc: "Set timeout after wakeup signal interrupt (LIN mode). Write 1 to enable" }
          - { name: "SET_TIMEOUT_INT", bit: 4, access: RW, desc: "Set timeout interrupt (LIN mode). Write 1 to enable on bus idle >4s" }
          - { name: "SET_WAKEUP_INT", bit: 1, access: RW, desc: "Set wakeup interrupt. Write 1 to enable wakeup from low-power mode" }
          - { name: "SET_BRKDT_INT", bit: 0, access: RW, desc: "Set break detect interrupt (SCI mode). Write 1 to enable" }
      SCICLEARINT:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "SCI Clear Interrupt Register - disables interrupts without accessing SCISETINT"
        fields:
          - { name: "CLR_BE_INT", bit: 31, access: RW, desc: "Clear bit error interrupt. Write 1 to disable" }
          - { name: "CLR_RX_INT", bit: 9, access: RW, desc: "Clear receiver interrupt. Write 1 to disable" }
          - { name: "CLR_TX_INT", bit: 8, access: RW, desc: "Clear transmitter interrupt. Write 1 to disable" }
      SCISETINTLVL:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "SCI Set Interrupt Level Register - maps interrupts to INT0 or INT1 lines"
        fields:
          - { name: "SET_BE_INT_LVL", bit: 31, access: RW, desc: "Set bit error interrupt level. 0=INT0, 1=INT1" }
          - { name: "SET_RX_INT_LVL", bit: 9, access: RW, desc: "Set receiver interrupt level. 0=INT0, 1=INT1" }
          - { name: "SET_TX_INT_LVL", bit: 8, access: RW, desc: "Set transmitter interrupt level. 0=INT0, 1=INT1" }
      SCICLEARINTLVL:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "SCI Clear Interrupt Level Register - clears interrupt level assignments"
      SCIFLR:
        offset: '0x1C'
        access: RO
        reset: '0x00000D00'
        desc: "SCI Flags Register - status and error flags"
        fields:
          - { name: "BE", bit: 31, access: RW, desc: "Bit error flag (LIN mode). Set when bit error detected by bit monitor" }
          - { name: "PBE", bit: 30, access: RW, desc: "Physical bus error flag (LIN mode). Set when physical bus error detected" }
          - { name: "CE", bit: 29, access: RW, desc: "Checksum error flag (LIN mode). Set when checksum error detected" }
          - { name: "ISFE", bit: 28, access: RW, desc: "Inconsistent synch field error flag (LIN mode). Set during header reception" }
          - { name: "NRE", bit: 27, access: RW, desc: "No-response error flag (LIN mode). Set when no response within TFRAME_MAX" }
          - { name: "FE", bit: 26, access: RW, desc: "Framing error flag. Set when expected stop bit not found" }
          - { name: "OE", bit: 25, access: RW, desc: "Overrun error flag. Set when SCIRXSHF overwrites unread data in SCIRD" }
          - { name: "PE", bit: 24, access: RW, desc: "Parity error flag. Set when parity mismatch detected" }
          - { name: "ID_RX_FLAG", bit: 14, access: RW, desc: "Identifier on receive flag (LIN mode). Set when valid ID received with RX match" }
          - { name: "ID_TX_FLAG", bit: 13, access: RW, desc: "Identifier on transmit flag (LIN mode). Set when valid ID received with TX match" }
          - { name: "RXWAKE", bit: 12, access: RW, desc: "Receiver wakeup detect flag (SCI mode). Indicates SCIRD contains address" }
          - { name: "TX_EMPTY", bit: 11, access: RW, desc: "Transmitter empty flag. Set when TX buffer and shift register empty" }
          - { name: "TXWAKE", bit: 10, access: RW, desc: "Transmitter wakeup method select (SCI mode). Controls address/data frame type" }
          - { name: "RXRDY", bit: 9, access: RW, desc: "Receiver ready flag. Set when SCIRD contains new data ready to read" }
          - { name: "TXRDY", bit: 8, access: RW, desc: "Transmitter buffer ready flag. Set when TX buffer ready for new data" }
          - { name: "TOA3WUS", bit: 7, access: RW, desc: "Timeout after three wakeup signals flag (LIN mode)" }
          - { name: "TOAWUS", bit: 6, access: RW, desc: "Timeout after wakeup signal flag (LIN mode)" }
          - { name: "TIMEOUT", bit: 4, access: RW, desc: "LIN bus idle timeout flag. Set after 4s of bus inactivity" }
          - { name: "BUSY", bit: 3, access: RW, desc: "Bus busy flag. Set when receiver actively receiving frame" }
          - { name: "IDLE", bit: 2, access: RW, desc: "SCI receiver in idle state (SCI mode). Set until 11-bit idle period detected" }
          - { name: "WAKEUP", bit: 1, access: RW, desc: "Wakeup flag (LIN mode). Set when module exits power-down due to activity" }
          - { name: "BRKDT", bit: 0, access: RW, desc: "Break detect flag (SCI mode). Set when break condition detected on LINRX" }
      SCIINTVECT0:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "SCI Interrupt Vector Offset 0 - offset for INT0 line"
        fields:
          - { name: "INTVECT0", msb: 4, lsb: 0, access: RW, desc: "Interrupt vector offset for INT0. Cleared by read" }
      SCIINTVECT1:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "SCI Interrupt Vector Offset 1 - offset for INT1 line"
        fields:
          - { name: "INTVECT1", msb: 4, lsb: 0, access: RW, desc: "Interrupt vector offset for INT1. Cleared by read" }
      SCIFORMAT:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "SCI Format Control Register - configures frame format"
        fields:
          - { name: "LENGTH", msb: 18, lsb: 16, access: RW, desc: "Frame length control. Indicates number of bytes in response (1-8) for LIN or characters for buffered SCI" }
          - { name: "CHAR", msb: 2, lsb: 0, access: RW, desc: "Character length control (SCI mode). Sets character length from 1 to 8 bits" }
      BRS:
        offset: '0x2C'
        access: RW
        reset: '0x00000000'
        desc: "Baud Rate Selection Register - controls baud rate generation"
        fields:
          - { name: "U", msb: 30, lsb: 28, access: RW, desc: "Super fractional divider. Additional fractional part for fine baud rate tuning (0-7)" }
          - { name: "M", msb: 27, lsb: 24, access: RW, desc: "4-bit fractional divider. Fractional part for baud rate (0-15)" }
          - { name: "PRESCALER_P", msb: 23, lsb: 0, access: RW, desc: "24-bit integer prescaler. Selects baud rate divisor (0-16777215)" }
      SCIED:
        offset: '0x30'
        access: RW
        reset: '0x00000000'
        desc: "Receiver Emulation Data Buffer - same as SCIRD but read doesn't clear RXRDY"
        fields:
          - { name: "ED", msb: 7, lsb: 0, access: RW, desc: "Emulator data (SCI mode). For emulator use only" }
      SCIRD:
        offset: '0x34'
        access: RW
        reset: '0x00000000'
        desc: "Receiver Data Buffer - contains received data"
        fields:
          - { name: "RD", msb: 7, lsb: 0, access: RW, desc: "Receiver data (SCI mode). Reading clears RXRDY flag" }
      SCITD:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "Transmit Data Buffer - data to be transmitted"
        fields:
          - { name: "TD", msb: 7, lsb: 0, access: RW, desc: "Transmit data (SCI mode). Data to transmit" }
      SCIPIO0:
        offset: '0x3C'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 0 - function select for LINRX and LINTX pins"
        fields:
          - { name: "TX_FUNC", bit: 1, access: RW, desc: "LINTX function. 0=general-purpose I/O, 1=SCI/LIN transmit" }
          - { name: "RX_FUNC", bit: 0, access: RW, desc: "LINRX function. 0=general-purpose I/O, 1=SCI/LIN receive" }
      SCIPIO1:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 1"
      SCIPIO2:
        offset: '0x44'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 2"
      SCIPIO3:
        offset: '0x48'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 3"
      SCIPIO4:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 4"
      SCIPIO5:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 5"
      SCIPIO6:
        offset: '0x54'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 6"
      SCIPIO7:
        offset: '0x58'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 7"
      SCIPIO8:
        offset: '0x5C'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 8"
      LINCOMPARE:
        offset: '0x60'
        access: RW
        reset: '0x00000000'
        desc: "LIN Compare Register - LIN mode comparison settings"
      LINRD0:
        offset: '0x64'
        access: RW
        reset: '0x00000000'
        desc: "LIN Receive Buffer 0 Register - first 4 receive data bytes (RD0-RD3)"
      LINRD1:
        offset: '0x68'
        access: RW
        reset: '0x00000000'
        desc: "LIN Receive Buffer 1 Register - second 4 receive data bytes (RD4-RD7)"
      LINMASK:
        offset: '0x6C'
        access: RW
        reset: '0x00000000'
        desc: "LIN Mask Register - contains RX_ID_MASK and TX_ID_MASK for message filtering"
        fields:
          - { name: "TX_ID_MASK", msb: 23, lsb: 16, access: RW, desc: "Transmit ID mask. Bits set to 1 are don't care for TX match comparison" }
          - { name: "RX_ID_MASK", msb: 7, lsb: 0, access: RW, desc: "Receive ID mask. Bits set to 1 are don't care for RX match comparison" }
      LINID:
        offset: '0x70'
        access: RW
        reset: '0x00000000'
        desc: >-
          LIN Identification Register - contains received ID and ID-SlaveTask for filtering
        fields:
          - { name: "RECEIVED_ID", msb: 23, lsb: 16, access: RO, desc: "Received identifier. Contains ID from received header (read-only)" }
          - { name: "ID_SLAVETASK_BYTE", msb: 7, lsb: 0, access: RW, desc: "ID-SlaveTask byte for filtering. Used with LINMASK for RX/TX match comparison" }
          - { name: "IDBYTE", msb: 7, lsb: 0, access: RW, desc: "ID byte (master mode). Writing triggers header generation" }
      LINTD0:
        offset: '0x74'
        access: RW
        reset: '0x00000000'
        desc: "LIN Transmit Buffer 0 - first 4 transmit data bytes (TD0-TD3)"
        fields:
          - { name: "TD0", msb: 31, lsb: 24, access: RW, desc: "Transmit data byte 0. Writing triggers response transmission" }
      LINTD1:
        offset: '0x78'
        access: RW
        reset: '0x00000000'
        desc: "LIN Transmit Buffer 1 - second 4 transmit data bytes (TD4-TD7)"
      MBRS:
        offset: '0x7C'
        access: RW
        reset: '0x00000000'
        desc: "Maximum Baud Rate Selection Register - used for adaptive mode measurements"
      IODFTCTRL:
        offset: '0x90'
        access: RW
        reset: '0x00000000'
        desc: "Input/Output Error Enable Register"

  PBIST:
    base_address: '0x00000000'
    desc: ''
    registers:
      RAMT:
        offset: '0x160'
        access: RW
        reset: '0xXXXXXXXX'
        desc: >-
          RAM Configuration Register - provides information regarding memory currently being tested
        fields:
          - { name: "RGS", msb: 31, lsb: 24, access: RW, desc: "Ram Group Select" }
          - { name: "RDS", msb: 23, lsb: 16, access: RW, desc: "Return Data Select" }
          - { name: "DWR", msb: 15, lsb: 8, access: RW, desc: "Data Width Register" }
          - { name: "SMS", msb: 7, lsb: 6, access: RW, desc: "Sense Margin Select Register" }
          - { name: "PLS", msb: 5, lsb: 2, access: RW, desc: "Pipeline Latency Select" }
          - { name: "RLS", msb: 1, lsb: 0, access: RW, desc: "RAM Latency Select" }
      DLR:
        offset: '0x164'
        access: RW
        reset: '0x00000014'
        desc: "Datalogger Register - puts PBIST controller into appropriate comparison modes"
        fields:
          - { name: "DLR4", bit: 4, access: RW, desc: "Config access - allows host processor to configure PBIST controller registers" }
          - { name: "DLR2", bit: 2, access: RW, desc: "ROM-based testing - enables PBIST controller to execute test algorithms from PBIST ROM" }
      PACT:
        offset: '0x180'
        access: RW
        reset: '0x00000000'
        desc: >-
          PBIST Activate/Clock Enable Register - first register to program to activate PBIST controller
        fields:
          - { name: "PACT0", bit: 0, access: RW, desc: "PBIST internal clocks enable. 0=Disable, 1=Enable" }
      PBISTID:
        offset: '0x184'
        access: RW
        reset: '0x00000000'
        desc: "PBIST ID Register - unique ID for each PBIST controller"
        fields:
          - { name: "PBIST_ID", msb: 7, lsb: 0, access: RW, desc: "Unique ID assigned to each PBIST controller in device with multiple PBIST controllers" }
      OVER:
        offset: '0x188'
        access: RW
        reset: '0x00000001'
        desc: "Override Register - controls RAM info override"
        fields:
          - { name: "OVER0", bit: 0, access: RW, desc: "RINFO Override Bit. 0=Use RINFOL/RINFOU, 1=ROM overrides RAM info registers" }
      FSRF0:
        offset: '0x190'
        access: RO
        reset: '0x00000000'
        desc: "Fail Status Fail Register 0 - indicates if Port0 failure occurred"
        fields:
          - { name: "FSRF0", bit: 0, access: RW, desc: "Fail Status 0. 0=No failure, 1=Failure occurred on port 0" }
      FSRC0:
        offset: '0x198'
        access: RO
        reset: '0x00000000'
        desc: "Fail Status Count Register 0 - keeps count of failures on port 0"
        fields:
          - { name: "FSRC0", msb: 7, lsb: 0, access: RW, desc: "Fail Status Count 0 - indicates number of failures on port 0" }
      FSRC1:
        offset: '0x19C'
        access: RO
        reset: '0x00000000'
        desc: "Fail Status Count Register 1 - keeps count of failures on port 1"
        fields:
          - { name: "FSRC1", msb: 7, lsb: 0, access: RW, desc: "Fail Status Count 1 - indicates number of failures on port 1" }
      FSRA0:
        offset: '0x1A0'
        access: RO
        reset: '0x00000000'
        desc: >-
          Fail Status Address 0 Register - captures memory address of first failure on port 0
        fields:
          - { name: "FSRA0", msb: 15, lsb: 0, access: RW, desc: "Fail Status Address 0 - contains address of first failure" }
      FSRA1:
        offset: '0x1A4'
        access: RO
        reset: '0x00000000'
        desc: >-
          Fail Status Address 1 Register - captures memory address of first failure on port 1
        fields:
          - { name: "FSRA1", msb: 15, lsb: 0, access: RW, desc: "Fail Status Address 1 - contains address of first failure" }
      FSRDL0:
        offset: '0x1A8'
        access: RO
        reset: '0xAAAAAAAA'
        desc: "Fail Status Data Register 0 - captures failure data on port 0"
        fields:
          - { name: "FSRDL0", msb: 31, lsb: 0, access: RW, desc: "Failure data on port 0" }
      FSRDL1:
        offset: '0x1B0'
        access: RO
        reset: '0xAAAAAAAA'
        desc: "Fail Status Data Register 1 - captures failure data on port 1"
        fields:
          - { name: "FSRDL1", msb: 31, lsb: 0, access: RW, desc: "Failure data on port 1" }
      ROM:
        offset: '0x1C0'
        access: RW
        reset: '0x00000003'
        desc: "ROM Mask Register - sets ROM access modes for PBIST controller"
        fields:
          - { name: "ROM", msb: 1, lsb: 0, access: RW, desc: "ROM Mask. 0=No ROM info, 1=RAM Group from ROM, 2=Algorithm from ROM, 3=Both from ROM" }
      ALGO:
        offset: '0x1C4'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "ROM Algorithm Mask Register - indicates algorithm(s) for memory self-test"
        fields:
          - { name: "ALGO", msb: 31, lsb: 0, access: RW, desc: "Algorithm selection bits. Each bit selects corresponding algorithm (1-32)" }
      RINFOL:
        offset: '0x1C8'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "RAM Info Mask Lower Register - selects RAM groups 1-32 for test"
        fields:
          - { name: "RINFOL", msb: 31, lsb: 0, access: RW, desc: "RAM Group selection bits 1-32. Each bit selects corresponding RAM group" }
      RINFOU:
        offset: '0x1CC'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "RAM Info Mask Upper Register - selects RAM groups 33-64 for test"
        fields:
          - { name: "RINFOU", msb: 31, lsb: 0, access: RW, desc: "RAM Group selection bits 33-64. Each bit selects corresponding RAM group" }

  SPI:
    base_address: '0x00000000'
    desc: ''
    registers:
      SPIGCR0:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "SPI Global Control Register 0"
        fields:
          - { name: "nRESET", bit: 0, access: RW, desc: "Local reset control for module. Must be set to 1 before any SPI/MibSPI operation" }
      SPIGCR1:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "SPI Global Control Register 1"
        fields:
          - { name: "SPIEN", bit: 24, access: RW, desc: "SPI enable. Must be set after configuration. Forces several registers to default when cleared" }
          - { name: "LOOPBACK", bit: 16, access: RW, desc: "Internal loop-back test mode. SPISIMO pins connected internally to SPISOMI pins" }
          - { name: "POWERDOWN", bit: 8, access: RW, desc: "Local low-power mode. Stops clocks to internal logic" }
          - { name: "CLKMOD", bit: 1, access: RW, desc: "Clock mode. Selects internal or external clock source. 0=external, 1=internal" }
          - { name: "MASTER", bit: 0, access: RW, desc: "SPISIMO/SPISOMI pin direction. 0=slave mode, 1=master mode" }
      SPIINT0:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "SPI Interrupt Register"
        fields:
          - { name: "ENABLEHIGHZ", bit: 24, access: RW, desc: "SPIENA pin high-impedance enable when not active (slave mode)" }
          - { name: "DMAREQEN", bit: 16, access: RW, desc: "DMA request enable for both receive and transmit channels" }
          - { name: "TXINTENA", bit: 9, access: RW, desc: "Transmit buffer empty interrupt enable (compatibility mode only)" }
          - { name: "RXINTENA", bit: 8, access: RW, desc: "Receive buffer full interrupt enable (compatibility mode only)" }
          - { name: "RXOVRNINTENA", bit: 6, access: RW, desc: "Receive overrun interrupt enable" }
          - { name: "BITERRENA", bit: 4, access: RW, desc: "Bit error interrupt enable" }
          - { name: "DESYNCENA", bit: 3, access: RW, desc: "Desynchronized slave interrupt enable (master mode only)" }
          - { name: "PARERRENA", bit: 2, access: RW, desc: "Parity error interrupt enable" }
          - { name: "TIMEOUTENA", bit: 1, access: RW, desc: "ENA signal timeout interrupt enable" }
          - { name: "DLENERRENA", bit: 0, access: RW, desc: "Data length error interrupt enable" }
      SPILVL:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "SPI Interrupt Level Register"
        fields:
          - { name: "TXINTLVL", bit: 9, access: RW, desc: "Transmit interrupt level. 0=INT0, 1=INT1" }
          - { name: "RXINTLVL", bit: 8, access: RW, desc: "Receive interrupt level. 0=INT0, 1=INT1" }
      SPIFLG:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "SPI Flag Register"
        fields:
          - { name: "BUFINITACTIVE", bit: 24, access: RW, desc: "Multi-buffer RAM initialization status. 0=complete, 1=in progress" }
          - { name: "TXINTFLG", bit: 9, access: RW, desc: "Transmit buffer empty flag" }
          - { name: "RXINTFLG", bit: 8, access: RW, desc: "Receive buffer full flag" }
          - { name: "RXOVRNINTFLG", bit: 6, access: RW, desc: "Receive overrun flag" }
          - { name: "BITERRFLG", bit: 4, access: RW, desc: "Bit error flag - mismatch between transmitted and sampled data" }
          - { name: "DESYNCFLG", bit: 3, access: RW, desc: "Desynchronization of slave device flag (master mode)" }
          - { name: "PARERRFLG", bit: 2, access: RW, desc: "Parity error flag" }
          - { name: "TIMEOUTFLG", bit: 1, access: RW, desc: "ENA signal timeout flag" }
          - { name: "DLENERRFLG", bit: 0, access: RW, desc: "Data length error flag" }
      SPIPC0:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "SPI Pin Control Register 0 - Function selection"
        fields:
          - { name: "SOMIFUN", msb: 31, lsb: 24, access: RW, desc: "SPISOMI pin function. 0=GIO, 1=SPI functional" }
          - { name: "SIMOFUN", msb: 23, lsb: 16, access: RW, desc: "SPISIMO pin function. 0=GIO, 1=SPI functional" }
          - { name: "CLKFUN", bit: 9, access: RW, desc: "SPICLK pin function. 0=GIO, 1=SPI functional" }
          - { name: "ENAFUN", bit: 8, access: RW, desc: "SPIENA pin function. 0=GIO, 1=SPI functional" }
          - { name: "SCSFUN", msb: 7, lsb: 0, access: RW, desc: "SPICS pins function. 0=GIO, 1=SPI functional" }
      SPIDAT1:
        offset: '0x3C'
        access: RW
        reset: '0x00000000'
        desc: "SPI Transmit Data Register 1 with control fields"
        fields:
          - { name: "CSHOLD", bit: 28, access: RW, desc: "Chip select hold mode. Holds CS active after transfer in master mode" }
          - { name: "WDEL", bit: 26, access: RW, desc: "Enable delay counter at end of transaction (master mode)" }
          - { name: "DFSEL", msb: 25, lsb: 24, access: RW, desc: "Data format select. Selects SPIFMTx register (0-3)" }
          - { name: "CSNR", msb: 23, lsb: 16, access: RW, desc: "Chip select number. Bit mask controlling SPICS pins" }
          - { name: "TXDATA", msb: 15, lsb: 0, access: RW, desc: "Transmit data (right-justified)" }
      SPIBUF:
        offset: '0x40'
        access: RW
        reset: '0x80000000'
        desc: "SPI Receive Buffer Register"
        fields:
          - { name: "RXEMPTY", bit: 31, access: RW, desc: "Receive buffer empty flag" }
          - { name: "RXOVR", bit: 30, access: RW, desc: "Receive buffer overrun flag" }
          - { name: "TXFULL", bit: 29, access: RW, desc: "Transmit buffer full flag" }
          - { name: "RXDATA", msb: 15, lsb: 0, access: RW, desc: "Received data (right-justified)" }
      SPIFMT0:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "SPI Data Format Register 0"
        fields:
          - { name: "WDELAY", msb: 31, lsb: 24, access: RW, desc: "Delay between transmissions in VCLK cycles" }
          - { name: "PARITYENA", bit: 22, access: RW, desc: "Parity enable. 0=disabled, 1=enabled" }
          - { name: "SHIFTDIR", bit: 20, access: RW, desc: "Shift direction. 0=MSB first, 1=LSB first" }
          - { name: "POLARITY", bit: 17, access: RW, desc: "Clock polarity. 0=low inactive, 1=high inactive" }
          - { name: "PHASE", bit: 16, access: RW, desc: "Clock phase/delay. 0=no delay, 1=half cycle delay" }
          - { name: "PRESCALE", msb: 15, lsb: 8, access: RW, desc: "Clock prescaler. SPICLK = VCLK/(PRESCALE+1)" }
          - { name: "CHARLEN", msb: 4, lsb: 0, access: RW, desc: "Character length in bits (2-16)" }
      MIBSPIE:
        offset: '0x70'
        access: RW
        reset: '0x00000000'
        desc: "Multi-buffer Mode Enable Register"
        fields:
          - { name: "MSPIENA", bit: 0, access: RW, desc: "Multi-buffer mode enable. 0=compatibility mode, 1=multi-buffer mode" }

  PLL:
    base_address: '0x00000000'
    desc: ''
    registers:
      CSDIS:
        offset: '0xFFFFFF30'
        access: RW
        reset: '0x00000000'
        desc: "Clock Source Disable Register"
        fields:
          - { name: "OSC_DISABLE", bit: 0, access: RW, desc: "Oscillator disable control. Cleared to 0 by default on system or power-on reset so oscillator starts by default" }
          - { name: "PLL1_DISABLE", bit: 1, access: RW, desc: "PLL1 disable control" }
          - { name: "LF_LPO_DISABLE", bit: 4, access: RW, desc: "Low-frequency low-power oscillator disable control. Disables the comparator that generates LF LPO" }
          - { name: "HF_LPO_DISABLE", bit: 5, access: RW, desc: "High-frequency low-power oscillator disable control. Disables the comparator that generates HF LPO" }
          - { name: "PLL2_DISABLE", bit: 6, access: RW, desc: "PLL2 disable control" }
      CSDISSET:
        offset: '0xFFFFFF34'
        access: RW
        reset: '0x00000000'
        desc: >-
          Clock Source Disable Set Register. Allows setting bits in CSDIS without read-modify-write
      CSDISCLR:
        offset: '0xFFFFFF38'
        access: RW
        reset: '0x00000000'
        desc: >-
          Clock Source Disable Clear Register. Allows clearing bits in CSDIS without read-modify-write
        fields:
          - { name: "OSC_ENABLE", bit: 0, access: RW, desc: "Setting this bit enables the oscillator by clearing CSDIS.0" }
          - { name: "PLL1_ENABLE", bit: 1, access: RW, desc: "Setting this bit enables PLL1 by clearing CSDIS.1" }
          - { name: "PLL2_ENABLE", bit: 6, access: RW, desc: "Setting this bit enables PLL2 by clearing CSDIS.6" }
      CSVSTAT:
        offset: '0xFFFFFF54'
        access: RO
        reset: '0x00000000'
        desc: "Clock Source Valid Status Register"
        fields:
          - { name: "CLKSR0V", bit: 0, access: RW, desc: "Clock source 0 (oscillator) valid bit. Set after 1024 oscillator periods are counted" }
          - { name: "CLKSRnV", bit: 0, access: RW, desc: "Clock source valid bits for various clock sources including PLLs" }
      PLLCTL1:
        offset: '0xFFFFFF70'
        access: RW
        reset: '0x00000000'
        desc: >-
          PLL Control 1 Register. Controls PLL1 parameters including multiplier, dividers, and slip response
        fields:
          - { name: "REFCLKDIV", msb: 5, lsb: 0, access: RW, desc: "Reference clock divider NR. Divides input clock before PLL. NR = REFCLKDIV + 1, range 1-64" }
          - { name: "PLLMUL", msb: 15, lsb: 0, access: RW, desc: "PLL multiplier NF. VCO multiplication factor. NF = (PLLMUL + 256)/256 for non-modulated mode" }
          - { name: "ROF", bit: 23, access: RW, desc: "Reset on oscillator failure. When set, device resets on oscillator failure" }
          - { name: "BPOS", msb: 30, lsb: 29, access: RW, desc: "Bypass on slip. Controls automatic switchover and error response on PLL slip. 10b=disabled, others=enabled" }
      PLLCTL2:
        offset: '0xFFFFFF74'
        access: RW
        reset: '0x00000000'
        desc: >-
          PLL Control 2 Register. Controls PLL1 output dividers and frequency modulation parameters
        fields:
          - { name: "PLLDIV", msb: 4, lsb: 0, access: RW, desc: "PLL output divider R. Post-divider value. R = PLLDIV + 1, range 1-32" }
          - { name: "ODPLL", msb: 2, lsb: 0, access: RW, desc: "Output divider OD. Post-VCO divider. OD = ODPLL + 1, range 1-8" }
          - { name: "SPR_AMOUNT", msb: 8, lsb: 0, access: RW, desc: "Spread amount NV. Modulation depth parameter. NV = (SPR_AMOUNT + 1)/2048" }
          - { name: "SPREADINGRATE", msb: 8, lsb: 0, access: RW, desc: "Spreading rate NS. Modulation frequency parameter. NS = SPREADINGRATE + 1" }
          - { name: "FMENA", bit: 31, access: RW, desc: "Frequency modulation enable. Enables triangular down-spread modulation" }
          - { name: "MULMOD", msb: 8, lsb: 0, access: RW, desc: "Multiplier modulation offset. Adjusts NF to maintain average frequency during modulation" }
      PLLCTL3:
        offset: '0xFFFFE100'
        access: RW
        reset: '0x00000000'
        desc: >-
          PLL Control 3 Register. Controls PLL2 parameters. Identical to PLL1 but without modulation support
      LPOMONCTL:
        offset: '0xFFFFFF88'
        access: RW
        reset: '0x00000000'
        desc: "LPO/Clock Monitor Control Register. Controls LPO trim values and bias enable"
        fields:
          - { name: "TRIM_INITIAL", msb: 15, lsb: 0, access: RW, desc: "Initial trim value for HF LPO and LF LPO. Should be loaded from OTP at address 0xF00801B4 bits 31:16" }
          - { name: "HFTRIM", msb: 4, lsb: 0, access: RW, desc: "High-frequency LPO trim. Varies current to trim HF LPO frequency" }
          - { name: "LFTRIM", msb: 4, lsb: 0, access: RW, desc: "Low-frequency LPO trim. Varies current to trim LF LPO frequency" }
          - { name: "BIASEN", bit: 24, access: RW, desc: "Bias enable. Enables/disables current source driving the LPO" }
      CLKTEST:
        offset: '0xFFFFFF8C'
        access: RW
        reset: '0x00000000'
        desc: "Clock Test Register. Controls clock detect enable/disable"
        fields:
          - { name: "RANGE_DET_CTRL", bit: 25, access: RW, desc: "Range detect control. Must be cleared to 0 to disable clock detect" }
          - { name: "RANGE_DET_ENA_SSET", bit: 24, access: RW, desc: "Range detect enable set. Must be set to 1 to disable clock detect" }
      GLBSTAT:
        offset: '0xFFFFFFEC'
        access: RO
        reset: '0x00000000'
        desc: "Global Status Register. Contains oscillator fail and PLL slip status flags"
        fields:
          - { name: "OSCFAIL", bit: 0, access: RW, desc: "Oscillator fail flag. Set when clock detect switches from oscillator to HF LPO due to oscillator failure" }
          - { name: "RFSLIP", bit: 0, access: RW, desc: "PLL running too fast slip flag. Set when PLL output runs too fast relative to input" }
          - { name: "FBSLIP", bit: 0, access: RW, desc: "PLL running too slow slip flag. Set when PLL output runs too slow relative to input" }
      CLKSLIP:
        offset: '0xFFFFE170'
        access: RW
        reset: '0x00000000'
        desc: "PLL Clock Slip Control Register"
      SSWPLL1:
        offset: '0xFFFFFF24'
        access: RW
        reset: '0x00000000'
        desc: >-
          PLL Modulation Depth Measurement Control Register. Controls depth measurement and frequency measurement circuits for PLL1
        fields:
          - { name: "CAPTURE_WINDOW_INDEX", msb: 15, lsb: 8, access: RW, desc: "Capture window index. Should be set equal to NR for modulation depth measurement" }
          - { name: "COUNTER_READ_READY", bit: 6, access: RW, desc: "Counter read ready flag. Indicates SSWPLL2 and SSWPLL3 registers can be read" }
          - { name: "COUNTER_RESET", bit: 5, access: RW, desc: "Counter reset. Resets SSW_CAPTURE_COUNT and SSW_CLKOUT_COUNT when EXT_COUNTER_EN=0" }
          - { name: "COUNTER_EN", bit: 4, access: RW, desc: "Counter enable. Enables/disables measurement counters" }
          - { name: "TAP_COUNTER_DIS", msb: 3, lsb: 1, access: RW, desc: "Tap counter disable. Selects which bit of CLKOUT counter triggers measurement stop" }
          - { name: "EXT_COUNTER_EN", bit: 0, access: RW, desc: "External counter enable. 0=Modulation Depth Measurement mode, 1=Frequency Measurement mode" }
      SSWPLL2:
        offset: '0xFFFFFF28'
        access: RW
        reset: '0x00000000'
        desc: "SSW PLL BIST Control Register 2. Observation register for capture counter value"
        fields:
          - { name: "SSW_CAPTURE_COUNT", msb: 31, lsb: 0, access: RW, desc: "Capture count value. Increments within modulation window (EXT_COUNTER_EN=0) or based on oscillator (EXT_COUNTER_EN=1)" }
      SSWPLL3:
        offset: '0xFFFFFF2C'
        access: RW
        reset: '0x00000000'
        desc: "SSW PLL BIST Control Register 3. Observation register for CLKOUT counter value"
        fields:
          - { name: "SSW_CLKOUT_COUNT", msb: 31, lsb: 0, access: RW, desc: "CLKOUT count value. Increments based on PLL output prior to R-divider" }
      GPREG1:
        offset: '0xFFFFFFA0'
        access: RW
        reset: '0x00000000'
        desc: "General Purpose Register"

  PMM:
    base_address: '0x00000000'
    desc: ''
    registers:
      LOGICPDPWRCTRL0:
        offset: '0x00'
        access: RW
        reset: 'X'
        desc: "Logic Power Domain Control Register 0"
        fields:
          - { name: "LOGICPDON0", msb: 27, lsb: 24, access: RW, desc: "Power domain PD2 control. Write 0xA to command OFF state, any other value commands Active state." }
          - { name: "LOGICPDON1", msb: 19, lsb: 16, access: RW, desc: "Power domain PD3 control. Write 0xA to command OFF state, any other value commands Active state." }
          - { name: "LOGICPDON2", msb: 11, lsb: 8, access: RW, desc: "Power domain PD4 control. Write 0xA to command OFF state, any other value commands Active state." }
          - { name: "LOGICPDON3", msb: 3, lsb: 0, access: RW, desc: "Power domain PD5 control. Write 0xA to command OFF state, any other value commands Active state." }
      MEMPDPWRCTRL0:
        offset: '0x10'
        access: RW
        reset: 'X'
        desc: "Memory Power Domain Control Register 0"
        fields:
          - { name: "MEMPDON0", msb: 27, lsb: 24, access: RW, desc: "Power domain RAM_PD1 control. Write 0xA to command OFF state, any other value commands Active state." }
          - { name: "MEMPDON1", msb: 19, lsb: 16, access: RW, desc: "Power domain RAM_PD2 control. Write 0xA to command OFF state, any other value commands Active state." }
      PDCLKDIS:
        offset: '0x20'
        access: RW
        reset: 'X'
        desc: "Power Domain Clock Disable Register"
        fields:
          - { name: "PDCLK_DIS_3", bit: 3, access: RW, desc: "Disable clocks to logic power domain PD5. 0=Enable, 1=Disable." }
          - { name: "PDCLK_DIS_2", bit: 2, access: RW, desc: "Disable clocks to logic power domain PD4. 0=Enable, 1=Disable." }
          - { name: "PDCLK_DIS_1", bit: 1, access: RW, desc: "Disable clocks to logic power domain PD3. 0=Enable, 1=Disable." }
          - { name: "PDCLK_DIS_0", bit: 0, access: RW, desc: "Disable clocks to logic power domain PD2. 0=Enable, 1=Disable." }
      PDCLKDISSET:
        offset: '0x24'
        access: RW
        reset: 'X'
        desc: "Power Domain Clock Disable Set Register"
        fields:
          - { name: "PDCLK_DISSET_3", bit: 3, access: RW, desc: "Set to disable clocks to logic power domain PD5. 0=No effect, 1=Disable clocks." }
          - { name: "PDCLK_DISSET_2", bit: 2, access: RW, desc: "Set to disable clocks to logic power domain PD4. 0=No effect, 1=Disable clocks." }
          - { name: "PDCLK_DISSET_1", bit: 1, access: RW, desc: "Set to disable clocks to logic power domain PD3. 0=No effect, 1=Disable clocks." }
          - { name: "PDCLK_DISSET_0", bit: 0, access: RW, desc: "Set to disable clocks to logic power domain PD2. 0=No effect, 1=Disable clocks." }
      PDCLKDISCLR:
        offset: '0x28'
        access: RW
        reset: 'X'
        desc: "Power Domain Clock Disable Clear Register"
        fields:
          - { name: "PDCLK_DISCLR_3", bit: 3, access: RW, desc: "Clear to enable clocks to logic power domain PD5. 0=No effect, 1=Enable clocks." }
          - { name: "PDCLK_DISCLR_2", bit: 2, access: RW, desc: "Clear to enable clocks to logic power domain PD4. 0=No effect, 1=Enable clocks." }
          - { name: "PDCLK_DISCLR_1", bit: 1, access: RW, desc: "Clear to enable clocks to logic power domain PD3. 0=No effect, 1=Enable clocks." }
          - { name: "PDCLK_DISCLR_0", bit: 0, access: RW, desc: "Clear to enable clocks to logic power domain PD2. 0=No effect, 1=Enable clocks." }
      LOGICPDPWRSTAT0:
        offset: '0x40'
        access: RO
        reset: 'X'
        desc: "Logic Power Domain PD2 Power Status Register"
        fields:
          - { name: "LOGIC_IN_TRANS0", bit: 24, access: RW, desc: "Logic in transition status for power domain PD2. 0=Steady state, 1=In transition." }
          - { name: "MEM_IN_TRANS0", bit: 16, access: RW, desc: "Memory in transition status for power domain PD2. 0=Steady state, 1=In transition." }
          - { name: "DOMAIN_ON0", bit: 8, access: RW, desc: "Current state of power domain PD2. 0=OFF, 1=Active." }
          - { name: "LOGICPDPWR_STAT0", msb: 1, lsb: 0, access: RW, desc: "Logic power domain PD2 power state. 00=OFF, 01=Idle, 11=Active." }
      LOGICPDPWRSTAT1:
        offset: '0x44'
        access: RO
        reset: 'X'
        desc: "Logic Power Domain PD3 Power Status Register"
        fields:
          - { name: "LOGIC_IN_TRANS1", bit: 24, access: RW, desc: "Logic in transition status for power domain PD3. 0=Steady state, 1=In transition." }
          - { name: "MEM_IN_TRANS1", bit: 16, access: RW, desc: "Memory in transition status for power domain PD3. 0=Steady state, 1=In transition." }
          - { name: "DOMAIN_ON1", bit: 8, access: RW, desc: "Current state of power domain PD3. 0=OFF, 1=Active." }
          - { name: "LOGICPDPWR_STAT1", msb: 1, lsb: 0, access: RW, desc: "Logic power domain PD3 power state. 00=OFF, 01=Idle, 11=Active." }
      LOGICPDPWRSTAT2:
        offset: '0x48'
        access: RO
        reset: 'X'
        desc: "Logic Power Domain PD4 Power Status Register"
        fields:
          - { name: "LOGIC_IN_TRANS2", bit: 24, access: RW, desc: "Logic in transition status for power domain PD4. 0=Steady state, 1=In transition." }
          - { name: "MEM_IN_TRANS2", bit: 16, access: RW, desc: "Memory in transition status for power domain PD4. 0=Steady state, 1=In transition." }
          - { name: "DOMAIN_ON2", bit: 8, access: RW, desc: "Current state of power domain PD4. 0=OFF, 1=Active." }
          - { name: "LOGICPDPWR_STAT2", msb: 1, lsb: 0, access: RW, desc: "Logic power domain PD4 power state. 00=OFF, 01=Idle, 11=Active." }
      LOGICPDPWRSTAT3:
        offset: '0x4C'
        access: RO
        reset: 'X'
        desc: "Logic Power Domain PD5 Power Status Register"
        fields:
          - { name: "LOGIC_IN_TRANS3", bit: 24, access: RW, desc: "Logic in transition status for power domain PD5. 0=Steady state, 1=In transition." }
          - { name: "MEM_IN_TRANS3", bit: 16, access: RW, desc: "Memory in transition status for power domain PD5. 0=Steady state, 1=In transition." }
          - { name: "DOMAIN_ON3", bit: 8, access: RW, desc: "Current state of power domain PD5. 0=OFF, 1=Active." }
          - { name: "LOGICPDPWR_STAT3", msb: 1, lsb: 0, access: RW, desc: "Logic power domain PD5 power state. 00=OFF, 01=Idle, 11=Active." }
      MEMPDPWRSTAT0:
        offset: '0x80'
        access: RO
        reset: 'X'
        desc: "Memory Power Domain RAM_PD1 Power Status Register"
        fields:
          - { name: "LOGIC_IN_TRANS0", bit: 24, access: RW, desc: "Logic in transition status for power domain RAM_PD1. 0=Steady state, 1=In transition." }
          - { name: "MEM_IN_TRANS0", bit: 16, access: RW, desc: "Memory in transition status for power domain RAM_PD1. 0=Steady state, 1=In transition." }
          - { name: "DOMAIN_ON0", bit: 8, access: RW, desc: "Current state of power domain RAM_PD1. 0=OFF, 1=Active." }
          - { name: "MEMPDPWR_STAT0", msb: 1, lsb: 0, access: RW, desc: "Memory power domain RAM_PD1 power state. 00=OFF, 11=Active." }
      MEMPDPWRSTAT1:
        offset: '0x84'
        access: RO
        reset: 'X'
        desc: "Memory Power Domain RAM_PD2 Power Status Register"
        fields:
          - { name: "LOGIC_IN_TRANS1", bit: 24, access: RW, desc: "Logic in transition status for power domain RAM_PD2. 0=Steady state, 1=In transition." }
          - { name: "MEM_IN_TRANS1", bit: 16, access: RW, desc: "Memory in transition status for power domain RAM_PD2. 0=Steady state, 1=In transition." }
          - { name: "DOMAIN_ON1", bit: 8, access: RW, desc: "Current state of power domain RAM_PD2. 0=OFF, 1=Active." }
          - { name: "MEMPDPWR_STAT1", msb: 1, lsb: 0, access: RW, desc: "Memory power domain RAM_PD2 power state. 00=OFF, 11=Active." }
      GLOBALCTRL1:
        offset: '0xA0'
        access: RW
        reset: '0x00000000'
        desc: "Global Control Register 1"
        fields:
          - { name: "PMCTRL_PWRDN", bit: 8, access: RW, desc: "PMC/PSCON Power Down. 0=Enable clock to pmctrl_wakeup block, 1=Disable clock." }
          - { name: "AUTO_CLK_WAKE_ENA", bit: 0, access: RW, desc: "Automatic Clock Enable on Wake Up. 0=Disable automatic clock wake up, 1=Enable." }
      GLOBALSTAT:
        offset: '0xA8'
        access: RO
        reset: '0x00000001'
        desc: "Global Status Register"
        fields:
          - { name: "PMCTRL_IDLE", bit: 0, access: RW, desc: "State of PMC and all PSCONs. 0=In transition, 1=Completed transition." }
      PRCKEYREG:
        offset: '0xAC'
        access: RW
        reset: '0x00000000'
        desc: "PSCON Diagnostic Compare Key Register"
        fields:
          - { name: "MKEY", msb: 3, lsb: 0, access: RW, desc: "Diagnostic PSCON Mode Key. 0=Lock Step, 6=Self-test, 9=Error Forcing, F=Self-test Error Forcing." }
      LPDDCSTAT1:
        offset: '0xB0'
        access: RO
        reset: '0x00000000'
        desc: "LogicPD PSCON Diagnostic Compare Status Register 1"
        fields:
          - { name: "LCMPE_3_0", msb: 19, lsb: 16, access: RW, desc: "Logic Power Domain Compare Error. Bit[3]=PD5, Bit[2]=PD4, Bit[1]=PD3, Bit[0]=PD2. 0=Identical, 1=Mismatch." }
          - { name: "LSTC_3_0", msb: 3, lsb: 0, access: RW, desc: "Logic Power Domain Self-test Complete. Bit[3]=PD5, Bit[2]=PD4, Bit[1]=PD3, Bit[0]=PD2. 0=Ongoing, 1=Complete." }
      LPDDCSTAT2:
        offset: '0xB4'
        access: RO
        reset: '0x00000000'
        desc: "LogicPD PSCON Diagnostic Compare Status Register 2"
        fields:
          - { name: "LSTET_3_0", msb: 19, lsb: 16, access: RW, desc: "Logic Power Domain Self-test Error Type. Bit[3]=PD5, Bit[2]=PD4, Bit[1]=PD3, Bit[0]=PD2. 0=Match test fail, 1=Mismatch test fail." }
          - { name: "LSTE_3_0", msb: 3, lsb: 0, access: RW, desc: "Logic Power Domain Self-test Error. Bit[3]=PD5, Bit[2]=PD4, Bit[1]=PD3, Bit[0]=PD2. 0=Passed, 1=Failed." }
      MPDDCSTAT1:
        offset: '0xB8'
        access: RO
        reset: '0x00000000'
        desc: "Memory PD PSCON Diagnostic Compare Status Register 1"
        fields:
          - { name: "MCMPE_1_0", msb: 17, lsb: 16, access: RW, desc: "Memory Power Domain Compare Error. Bit[1]=RAM_PD2, Bit[0]=RAM_PD1. 0=Identical, 1=Mismatch." }
          - { name: "MSTC_1_0", msb: 1, lsb: 0, access: RW, desc: "Memory Power Domain Self-test Complete. Bit[1]=RAM_PD2, Bit[0]=RAM_PD1. 0=Ongoing, 1=Complete." }
      MPDDCSTAT2:
        offset: '0xBC'
        access: RO
        reset: '0x00000000'
        desc: "Memory PD PSCON Diagnostic Compare Status Register 2"
        fields:
          - { name: "MSTET_1_0", msb: 17, lsb: 16, access: RW, desc: "Memory Power Domain Self-test Error Type. Bit[1]=RAM_PD2, Bit[0]=RAM_PD1. 0=Match test fail, 1=Mismatch test fail." }
          - { name: "MSTE_1_0", msb: 1, lsb: 0, access: RW, desc: "Memory Power Domain Self-test Error. Bit[1]=RAM_PD2, Bit[0]=RAM_PD1. 0=Passed, 1=Failed." }
      ISODIAGSTAT:
        offset: '0xC0'
        access: RO
        reset: '0x00000000'
        desc: "Isolation Diagnostic Status Register"
        fields:
          - { name: "ISO_DIAG_3_0", msb: 3, lsb: 0, access: RW, desc: "Isolation Diagnostic. Bit[3]=PD5, Bit[2]=PD4, Bit[1]=PD3, Bit[0]=PD2. 0=Isolation enabled, 1=Isolation disabled." }

  POM:
    base_address: '0x00000000'
    desc: ''
    registers:
      POMGLBCTRL:
        offset: '0x00'
        access: RW
        reset: '0x60005005'
        desc: "POM Global Control Register"
        fields:
          - { name: "OTADDR", msb: 31, lsb: 23, access: RW, desc: "Overlay target Address. These bits determine the upper address bits of the target overlay address. Writing a different value to this field will steer the POM access to a different location in the 4GB address space. The application must ensure that the overlay memory address points to a valid internal or external memory location." }
          - { name: "ETO", msb: 11, lsb: 8, access: RW, desc: "Enable Timeout. Ah enables timeout for bus transactions. All other values disable timeout. Refer to Section 18.2.2 for more details on the timeout error." }
          - { name: "ON_OFF", msb: 3, lsb: 0, access: RW, desc: "Turn functionality of POM on or off. Ah makes POM functional. All other values hold POM in reset. The key should be written to 5h to avoid single bit flips inadvertently turning on the module." }
      POMREV:
        offset: '0x04'
        access: RW
        reset: '0x4A031008'
        desc: "POM Revision ID"
        fields:
          - { name: "SCHEME", msb: 31, lsb: 30, access: RW, desc: "Used to distinguish between different ID schemes." }
          - { name: "FUNC", msb: 27, lsb: 16, access: RW, desc: "Indicates the SW compatible module family." }
          - { name: "RTL", msb: 15, lsb: 11, access: RW, desc: "RTL version number." }
          - { name: "MAJOR", msb: 10, lsb: 8, access: RW, desc: "Major revision number." }
          - { name: "CUSTOM", msb: 7, lsb: 6, access: RW, desc: "Indicates a device specific implementation." }
          - { name: "MINOR", msb: 5, lsb: 0, access: RW, desc: "Minor revision number." }
      POMCLKCTRL:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "POM Clock Gate Control Register"
        fields:
          - { name: "CLK_GATE_OFF", bit: 0, access: RW, desc: "Do not modify this bit. Leave it in its reset state. Modifying the bit while the POM module is switched on can result in unexpected behavior." }
      POMFLG:
        offset: '0x0C'
        access: RO
        reset: '0x00000000'
        desc: "POM Status Register"
        fields:
          - { name: "TO", bit: 0, access: RWC, desc: "Timeout. This flag signals a timeout condition on the last CPU read access through the POM. This flag is only updated when the POM module is enabled (ON/OFF = Ah). 0 = No timeout occurred, 1 = Timeout occurred. Write 1 to clear." }
      POMPROGSTARTx:
        offset: '0x200, 0x210, ..., 0x3F0'
        access: RW
        reset: '0x00000000'
        desc: "POM Program Region Start Address Register x (x = 0 to 31)"
        fields:
          - { name: "STARTADDRESS", msb: 22, lsb: 0, access: RW, desc: "Defines the start address of the program memory region. The start address has to be a multiple of the region size. If the region start address is programmed to a non-region size boundary, the region will begin at the next lower region size boundary." }
      POMOVLSTARTx:
        offset: '0x204, 0x214, ..., 0x3F4'
        access: RW
        reset: '0x00000000'
        desc: "POM Overlay Region Start Address Register x (x = 0 to 31)"
        fields:
          - { name: "STARTADDRESS", msb: 22, lsb: 0, access: RW, desc: "Defines the start address of the overlay memory region. The start address has to be a multiple of the region size. If the region start address is programmed to a non-region size boundary, the region will begin at the next lower region size boundary." }
      POMREGSIZEx:
        offset: '0x208, 0x218, ..., 0x3F8'
        access: RW
        reset: '0x00000000'
        desc: "POM Region Size Register x (x = 0 to 31)"
        fields:
          - { name: "SIZE", msb: 3, lsb: 0, access: RW, desc: "Region size. 0 = Region is disabled, 1h = 64 Bytes, 2h = 128 Bytes, ... Dh = 256 kBytes, Eh-Fh = Reserved. If the region is enabled by writing a non-zero value to the SIZE bitfield, it will take some number of VCLK cycles until the write takes effect." }
      POMITCTRL:
        offset: '0xF00'
        access: RW
        reset: '0x00000000'
        desc: >-
          POM Integration Control Register - CoreSight register for debug purpose only. The integration functionality is not implemented.
      POMCLAIMSET:
        offset: '0xFA0'
        access: RW
        reset: '0x00000003'
        desc: >-
          POM Claim Set Register - CoreSight register for debug purpose only. Allows different masters to claim control for the POM module.
        fields:
          - { name: "SET1", bit: 1, access: RW, desc: "The module is claimed. Read: 1 = claim tag is implemented. Write: 1 = Set claim tag." }
          - { name: "SET0", bit: 0, access: RW, desc: "The module is claimed. Read: 1 = claim tag is implemented. Write: 1 = Set claim tag." }
      POMCLAIMCLR:
        offset: '0xFA4'
        access: RW
        reset: '0x00000003'
        desc: >-
          POM Claim Clear Register - CoreSight register for debug purpose only. Allows different masters to claim control for the POM module.
        fields:
          - { name: "CLR1", bit: 1, access: RW, desc: "The module is claimed. Read: Current claim tag value. Write: 1 = Clear claim tag." }
          - { name: "CLR0", bit: 0, access: RW, desc: "The module is claimed. Read: Current claim tag value. Write: 1 = Clear claim tag." }
      POMLOCKACCESS:
        offset: '0xFB0'
        access: RW
        reset: '0x00000000'
        desc: "POM Lock Access Register - CoreSight register for debug purpose only."
      POMLOCKSTATUS:
        offset: '0xFB4'
        access: RO
        reset: '0x00000000'
        desc: "POM Lock Status Register - CoreSight register for debug purpose only."
      POMAUTHSTATUS:
        offset: '0xFB8'
        access: RO
        reset: '0x00000000'
        desc: "POM Authentication Status Register - CoreSight register for debug purpose only."
      POMDEVID:
        offset: '0xFC8'
        access: RW
        reset: '0x00000000'
        desc: "POM Device ID Register - CoreSight register for debug purpose only."
      POMDEVTYPE:
        offset: '0xFCC'
        access: RW
        reset: '0x00000004'
        desc: >-
          POM Device Type Register - CoreSight register for debug purpose only. The device type register defines the CoreSight module class.
        fields:
          - { name: "Sub_Type", msb: 7, lsb: 4, access: RW, desc: "Other" }
          - { name: "Major_Type", msb: 3, lsb: 0, access: RW, desc: "Debug Control" }
      POMPERIPHERALID4:
        offset: '0xFD0'
        access: RW
        reset: '0x00000000'
        desc: >-
          POM Peripheral ID 4 Register - CoreSight register showing peripheral identification.
        fields:
          - { name: "KB_Count", msb: 7, lsb: 4, access: RW, desc: "Only 4KB is implemented." }
          - { name: "JEP106_Continuation_Code", msb: 3, lsb: 0, access: RW, desc: "JEP106 Code" }
      POMPERIPHERALID5:
        offset: '0xFD4'
        access: RW
        reset: '0x00000000'
        desc: "POM Peripheral ID 5 Register - CoreSight register for debug purpose only."
      POMPERIPHERALID6:
        offset: '0xFD8'
        access: RW
        reset: '0x00000000'
        desc: "POM Peripheral ID 6 Register - CoreSight register for debug purpose only."
      POMPERIPHERALID7:
        offset: '0xFDC'
        access: RW
        reset: '0x00000000'
        desc: "POM Peripheral ID 7 Register - CoreSight register for debug purpose only."
      POMPERIPHERALID0:
        offset: '0xFE0'
        access: RW
        reset: '0x00000000'
        desc: >-
          POM Peripheral ID 0 Register - CoreSight register showing peripheral identification.
        fields:
          - { name: "Part_Number", msb: 7, lsb: 0, access: RW, desc: "Reads 0, since POMREV defines the module." }
      POMPERIPHERALID1:
        offset: '0xFE4'
        access: RW
        reset: '0x00000070'
        desc: >-
          POM Peripheral ID 1 Register - CoreSight register showing peripheral identification.
        fields:
          - { name: "JEP106_Identity_Code", msb: 7, lsb: 4, access: RW, desc: "Part of TI JEDEC number." }
          - { name: "Part_Number", msb: 3, lsb: 0, access: RW, desc: "Reads 0, since POMREV defines the module." }
      POMPERIPHERALID2:
        offset: '0xFE8'
        access: RW
        reset: '0x00000009'
        desc: >-
          POM Peripheral ID 2 Register - CoreSight register showing peripheral identification.
        fields:
          - { name: "Revision", msb: 7, lsb: 4, access: RW, desc: "Reads 0, since POMREV defines the module." }
          - { name: "JEDEC", bit: 3, access: RW, desc: "Indicates JEDEC assigned value." }
          - { name: "JEP106_Identity_Code", msb: 2, lsb: 0, access: RW, desc: "JEDEC+JEP106 Identity Code (POMPERIPHERALID2)+JEP106 Identity Code (POMPERIPHERALID1) form TI JEDEC ID of 97h." }
      POMPERIPHERALID3:
        offset: '0xFEC'
        access: RW
        reset: '0x00000000'
        desc: "POM Peripheral ID 3 Register - CoreSight register for debug purpose only."
      POMCOMPONENTID0:
        offset: '0xFF0'
        access: RW
        reset: '0x0000000D'
        desc: "POM Component ID 0 Register - CoreSight register for debug purpose only."
        fields:
          - { name: "Preamble", msb: 7, lsb: 0, access: RW, desc: "Preamble" }
      POMCOMPONENTID1:
        offset: '0xFF4'
        access: RW
        reset: '0x00000090'
        desc: "POM Component ID 1 Register - CoreSight register for debug purpose only."
        fields:
          - { name: "Component_Class", msb: 7, lsb: 4, access: RW, desc: "CoreSight Component" }
          - { name: "Preamble", msb: 3, lsb: 0, access: RW, desc: "Preamble" }
      POMCOMPONENTID2:
        offset: '0xFF8'
        access: RW
        reset: '0x00000005'
        desc: "POM Component ID 2 Register - CoreSight register for debug purpose only."
        fields:
          - { name: "Preamble", msb: 7, lsb: 0, access: RW, desc: "Preamble" }
      POMCOMPONENTID3:
        offset: '0xFFC'
        access: RW
        reset: '0x000000B1'
        desc: "POM Component ID 3 Register - CoreSight register for debug purpose only."
        fields:
          - { name: "Preamble", msb: 7, lsb: 0, access: RW, desc: "Preamble" }

  PULSE:
    base_address: '0x00000000'
    desc: ''
    registers:
      QPOSCNT:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: >-
          eQEP Position Counter Register - counts up/down on every eQEP pulse based on direction input
        fields:
          - { name: "QPOSCNT", msb: 31, lsb: 0, access: RW, desc: "Position counter value - acts as position integrator proportional to position from reference point" }
      QPOSINIT:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "eQEP Initialization Position Count - value used to initialize position counter"
        fields:
          - { name: "QPOSINIT", msb: 31, lsb: 0, access: RW, desc: "Position initialization value used on external strobe or index event" }
      QPOSMAX:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "eQEP Maximum Position Count Register"
        fields:
          - { name: "QPOSMAX", msb: 31, lsb: 0, access: RW, desc: "Maximum position counter value" }
      QPOSCMP:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: >-
          eQEP Position-compare Register - compared with position counter to generate sync output
        fields:
          - { name: "QPOSCMP", msb: 31, lsb: 0, access: RW, desc: "Position-compare value compared with QPOSCNT to generate sync output and/or interrupt" }
      QPOSILAT:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "eQEP Index Position Latch Register"
        fields:
          - { name: "QPOSILAT", msb: 31, lsb: 0, access: RW, desc: "Position counter value latched on index event as defined by QEPCTL[IEL]" }
      QPOSSLAT:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "eQEP Strobe Position Latch Register"
        fields:
          - { name: "QPOSSLAT", msb: 31, lsb: 0, access: RW, desc: "Position counter value latched on strobe event as defined by QEPCTL[SEL]" }
      QPOSLAT:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "eQEP Position Counter Latch Register"
        fields:
          - { name: "QPOSLAT", msb: 31, lsb: 0, access: RW, desc: "Position counter value latched on unit time out event" }
      QUTMR:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "eQEP Unit Timer Register - time base for unit time event generation"
        fields:
          - { name: "QUTMR", msb: 31, lsb: 0, access: RW, desc: "Unit timer value - generates unit time event when matches QUPRD" }
      QUPRD:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "eQEP Unit Period Register - period count for unit timer"
        fields:
          - { name: "QUPRD", msb: 31, lsb: 0, access: RW, desc: "Unit timer period count - generates periodic unit time events for position latching" }
      QWDTMR:
        offset: '0x24'
        access: RW
        reset: '0x0000'
        desc: "eQEP Watchdog Timer Register - time base for watchdog to detect motor stalls"
        fields:
          - { name: "QWDTMR", msb: 15, lsb: 0, access: RW, desc: "Watchdog timer value - reset on quadrature edge, generates timeout interrupt on match with QWDPRD" }
      QWDPRD:
        offset: '0x26'
        access: RW
        reset: '0x0000'
        desc: "eQEP Watchdog Period Register"
        fields:
          - { name: "QWDPRD", msb: 15, lsb: 0, access: RW, desc: "Watchdog timeout count - generates watchdog timeout interrupt when QWDTMR matches" }
      QDECCTL:
        offset: '0x28'
        access: RW
        reset: '0x0000'
        desc: "eQEP Decoder Control Register"
        fields:
          - { name: "QSRC", msb: 15, lsb: 14, access: RW, desc: "Position-counter source selection - 0=Quadrature count, 1=Direction-count, 2=UP count, 3=DOWN count" }
          - { name: "SOEN", bit: 13, access: RW, desc: "Sync output enable - 0=Disable, 1=Enable position-compare sync output" }
          - { name: "SPSEL", bit: 12, access: RW, desc: "Sync output pin selection - 0=Index pin, 1=Strobe pin" }
          - { name: "XCR", bit: 11, access: RW, desc: "External clock rate - 0=2x resolution, 1=1x resolution" }
          - { name: "SWAP", bit: 10, access: RW, desc: "Swap quadrature clock inputs - reverses counting direction" }
          - { name: "IGATE", bit: 9, access: RW, desc: "Index pulse gating option - 0=Disable, 1=Gate index with strobe" }
          - { name: "QAP", bit: 8, access: RW, desc: "QEPA input polarity - 0=No effect, 1=Negate QEPA" }
          - { name: "QBP", bit: 7, access: RW, desc: "QEPB input polarity - 0=No effect, 1=Negate QEPB" }
          - { name: "QIP", bit: 6, access: RW, desc: "QEPI input polarity - 0=No effect, 1=Negate QEPI" }
          - { name: "QSP", bit: 5, access: RW, desc: "QEPS input polarity - 0=No effect, 1=Negate QEPS" }
      QEPCTL:
        offset: '0x2A'
        access: RW
        reset: '0x0000'
        desc: "eQEP Control Register"
        fields:
          - { name: "FREE_SOFT", msb: 15, lsb: 14, access: RW, desc: "Emulation control bits - behavior on emulation suspend" }
          - { name: "PCRM", msb: 13, lsb: 12, access: RW, desc: "Position counter reset mode - 0=Reset on index, 1=Reset on max, 2=Reset on first index, 3=Reset on unit time" }
          - { name: "SEI", msb: 11, lsb: 10, access: RW, desc: "Strobe event initialization of position counter" }
          - { name: "IEI", msb: 9, lsb: 8, access: RW, desc: "Index event initialization of position counter" }
          - { name: "SWI", bit: 7, access: RW, desc: "Software initialization of position counter" }
          - { name: "SEL", bit: 6, access: RW, desc: "Strobe event latch of position counter" }
          - { name: "IEL", msb: 5, lsb: 4, access: RW, desc: "Index event latch of position counter - 1=Rising edge, 2=Falling edge, 3=Software index marker" }
          - { name: "QPEN", bit: 3, access: RW, desc: "Quadrature position counter enable/software reset" }
          - { name: "QCLM", bit: 2, access: RW, desc: "eQEP capture latch mode - 0=Latch on CPU read, 1=Latch on unit timeout" }
          - { name: "UTE", bit: 1, access: RW, desc: "eQEP unit timer enable" }
          - { name: "WDE", bit: 0, access: RW, desc: "eQEP watchdog enable" }
      QCAPCTL:
        offset: '0x2C'
        access: RW
        reset: '0x0000'
        desc: "eQEP Capture Control Register"
        fields:
          - { name: "CEN", bit: 15, access: RW, desc: "eQEP capture enable - 0=Disabled, 1=Enabled" }
          - { name: "CCPS", msb: 6, lsb: 4, access: RW, desc: "eQEP capture timer clock prescaler - CAPCLK = VCLK4/[1,2,4,8,16,32,64,128]" }
          - { name: "UPPS", msb: 3, lsb: 0, access: RW, desc: "Unit position event prescaler - UPEVNT = QCLK/[1,2,4,8,16,32,64,128,256,512,1024,2048]" }
      QPOSCTL:
        offset: '0x2E'
        access: RW
        reset: '0x0000'
        desc: "eQEP Position-compare Control Register"
        fields:
          - { name: "PCSHDW", bit: 15, access: RW, desc: "Position-compare shadow enable - 0=Shadow disabled, 1=Shadow enabled" }
          - { name: "PCLOAD", bit: 14, access: RW, desc: "Position-compare shadow load mode - 0=Load on QPOSCNT=0, 1=Load on QPOSCNT=QPOSCMP" }
          - { name: "PCPOL", bit: 13, access: RW, desc: "Polarity of sync output - 0=Active HIGH, 1=Active LOW" }
          - { name: "PCE", bit: 12, access: RW, desc: "Position-compare enable - 0=Disable, 1=Enable" }
          - { name: "PCSPW", msb: 11, lsb: 0, access: RW, desc: "Select position-compare sync output pulse width - 0 to FFFh, value x 4 x VCLK4 cycles" }
      QEINT:
        offset: '0x30'
        access: RW
        reset: '0x0000'
        desc: "eQEP Interrupt Enable Register"
        fields:
          - { name: "UTO", bit: 11, access: RW, desc: "Unit time out interrupt enable" }
          - { name: "IEL", bit: 10, access: RW, desc: "Index event latch interrupt enable" }
          - { name: "SEL", bit: 9, access: RW, desc: "Strobe event latch interrupt enable" }
          - { name: "PCM", bit: 8, access: RW, desc: "Position-compare match interrupt enable" }
          - { name: "PCR", bit: 7, access: RW, desc: "Position-compare ready interrupt enable" }
          - { name: "PCO", bit: 6, access: RW, desc: "Position counter overflow interrupt enable" }
          - { name: "PCU", bit: 5, access: RW, desc: "Position counter underflow interrupt enable" }
          - { name: "WTO", bit: 4, access: RW, desc: "Watchdog time out interrupt enable" }
          - { name: "QDC", bit: 3, access: RW, desc: "Quadrature direction change interrupt enable" }
          - { name: "QPE", bit: 2, access: RW, desc: "Quadrature phase error interrupt enable" }
          - { name: "PCE", bit: 1, access: RW, desc: "Position counter error interrupt enable" }
      QFLG:
        offset: '0x32'
        access: RW
        reset: '0x0000'
        desc: "eQEP Interrupt Flag Register"
        fields:
          - { name: "UTO", bit: 11, access: RW, desc: "Unit time out interrupt flag" }
          - { name: "IEL", bit: 10, access: RW, desc: "Index event latch interrupt flag" }
          - { name: "SEL", bit: 9, access: RW, desc: "Strobe event latch interrupt flag" }
          - { name: "PCM", bit: 8, access: RW, desc: "eQEP compare match event interrupt flag" }
          - { name: "PCR", bit: 7, access: RW, desc: "Position-compare ready interrupt flag" }
          - { name: "PCO", bit: 6, access: RW, desc: "Position counter overflow interrupt flag" }
          - { name: "PCU", bit: 5, access: RW, desc: "Position counter underflow interrupt flag" }
          - { name: "WTO", bit: 4, access: RW, desc: "Watchdog timeout interrupt flag" }
          - { name: "QDC", bit: 3, access: RW, desc: "Quadrature direction change interrupt flag" }
          - { name: "PHE", bit: 2, access: RW, desc: "Quadrature phase error interrupt flag" }
          - { name: "PCE", bit: 1, access: RW, desc: "Position counter error interrupt flag" }
          - { name: "INT", bit: 0, access: RW, desc: "Global interrupt status flag" }
      QCLR:
        offset: '0x34'
        access: RW
        reset: '0x0000'
        desc: "eQEP Interrupt Clear Register"
        fields:
          - { name: "UTO", bit: 11, access: RW, desc: "Clear unit time out interrupt flag" }
          - { name: "IEL", bit: 10, access: RW, desc: "Clear index event latch interrupt flag" }
          - { name: "SEL", bit: 9, access: RW, desc: "Clear strobe event latch interrupt flag" }
          - { name: "PCM", bit: 8, access: RW, desc: "Clear eQEP compare match event interrupt flag" }
          - { name: "PCR", bit: 7, access: RW, desc: "Clear position-compare ready interrupt flag" }
          - { name: "PCO", bit: 6, access: RW, desc: "Clear position counter overflow interrupt flag" }
          - { name: "PCU", bit: 5, access: RW, desc: "Clear position counter underflow interrupt flag" }
          - { name: "WTO", bit: 4, access: RW, desc: "Clear watchdog timeout interrupt flag" }
          - { name: "QDC", bit: 3, access: RW, desc: "Clear quadrature direction change interrupt flag" }
          - { name: "PHE", bit: 2, access: RW, desc: "Clear quadrature phase error interrupt flag" }
          - { name: "PCE", bit: 1, access: RW, desc: "Clear position counter error interrupt flag" }
          - { name: "INT", bit: 0, access: RW, desc: "Global interrupt clear flag - enables further interrupts" }
      QFRC:
        offset: '0x36'
        access: RW
        reset: '0x0000'
        desc: "eQEP Interrupt Force Register"
        fields:
          - { name: "UTO", bit: 11, access: RW, desc: "Force unit time out interrupt" }
          - { name: "IEL", bit: 10, access: RW, desc: "Force index event latch interrupt" }
          - { name: "SEL", bit: 9, access: RW, desc: "Force strobe event latch interrupt" }
          - { name: "PCM", bit: 8, access: RW, desc: "Force position-compare match interrupt" }
          - { name: "PCR", bit: 7, access: RW, desc: "Force position-compare ready interrupt" }
          - { name: "PCO", bit: 6, access: RW, desc: "Force position counter overflow interrupt" }
          - { name: "PCU", bit: 5, access: RW, desc: "Force position counter underflow interrupt" }
          - { name: "WTO", bit: 4, access: RW, desc: "Force watchdog time out interrupt" }
          - { name: "QDC", bit: 3, access: RW, desc: "Force quadrature direction change interrupt" }
          - { name: "PHE", bit: 2, access: RW, desc: "Force quadrature phase error interrupt" }
          - { name: "PCE", bit: 1, access: RW, desc: "Force position counter error interrupt" }
      QEPSTS:
        offset: '0x38'
        access: RO
        reset: '0x008E'
        desc: "eQEP Status Register"
        fields:
          - { name: "UPEVNT", bit: 7, access: RW, desc: "Unit position event flag - cleared by writing 1" }
          - { name: "FIDF", bit: 6, access: RW, desc: "Direction on first index marker - 0=CCW, 1=CW" }
          - { name: "QDF", bit: 5, access: RW, desc: "Quadrature direction flag - 0=CCW, 1=CW" }
          - { name: "QDLF", bit: 4, access: RW, desc: "eQEP direction latch flag - latched on index event" }
          - { name: "COEF", bit: 3, access: RW, desc: "Capture overflow error flag - sticky bit" }
          - { name: "CDEF", bit: 2, access: RW, desc: "Capture direction error flag - sticky bit" }
          - { name: "FIMF", bit: 1, access: RW, desc: "First index marker flag - sticky bit" }
          - { name: "PCEF", bit: 0, access: RW, desc: "Position counter error flag - updated on every index event" }
      QCTMR:
        offset: '0x3A'
        access: RW
        reset: '0x0000'
        desc: "eQEP Capture Timer Register"
        fields:
          - { name: "QCTMR", msb: 15, lsb: 0, access: RW, desc: "Capture timer - provides time base for edge capture unit" }
      QCPRD:
        offset: '0x3C'
        access: RW
        reset: '0x0000'
        desc: "eQEP Capture Period Register"
        fields:
          - { name: "QCPRD", msb: 15, lsb: 0, access: RW, desc: "Capture period - holds period count between successive eQEP position events" }
      QCTMRLAT:
        offset: '0x3E'
        access: RW
        reset: '0x0000'
        desc: "eQEP Capture Timer Latch Register"
        fields:
          - { name: "QCTMRLAT", msb: 15, lsb: 0, access: RW, desc: "Capture timer latch - latched on unit timeout or CPU read of QPOSCNT" }
      QCPRDLAT:
        offset: '0x40'
        access: RW
        reset: '0x0000'
        desc: "eQEP Capture Period Latch Register"
        fields:
          - { name: "QCPRDLAT", msb: 15, lsb: 0, access: RW, desc: "Capture period latch - latched on unit timeout or CPU read of QPOSCNT" }

  RAM:
    base_address: '0x00000000'
    desc: ''
    registers:
      RAMCTRL:
        offset: '0x00'
        access: RW
        reset: '0x0005000A'
        desc: "TCRAM Module Control Register"
        fields:
          - { name: "ADDR_PARITY_OVERRIDE", msb: 27, lsb: 24, access: RW, desc: "Address Parity Override. When set to Dh, inverts the parity scheme selected by device global parity selection" }
          - { name: "ADDR_PARITY_DISABLE", msb: 19, lsb: 16, access: RW, desc: "Address Parity Detect Disable. When set to Ah, disables parity checking for address bus" }
          - { name: "ECC_WR_EN", bit: 8, access: RW, desc: "ECC Memory Write Enable. Prevents accidental writes to ECC memory" }
          - { name: "ECC_DETECT_EN", msb: 3, lsb: 0, access: RW, desc: "ECC Detect Enable. 4-bit key to enable ECC detection feature. Any value other than 5h enables detection" }
      RAMTHRESHOLD:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "TCRAM Module Single-Bit Error Correction Threshold Register"
        fields:
          - { name: "THRESHOLD", msb: 15, lsb: 0, access: RW, desc: "Single-bit Error Threshold Count. Contains threshold value for SEC occurrences before interrupt" }
      RAMOCCUR:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "TCRAM Module Single-Bit Error Occurrences Control Register"
        fields:
          - { name: "SINGLE_ERROR_OCCURRENCES", msb: 15, lsb: 0, access: RW, desc: "Single-bit Error Correction Occurrences. 16-bit counter of single-bit error occurrences" }
      RAMINTCTRL:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "TCRAM Module Interrupt Control Register"
        fields:
          - { name: "SERR_EN", bit: 0, access: RW, desc: "Single-bit Error Correction Interrupt Enable. Enables interrupt when RAMOCCUR reaches RAMTHRESHOLD" }
      RAMERRSTATUS:
        offset: '0x10'
        access: RO
        reset: '0x00000000'
        desc: "TCRAM Module Error Status Register"
        fields:
          - { name: "WADDR_PAR_FAIL", bit: 9, access: RW, desc: "Write Address Parity Failure. Must be cleared by writing 1" }
          - { name: "RADDR_PAR_FAIL", bit: 8, access: RW, desc: "Read Address Parity Failure. Must be cleared by writing 1" }
          - { name: "DERR", bit: 5, access: RW, desc: "Multi-bit error detected by Cortex-R4F SECDED logic" }
          - { name: "ADDR_COMP_LOGIC_FAIL", bit: 4, access: RW, desc: "Address decode logic element failed during testing" }
          - { name: "ADDR_DEC_FAIL", bit: 2, access: RW, desc: "Address decode failed. Indicates address error interrupt from redundant decode logic" }
          - { name: "SERR", bit: 0, access: RW, desc: "Single Error Status. Indicates single-bit error threshold reached" }
      RAMSERRADDR:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "TCRAM Module Single-Bit Error Address Register"
        fields:
          - { name: "SINGLE_ERROR_ADDRESS", msb: 17, lsb: 3, access: RW, desc: "Address where single-bit error detected (64-bit aligned, offset from TCRAM base)" }
      RAMUERRADDR:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "TCRAM Module Uncorrectable Error Address Register"
        fields:
          - { name: "UNCORRECTABLE_ERROR_ADDRESS", msb: 22, lsb: 3, access: RW, desc: "Address where uncorrectable error detected (64-bit aligned, offset from TCRAM base)" }
      RAMTEST:
        offset: '0x30'
        access: RW
        reset: '0x00000005'
        desc: "TCRAM Module Test Mode Control Register"
        fields:
          - { name: "TRIGGER", bit: 8, access: RW, desc: "Test Trigger. Auto-reset trigger to test redundant address decode and compare logic" }
          - { name: "TEST_MODE", msb: 7, lsb: 6, access: RW, desc: "Test Mode. Selects equality (2h) or inequality (1h) testing schemes" }
          - { name: "TEST_ENABLE", msb: 3, lsb: 0, access: RW, desc: "Test Enable. 4-bit key (Ah) to enable redundant address decode test scheme" }
      RAMADDRDECVECT:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "TCRAM Module Test Mode Vector Register"
        fields:
          - { name: "ECC_SELECT", bit: 26, access: RW, desc: "ECC Select value for redundant address decode test stimulus" }
          - { name: "RAM_CHIP_SELECT", msb: 15, lsb: 0, access: RW, desc: "RAM Chip Select value for redundant address decode test stimulus" }
      RAMPERRADDR:
        offset: '0x3C'
        access: RW
        reset: '0xXXXXXXXX'
        desc: "TCRAM Module Parity Error Address Register"
        fields:
          - { name: "ADDRESS_PARITY_ERROR_ADDRESS", msb: 22, lsb: 3, access: RW, desc: "Address where parity error detected (64-bit aligned, offset from TCRAM base)" }
      INIT_DOMAIN:
        offset: '0x40'
        access: RW
        reset: '0x000000FF'
        desc: "Auto-Memory Initialization Enable Register"
        fields:
          - { name: "AUTO_MEM_INIT_ENABLE", msb: 7, lsb: 0, access: RW, desc: "Enable auto-memory initialization per power domain. Each bit represents one domain (0-7)" }

  RTI:
    base_address: '0xFFFFFC00'
    desc: ''
    registers:
      RTIGCTRL:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Global Control Register - starts/stops counters and selects signal compared with timebase control circuit
        fields:
          - { name: "NTUSEL", msb: 19, lsb: 16, access: RW, desc: "Select NTU signal - determines which NTU input signal is used as external timebase" }
          - { name: "COS", bit: 15, access: RW, desc: "Continue on suspend - determines if counters stop in halting debug mode" }
          - { name: "CNT1EN", bit: 1, access: RW, desc: "Counter 1 enable - starts and stops counter block 1 (RTIUC1 and RTIFRC1)" }
          - { name: "CNT0EN", bit: 0, access: RW, desc: "Counter 0 enable - starts and stops counter block 0 (RTIUC0 and RTIFRC0)" }
      RTITBCTRL:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Timebase Control Register - selects if free running counter 0 is incremented by RTICLK or NTU
        fields:
          - { name: "INC", bit: 1, access: RW, desc: "Increment free running counter 0 - determines whether RTIFRC0 is automatically incremented if a failing clock on NTU signal is detected" }
          - { name: "TBEXT", bit: 0, access: RW, desc: "Timebase external - selects whether RTIFRC0 is clocked by internal RTIUC0 or from external signal NTU" }
      RTICAPCTRL:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "RTI Capture Control Register - controls the capture source for the counters"
        fields:
          - { name: "CAPCNTR1", bit: 1, access: RW, desc: "Capture counter 1 - determines which external interrupt source triggers a capture event of RTIUC1 and RTIFRC1" }
          - { name: "CAPCNTR0", bit: 0, access: RW, desc: "Capture counter 0 - determines which external interrupt source triggers a capture event of RTIUC0 and RTIFRC0" }
      RTICOMPCTRL:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "RTI Compare Control Register - controls the source for the compare registers"
        fields:
          - { name: "COMPSEL3", bit: 12, access: RW, desc: "Compare select 3 - determines the counter with which the compare value held in RTICOMP3 is compared" }
          - { name: "COMPSEL2", bit: 8, access: RW, desc: "Compare select 2 - determines the counter with which the compare value held in RTICOMP2 is compared" }
          - { name: "COMPSEL1", bit: 4, access: RW, desc: "Compare select 1 - determines the counter with which the compare value held in RTICOMP1 is compared" }
          - { name: "COMPSEL0", bit: 0, access: RW, desc: "Compare select 0 - determines the counter with which the compare value held in RTICOMP0 is compared" }
      RTIFRC0:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Free Running Counter 0 Register - holds the current value of free running counter 0
        fields:
          - { name: "FRC0", msb: 31, lsb: 0, access: RW, desc: "Free running counter 0 - current value of the free running counter 0" }
      RTIUC0:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "RTI Up Counter 0 Register - holds the current value of prescale counter"
        fields:
          - { name: "UC0", msb: 31, lsb: 0, access: RW, desc: "Up counter 0 - current value of the up counter 0 and prescales the RTI clock" }
      RTICPUC0:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Compare Up Counter 0 Register - holds the value to be compared with prescale counter 0
        fields:
          - { name: "CPUC0", msb: 31, lsb: 0, access: RW, desc: "Compare up counter 0 - value compared with up counter 0 to increment RTIFRC0" }
      RTICAFRC0:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Capture Free Running Counter 0 Register - holds free running counter 0 on external events
        fields:
          - { name: "CAFRC0", msb: 31, lsb: 0, access: RW, desc: "Capture free running counter 0 - captures current value of RTIFRC0 when capture event occurs" }
      RTICAUC0:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Capture Up Counter 0 Register - holds current value of prescale counter 0 on external events
        fields:
          - { name: "CAUC0", msb: 31, lsb: 0, access: RW, desc: "Capture up counter 0 - captures current value of RTIUC0 when capture event occurs" }
      RTIFRC1:
        offset: '0x30'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Free Running Counter 1 Register - holds the current value of free running counter 1
        fields:
          - { name: "FRC1", msb: 31, lsb: 0, access: RW, desc: "Free running counter 1 - current value of the free running counter 1" }
      RTIUC1:
        offset: '0x34'
        access: RW
        reset: '0x00000000'
        desc: "RTI Up Counter 1 Register - holds the current value of prescale counter 1"
        fields:
          - { name: "UC1", msb: 31, lsb: 0, access: RW, desc: "Up counter 1 - current value of the up counter 1 and prescales the RTI clock" }
      RTICPUC1:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Compare Up Counter 1 Register - holds the value compared with prescale counter 1
        fields:
          - { name: "CPUC1", msb: 31, lsb: 0, access: RW, desc: "Compare up counter 1 - value compared with up counter 1 to increment RTIFRC1" }
      RTICAFRC1:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Capture Free Running Counter 1 Register - holds current value of free running counter 1 on external events
        fields:
          - { name: "CAFRC1", msb: 31, lsb: 0, access: RW, desc: "Capture free running counter 1 - captures current value of RTIFRC1 when capture event occurs" }
      RTICAUC1:
        offset: '0x44'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Capture Up Counter 1 Register - holds current value of prescale counter 1 on external events
        fields:
          - { name: "CAUC1", msb: 31, lsb: 0, access: RW, desc: "Capture up counter 1 - captures current value of RTIUC1 when capture event occurs" }
      RTICOMP0:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "RTI Compare 0 Register - holds the value to be compared with the counters"
        fields:
          - { name: "COMP0", msb: 31, lsb: 0, access: RW, desc: "Compare 0 - value compared with selected counter to generate interrupt or DMA request" }
      RTIUDCP0:
        offset: '0x54'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Update Compare 0 Register - holds the value to be added to compare register 0 value on a compare match
        fields:
          - { name: "UDCP0", msb: 31, lsb: 0, access: RW, desc: "Update compare 0 - value added to RTICOMP0 each time a compare matches for periodic interrupts" }
      RTICOMP1:
        offset: '0x58'
        access: RW
        reset: '0x00000000'
        desc: "RTI Compare 1 Register - holds the value to be compared to the counters"
        fields:
          - { name: "COMP1", msb: 31, lsb: 0, access: RW, desc: "Compare 1 - value compared with selected counter to generate interrupt or DMA request" }
      RTIUDCP1:
        offset: '0x5C'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Update Compare 1 Register - holds the value to be added to compare register 1 value on a compare match
        fields:
          - { name: "UDCP1", msb: 31, lsb: 0, access: RW, desc: "Update compare 1 - value added to RTICOMP1 each time a compare matches for periodic interrupts" }
      RTICOMP2:
        offset: '0x60'
        access: RW
        reset: '0x00000000'
        desc: "RTI Compare 2 Register - holds the value to be compared to the counters"
        fields:
          - { name: "COMP2", msb: 31, lsb: 0, access: RW, desc: "Compare 2 - value compared with selected counter to generate interrupt or DMA request" }
      RTIUDCP2:
        offset: '0x64'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Update Compare 2 Register - holds the value to be added to compare register 2 value on a compare match
        fields:
          - { name: "UDCP2", msb: 31, lsb: 0, access: RW, desc: "Update compare 2 - value added to RTICOMP2 each time a compare matches for periodic interrupts" }
      RTICOMP3:
        offset: '0x68'
        access: RW
        reset: '0x00000000'
        desc: "RTI Compare 3 Register - holds the value to be compared to the counters"
        fields:
          - { name: "COMP3", msb: 31, lsb: 0, access: RW, desc: "Compare 3 - value compared with selected counter to generate interrupt or DMA request" }
      RTIUDCP3:
        offset: '0x6C'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Update Compare 3 Register - holds the value to be added to compare register 3 value on a compare match
        fields:
          - { name: "UDCP3", msb: 31, lsb: 0, access: RW, desc: "Update compare 3 - value added to RTICOMP3 each time a compare matches for periodic interrupts" }
      RTITBLCOMP:
        offset: '0x70'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Timebase Low Compare Register - holds the value to activate the edge detection circuit
        fields:
          - { name: "TBLCOMP", msb: 31, lsb: 0, access: RW, desc: "Timebase low compare value - determines when edge detection circuit starts monitoring NTU signal" }
      RTITBHCOMP:
        offset: '0x74'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Timebase High Compare Register - holds the value to deactivate the edge detection circuit
        fields:
          - { name: "TBHCOMP", msb: 31, lsb: 0, access: RW, desc: "Timebase high compare value - determines when edge detection circuit stops monitoring NTU signal" }
      RTISETINTENA:
        offset: '0x80'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Set Interrupt Enable Register - sets interrupt enable bits without read-modify-write
        fields:
          - { name: "SETOVL1INT", bit: 18, access: RW, desc: "Set free running counter 1 overflow interrupt enable" }
          - { name: "SETOVL0INT", bit: 17, access: RW, desc: "Set free running counter 0 overflow interrupt enable" }
          - { name: "SETTBINT", bit: 16, access: RW, desc: "Set timebase interrupt enable" }
          - { name: "SETDMA3", bit: 11, access: RW, desc: "Set compare DMA request 3 enable" }
          - { name: "SETDMA2", bit: 10, access: RW, desc: "Set compare DMA request 2 enable" }
          - { name: "SETDMA1", bit: 9, access: RW, desc: "Set compare DMA request 1 enable" }
          - { name: "SETDMA0", bit: 8, access: RW, desc: "Set compare DMA request 0 enable" }
          - { name: "SETINT3", bit: 3, access: RW, desc: "Set compare interrupt 3 enable" }
          - { name: "SETINT2", bit: 2, access: RW, desc: "Set compare interrupt 2 enable" }
          - { name: "SETINT1", bit: 1, access: RW, desc: "Set compare interrupt 1 enable" }
          - { name: "SETINT0", bit: 0, access: RW, desc: "Set compare interrupt 0 enable" }
      RTICLEARINTENA:
        offset: '0x84'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Clear Interrupt Enable Register - clears interrupt enable bits without read-modify-write
        fields:
          - { name: "CLEAROVL1INT", bit: 18, access: RW, desc: "Clear free running counter 1 overflow interrupt enable" }
          - { name: "CLEAROVL0INT", bit: 17, access: RW, desc: "Clear free running counter 0 overflow interrupt enable" }
          - { name: "CLEARTBINT", bit: 16, access: RW, desc: "Clear timebase interrupt enable" }
          - { name: "CLEARDMA3", bit: 11, access: RW, desc: "Clear compare DMA request 3 enable" }
          - { name: "CLEARDMA2", bit: 10, access: RW, desc: "Clear compare DMA request 2 enable" }
          - { name: "CLEARDMA1", bit: 9, access: RW, desc: "Clear compare DMA request 1 enable" }
          - { name: "CLEARDMA0", bit: 8, access: RW, desc: "Clear compare DMA request 0 enable" }
          - { name: "CLEARINT3", bit: 3, access: RW, desc: "Clear compare interrupt 3 enable" }
          - { name: "CLEARINT2", bit: 2, access: RW, desc: "Clear compare interrupt 2 enable" }
          - { name: "CLEARINT1", bit: 1, access: RW, desc: "Clear compare interrupt 1 enable" }
          - { name: "CLEARINT0", bit: 0, access: RW, desc: "Clear compare interrupt 0 enable" }
      RTIINTFLAG:
        offset: '0x88'
        access: RW
        reset: '0x00000000'
        desc: "RTI Interrupt Flag Register - shows pending interrupts from compare matches"
        fields:
          - { name: "OVL1INT", bit: 18, access: RW, desc: "Free running counter 1 overflow interrupt flag" }
          - { name: "OVL0INT", bit: 17, access: RW, desc: "Free running counter 0 overflow interrupt flag" }
          - { name: "TBINT", bit: 16, access: RW, desc: "Timebase interrupt flag - set when TBEXT bit cleared by missing external clock edge" }
          - { name: "INT3", bit: 3, access: RW, desc: "Interrupt flag 3 - indicates interrupt pending due to Compare 3 match" }
          - { name: "INT2", bit: 2, access: RW, desc: "Interrupt flag 2 - indicates interrupt pending due to Compare 2 match" }
          - { name: "INT1", bit: 1, access: RW, desc: "Interrupt flag 1 - indicates interrupt pending due to Compare 1 match" }
          - { name: "INT0", bit: 0, access: RW, desc: "Interrupt flag 0 - indicates interrupt pending due to Compare 0 match" }
      RTIDWDCTRL:
        offset: '0x90'
        access: RW
        reset: '0x5312ACED'
        desc: "Digital Watchdog Control Register - enables or disables the digital watchdog"
        fields:
          - { name: "DWDCTRL", msb: 31, lsb: 0, access: RW, desc: "Digital Watchdog Control - write 0xA98559DA to enable, cannot be disabled except by reset" }
      RTIDWDPRLD:
        offset: '0x94'
        access: RW
        reset: '0x00000FFF'
        desc: "Digital Watchdog Preload Register - sets the expiration time of the DWD"
        fields:
          - { name: "DWDPRLD", msb: 11, lsb: 0, access: RW, desc: "Digital Watchdog Preload Value - configurable only when DWD is disabled" }
      RTIWDSTATUS:
        offset: '0x98'
        access: RO
        reset: '0x00000000'
        desc: "Watchdog Status Register - records the status of the DWD"
        fields:
          - { name: "DWWD_ST", bit: 5, access: RW, desc: "Windowed Watchdog Status - indicates time-window violation" }
          - { name: "END_TIME_VIOL", bit: 4, access: RW, desc: "Windowed Watchdog End Time Violation Status - indicates counter expiration" }
          - { name: "START_TIME_VIOL", bit: 3, access: RW, desc: "Windowed Watchdog Start Time Violation Status - indicates key written before window opened" }
          - { name: "KEY_ST", bit: 2, access: RW, desc: "Watchdog key status - indicates reset/NMI from wrong key or key sequence" }
          - { name: "DWD_ST", bit: 1, access: RW, desc: "DWD status - equivalent to END_TIME_VIOL" }
      RTIWDKEY:
        offset: '0x9C'
        access: RW
        reset: '0x0000A35C'
        desc: >-
          RTI Watchdog Key Register - must be written with correct key sequence to service watchdog
        fields:
          - { name: "WDKEY", msb: 15, lsb: 0, access: RW, desc: "Watchdog key - write 0xE51A followed by 0xA35C to service watchdog" }
      RTIDWDCNTR:
        offset: '0xA0'
        access: RW
        reset: '0x01FFFFFF'
        desc: >-
          RTI Digital Watchdog Down Counter - provides current value of the DWD down counter
        fields:
          - { name: "DWDCNTR", msb: 24, lsb: 0, access: RW, desc: "DWD down counter - current counter value" }
      RTIWWDRXNCTRL:
        offset: '0xA4'
        access: RW
        reset: '0x00000005'
        desc: >-
          Digital Windowed Watchdog Reaction Control - selects DWWD reaction if serviced outside time window
        fields:
          - { name: "WWDRXN", msb: 3, lsb: 0, access: RW, desc: "DWWD reaction - 0x5 for reset, 0xA for NMI on window violation" }
      RTIWWDSIZECTRL:
        offset: '0xA8'
        access: RW
        reset: '0x00000005'
        desc: "Digital Windowed Watchdog Window Size Control - selects the DWWD window size"
        fields:
          - { name: "WWDSIZE", msb: 31, lsb: 0, access: RW, desc: "DWWD window size - 0x00000005 for 100%, 0x00000050 for 50%, 0x00000500 for 25%, etc." }
      RTIINTCLRENABLE:
        offset: '0xAC'
        access: RW
        reset: '0x05050505'
        desc: >-
          RTI Compare Interrupt Clear Enable Register - enables auto-clear of compare interrupt flags
        fields:
          - { name: "INTCLRENABLE3", msb: 27, lsb: 24, access: RW, desc: "Enables auto-clear functionality on compare 3 interrupt" }
          - { name: "INTCLRENABLE2", msb: 19, lsb: 16, access: RW, desc: "Enables auto-clear functionality on compare 2 interrupt" }
          - { name: "INTCLRENABLE1", msb: 11, lsb: 8, access: RW, desc: "Enables auto-clear functionality on compare 1 interrupt" }
          - { name: "INTCLRENABLE0", msb: 3, lsb: 0, access: RW, desc: "Enables auto-clear functionality on compare 0 interrupt" }
      RTICOMP0CLR:
        offset: '0xB0'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Compare 0 Clear Register - holds value to auto-clear compare 0 interrupt flag
        fields:
          - { name: "CMP0CLR", msb: 31, lsb: 0, access: RW, desc: "Compare 0 clear - when FRC matches this value, compare 0 interrupt flag is cleared" }
      RTICOMP1CLR:
        offset: '0xB4'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Compare 1 Clear Register - holds value to auto-clear compare 1 interrupt flag
        fields:
          - { name: "CMP1CLR", msb: 31, lsb: 0, access: RW, desc: "Compare 1 clear - when FRC matches this value, compare 1 interrupt flag is cleared" }
      RTICOMP2CLR:
        offset: '0xB8'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Compare 2 Clear Register - holds value to auto-clear compare 2 interrupt flag
        fields:
          - { name: "CMP2CLR", msb: 31, lsb: 0, access: RW, desc: "Compare 2 clear - when FRC matches this value, compare 2 interrupt flag is cleared" }
      RTICOMP3CLR:
        offset: '0xBC'
        access: RW
        reset: '0x00000000'
        desc: >-
          RTI Compare 3 Clear Register - holds value to auto-clear compare 3 interrupt flag
        fields:
          - { name: "CMP3CLR", msb: 31, lsb: 0, access: RW, desc: "Compare 3 clear - when FRC matches this value, compare 3 interrupt flag is cleared" }

  SCI:
    base_address: '0xFFF7E400'
    desc: "Serial Communication Interface (SCI) / Local Interconnect Network (LIN) Module"
    registers:
      SCIGCR0:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "SCI Global Control Register 0"
        fields:
          - { name: "RESET", bit: 0, access: RW, desc: "SCI module reset - 0=in reset, 1=out of reset" }
      SCIGCR1:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: >-
          SCI Global Control Register 1 - defines frame format, protocol, and communication mode
        fields:
          - { name: "TXENA", bit: 25, access: RW, desc: "Transmit enable - 0=disable, 1=enable transfer from SCITD to SCITXSHF" }
          - { name: "RXENA", bit: 24, access: RW, desc: "Receive enable - 0=disable, 1=enable transfer from SCIRXSHF to SCIRD" }
          - { name: "CONT", bit: 17, access: RW, desc: "Continue on suspend - 0=halt on debug, 1=continue until complete" }
          - { name: "LOOP_BACK", bit: 16, access: RW, desc: "Loopback mode - 0=disabled, 1=enabled (SCITX internally connected to SCIRX)" }
          - { name: "POWERDOWN", bit: 9, access: RW, desc: "Power down mode - 0=normal, 1=low-power mode enabled" }
          - { name: "SLEEP", bit: 8, access: RW, desc: "SCI sleep mode for multiprocessor - 0=disabled, 1=enabled" }
          - { name: "SWnRST", bit: 7, access: RW, desc: "Software reset (active low) - 0=reset state, 1=ready state" }
          - { name: "CLOCK", bit: 5, access: RW, desc: "SCI internal clock enable - 0=external SCICLK, 1=internal SCICLK" }
          - { name: "STOP", bit: 4, access: RW, desc: "Number of stop bits - 0=one stop bit, 1=two stop bits" }
          - { name: "PARITY", bit: 3, access: RW, desc: "Parity odd/even selection - 0=odd parity, 1=even parity" }
          - { name: "PARITY_ENA", bit: 2, access: RW, desc: "Parity enable - 0=disabled, 1=enabled" }
          - { name: "TIMING_MODE", bit: 1, access: RW, desc: "SCI timing mode - 0=synchronous, 1=asynchronous" }
          - { name: "COMM_MODE", bit: 0, access: RW, desc: "SCI communication mode - 0=idle-line mode, 1=address-bit mode" }
      SCISETINT:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "SCI Set Interrupt Register - enable interrupts"
        fields:
          - { name: "SET_FE_INT", bit: 26, access: RW, desc: "Set framing-error interrupt - 1=enable" }
          - { name: "SET_OE_INT", bit: 25, access: RW, desc: "Set overrun-error interrupt - 1=enable" }
          - { name: "SET_PE_INT", bit: 24, access: RW, desc: "Set parity error interrupt - 1=enable" }
          - { name: "SET_RX_DMA_ALL", bit: 18, access: RW, desc: "Set receive DMA for all frames - 0=interrupt for address frames, 1=DMA for all" }
          - { name: "SET_RX_DMA", bit: 17, access: RW, desc: "Set receiver DMA - 1=enable DMA requests" }
          - { name: "SET_TX_DMA", bit: 16, access: RW, desc: "Set transmit DMA - 1=enable DMA requests" }
          - { name: "SET_RX_INT", bit: 9, access: RW, desc: "Receiver interrupt enable - 1=enable" }
          - { name: "SET_TX_INT", bit: 8, access: RW, desc: "Transmitter interrupt enable - 1=enable" }
          - { name: "SET_WAKEUP_INT", bit: 1, access: RW, desc: "Set wakeup interrupt - 1=enable" }
          - { name: "SET_BRKDT_INT", bit: 0, access: RW, desc: "Set break detect interrupt - 1=enable" }
      SCICLEARINT:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "SCI Clear Interrupt Register - disable interrupts"
        fields:
          - { name: "CLR_FE_INT", bit: 26, access: RW, desc: "Clear framing-error interrupt" }
          - { name: "CLR_OE_INT", bit: 25, access: RW, desc: "Clear overrun-error interrupt" }
          - { name: "CLR_PE_INT", bit: 24, access: RW, desc: "Clear parity error interrupt" }
          - { name: "CLR_RX_DMA_ALL", bit: 18, access: RW, desc: "Clear receive DMA all" }
          - { name: "CLR_RX_DMA", bit: 17, access: RW, desc: "Clear receive DMA request" }
          - { name: "CLR_TX_DMA", bit: 16, access: RW, desc: "Clear transmit DMA request" }
          - { name: "CLR_RX_INT", bit: 9, access: RW, desc: "Clear receiver interrupt" }
          - { name: "CLR_TX_INT", bit: 8, access: RW, desc: "Clear transmitter interrupt" }
          - { name: "CLR_WAKEUP_INT", bit: 1, access: RW, desc: "Clear wakeup interrupt" }
          - { name: "CLR_BRKDT_INT", bit: 0, access: RW, desc: "Clear break detect interrupt" }
      SCISETINTLVL:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "SCI Set Interrupt Level Register"
        fields:
          - { name: "SET_FE_INT_LVL", bit: 26, access: RW, desc: "Set framing-error interrupt level - 0=INT0, 1=INT1" }
          - { name: "SET_OE_INT_LVL", bit: 25, access: RW, desc: "Set overrun-error interrupt level - 0=INT0, 1=INT1" }
          - { name: "SET_PE_INT_LVL", bit: 24, access: RW, desc: "Set parity error interrupt level - 0=INT0, 1=INT1" }
          - { name: "SET_RX_DMA_ALL_LVL", bit: 18, access: RW, desc: "Set receive DMA all interrupt level - 0=INT0, 1=INT1" }
          - { name: "SET_RX_INT_LVL", bit: 9, access: RW, desc: "Set receiver interrupt level - 0=INT0, 1=INT1" }
          - { name: "SET_TX_INT_LVL", bit: 8, access: RW, desc: "Set transmitter interrupt level - 0=INT0, 1=INT1" }
          - { name: "SET_WAKEUP_INT_LVL", bit: 1, access: RW, desc: "Set wakeup interrupt level - 0=INT0, 1=INT1" }
          - { name: "SET_BRKDT_INT_LVL", bit: 0, access: RW, desc: "Set break detect interrupt level - 0=INT0, 1=INT1" }
      SCICLEARINTLVL:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "SCI Clear Interrupt Level Register"
        fields:
          - { name: "CLR_FE_INT_LVL", bit: 26, access: RW, desc: "Clear framing-error interrupt level to INT0" }
          - { name: "CLR_OE_INT_LVL", bit: 25, access: RW, desc: "Clear overrun-error interrupt level to INT0" }
          - { name: "CLR_PE_INT_LVL", bit: 24, access: RW, desc: "Clear parity error interrupt level to INT0" }
          - { name: "CLR_RX_DMA_ALL_LVL", bit: 18, access: RW, desc: "Clear receive DMA all interrupt level to INT0" }
          - { name: "CLR_RX_INT_LVL", bit: 9, access: RW, desc: "Clear receiver interrupt level to INT0" }
          - { name: "CLR_TX_INT_LVL", bit: 8, access: RW, desc: "Clear transmitter interrupt level to INT0" }
          - { name: "CLR_WAKEUP_INT_LVL", bit: 1, access: RW, desc: "Clear wakeup interrupt level to INT0" }
          - { name: "CLR_BRKDT_INT_LVL", bit: 0, access: RW, desc: "Clear break detect interrupt level to INT0" }
      SCIFLR:
        offset: '0x1C'
        access: RW
        reset: '0x00000100'
        desc: "SCI Flags Register"
        fields:
          - { name: "FE", bit: 26, access: RW, desc: "Framing error flag - 1=error detected" }
          - { name: "OE", bit: 25, access: RW, desc: "Overrun error flag - 1=error detected" }
          - { name: "PE", bit: 24, access: RW, desc: "Parity error flag - 1=error detected" }
          - { name: "RXWAKE", bit: 12, access: RW, desc: "Receiver wakeup detect flag - 1=data in SCIRD is address" }
          - { name: "TX_EMPTY", bit: 11, access: RW, desc: "Transmitter empty flag - 1=buffer and shift registers empty" }
          - { name: "TXWAKE", bit: 10, access: RW, desc: "Transmitter wakeup method select - address-bit: 1=address frame, 0=data frame" }
          - { name: "RXRDY", bit: 9, access: RW, desc: "Receiver ready flag - 1=new data in SCIRD" }
          - { name: "TXRDY", bit: 8, access: RW, desc: "Transmitter buffer register ready - 1=ready for next character" }
          - { name: "BUSY", bit: 3, access: RW, desc: "Bus busy flag - 1=receiver is receiving a frame" }
          - { name: "IDLE", bit: 2, access: RW, desc: "SCI receiver in idle state - 1=waiting for idle period" }
          - { name: "WAKEUP", bit: 1, access: RW, desc: "Wakeup flag - 1=exited power-down mode due to activity" }
          - { name: "BRKDT", bit: 0, access: RW, desc: "Break detect flag - 1=break condition detected" }
      SCIINTVECT0:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "SCI Interrupt Vector Offset 0"
        fields:
          - { name: "INTVECT0", msb: 3, lsb: 0, access: RW, desc: "Interrupt vector offset for INT0 line" }
      SCIINTVECT1:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "SCI Interrupt Vector Offset 1"
        fields:
          - { name: "INTVECT1", msb: 3, lsb: 0, access: RW, desc: "Interrupt vector offset for INT1 line" }
      SCIFORMAT:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "SCI Format Control Register"
        fields:
          - { name: "CHAR", msb: 2, lsb: 0, access: RW, desc: "Character length control - 0=1 bit, 7=8 bits" }
      BRS:
        offset: '0x2C'
        access: RW
        reset: '0x00000000'
        desc: "Baud Rate Selection Register"
        fields:
          - { name: "BAUD", msb: 23, lsb: 0, access: RW, desc: "24-bit baud rate prescaler value" }
      SCIED:
        offset: '0x30'
        access: RW
        reset: '0x00000000'
        desc: "Receiver Emulation Data Buffer"
        fields:
          - { name: "ED", msb: 7, lsb: 0, access: RW, desc: "Emulator data - reading does not clear RXRDY flag" }
      SCIRD:
        offset: '0x34'
        access: RW
        reset: '0x00000000'
        desc: "Receiver Data Buffer"
        fields:
          - { name: "RD", msb: 7, lsb: 0, access: RW, desc: "Receiver data - reading clears RXRDY flag" }
      SCITD:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "Transmit Data Buffer Register"
        fields:
          - { name: "TD", msb: 7, lsb: 0, access: RW, desc: "Transmit data - writing transfers to shift register" }
      SCIPIO0:
        offset: '0x3C'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 0"
        fields:
          - { name: "TX_FUNC", bit: 2, access: RW, desc: "SCITX pin function - 0=GPIO, 1=SCI transmit" }
          - { name: "RX_FUNC", bit: 1, access: RW, desc: "SCIRX pin function - 0=GPIO, 1=SCI receive" }
      SCIPIO1:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 1"
        fields:
          - { name: "TX_DIR", bit: 2, access: RW, desc: "SCITX pin direction - 0=input, 1=output" }
          - { name: "RX_DIR", bit: 1, access: RW, desc: "SCIRX pin direction - 0=input, 1=output" }
      SCIPIO2:
        offset: '0x44'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 2"
        fields:
          - { name: "TX_IN", bit: 2, access: RW, desc: "SCITX pin input value" }
          - { name: "RX_IN", bit: 1, access: RW, desc: "SCIRX pin input value" }
      SCIPIO3:
        offset: '0x48'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 3"
        fields:
          - { name: "TX_OUT", bit: 2, access: RW, desc: "SCITX pin output value" }
          - { name: "RX_OUT", bit: 1, access: RW, desc: "SCIRX pin output value" }
      SCIPIO4:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 4"
        fields:
          - { name: "TX_SET", bit: 2, access: RW, desc: "SCITX pin set - write 1 to set output high" }
          - { name: "RX_SET", bit: 1, access: RW, desc: "SCIRX pin set - write 1 to set output high" }
      SCIPIO5:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 5"
        fields:
          - { name: "TX_CLR", bit: 2, access: RW, desc: "SCITX pin clear - write 1 to set output low" }
          - { name: "RX_CLR", bit: 1, access: RW, desc: "SCIRX pin clear - write 1 to set output low" }
      SCIPIO6:
        offset: '0x54'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 6"
        fields:
          - { name: "TX_PDR", bit: 2, access: RW, desc: "SCITX pin open drain enable - 1=open drain" }
          - { name: "RX_PDR", bit: 1, access: RW, desc: "SCIRX pin open drain enable - 1=open drain" }
      SCIPIO7:
        offset: '0x58'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 7"
        fields:
          - { name: "TX_PD", bit: 2, access: RW, desc: "SCITX pin pull control disable - 0=enabled, 1=disabled" }
          - { name: "RX_PD", bit: 1, access: RW, desc: "SCIRX pin pull control disable - 0=enabled, 1=disabled" }
      SCIPIO8:
        offset: '0x5C'
        access: RW
        reset: '0x00000000'
        desc: "SCI Pin I/O Control Register 8"
        fields:
          - { name: "TX_PSL", bit: 2, access: RW, desc: "SCITX pin pull select - 0=pull down, 1=pull up" }
          - { name: "RX_PSL", bit: 1, access: RW, desc: "SCIRX pin pull select - 0=pull down, 1=pull up" }
      IODFTCTRL:
        offset: '0x90'
        access: RW
        reset: '0x00000A00'
        desc: "Input/Output Error Enable Register"
        fields:
          - { name: "FEN", bit: 26, access: RW, desc: "Frame error enable - 1=create frame error" }
          - { name: "PEN", bit: 25, access: RW, desc: "Parity error enable - 1=create parity error" }
          - { name: "BRKDTENA", bit: 24, access: RW, desc: "Break detect error enable - 1=create BRKDT error" }
          - { name: "PIN_SAMPLE_MASK", msb: 20, lsb: 19, access: RW, desc: "Pin sample mask - define sample number to invert TX pin" }
          - { name: "TX_SHIFT", msb: 18, lsb: 16, access: RW, desc: "Transmit shift - delay TX pin value by 0-6 SCLK" }
          - { name: "IODFTENA", msb: 11, lsb: 8, access: RW, desc: "IODFT enable key - 0xA=enabled" }
          - { name: "LPBENA", bit: 1, access: RW, desc: "Module loopback enable - 0=digital, 1=analog" }
          - { name: "RXPENA", bit: 0, access: RW, desc: "Module analog loopback through receive pin - 0=through TX, 1=through RX" }
      LINCOMPARE:
        offset: '0x60'
        access: RW
        reset: '0x0000D000'
        desc: "LIN Compare Register. Synch break and delimiter configuration."
        fields:
          - { name: "SBREAK", msb: 15, lsb: 13, access: RW, reset: "0", desc: "Synch break extend. 0-7 = 13-20 bits." }
          - { name: "SDEL", msb: 9, lsb: 8, access: RW, reset: "1", desc: "Synch delimiter. 0-3 = 1-4 bits." }
      LINRD0:
        offset: '0x64'
        access: RO
        reset: '0x00000000'
        desc: "LIN Receive Buffer 0 Register. Receive data bytes 0-3."
        fields:
          - { name: "RD3", msb: 31, lsb: 24, access: RO, reset: "0", desc: "Receive data byte 3." }
          - { name: "RD2", msb: 23, lsb: 16, access: RO, reset: "0", desc: "Receive data byte 2." }
          - { name: "RD1", msb: 15, lsb: 8, access: RO, reset: "0", desc: "Receive data byte 1." }
          - { name: "RD0", msb: 7, lsb: 0, access: RO, reset: "0", desc: "Receive data byte 0." }
      LINRD1:
        offset: '0x68'
        access: RO
        reset: '0x00000000'
        desc: "LIN Receive Buffer 1 Register. Receive data bytes 4-7."
        fields:
          - { name: "RD7", msb: 31, lsb: 24, access: RO, reset: "0", desc: "Receive data byte 7." }
          - { name: "RD6", msb: 23, lsb: 16, access: RO, reset: "0", desc: "Receive data byte 6." }
          - { name: "RD5", msb: 15, lsb: 8, access: RO, reset: "0", desc: "Receive data byte 5." }
          - { name: "RD4", msb: 7, lsb: 0, access: RO, reset: "0", desc: "Receive data byte 4." }
      LINMASK:
        offset: '0x6C'
        access: RW
        reset: '0x00000000'
        desc: "LIN Mask Register. ID filtering masks."
        fields:
          - { name: "TX_ID_MASK", msb: 15, lsb: 8, access: RW, reset: "0", desc: "Transmit ID mask. Bits to filter for TX match." }
          - { name: "RX_ID_MASK", msb: 7, lsb: 0, access: RW, reset: "0", desc: "Receive ID mask. Bits to filter for RX match." }
      LINID:
        offset: '0x70'
        access: RW
        reset: '0x00000000'
        desc: "LIN Identification Register. ID byte and received ID."
        fields:
          - { name: "RECEIVED_ID", msb: 23, lsb: 16, access: RO, reset: "0", desc: "Received identifier byte." }
          - { name: "ID_BYTE", msb: 7, lsb: 0, access: RW, reset: "0", desc: "ID byte for comparison or transmission." }
      LINTD0:
        offset: '0x74'
        access: RW
        reset: '0x00000000'
        desc: "LIN Transmit Buffer 0. Transmit data bytes 0-3."
        fields:
          - { name: "TD3", msb: 31, lsb: 24, access: RW, reset: "0", desc: "Transmit data byte 3." }
          - { name: "TD2", msb: 23, lsb: 16, access: RW, reset: "0", desc: "Transmit data byte 2." }
          - { name: "TD1", msb: 15, lsb: 8, access: RW, reset: "0", desc: "Transmit data byte 1." }
          - { name: "TD0", msb: 7, lsb: 0, access: RW, reset: "0", desc: "Transmit data byte 0." }
      LINTD1:
        offset: '0x78'
        access: RW
        reset: '0x00000000'
        desc: "LIN Transmit Buffer 1. Transmit data bytes 4-7."
        fields:
          - { name: "TD7", msb: 31, lsb: 24, access: RW, reset: "0", desc: "Transmit data byte 7." }
          - { name: "TD6", msb: 23, lsb: 16, access: RW, reset: "0", desc: "Transmit data byte 6." }
          - { name: "TD5", msb: 15, lsb: 8, access: RW, reset: "0", desc: "Transmit data byte 5." }
          - { name: "TD4", msb: 7, lsb: 0, access: RW, reset: "0", desc: "Transmit data byte 4." }
      MBRS:
        offset: '0x7C'
        access: RW
        reset: '0x00000000'
        desc: "Maximum Baud Rate Selection Register. Maximum baud rate prescaler."
        fields:
          - { name: "MBR", msb: 12, lsb: 0, access: RW, reset: "0", desc: "Maximum baud rate prescaler value." }

  STC:
    base_address: '0x00000000'
    desc: ''
    registers:
      STCGCR0:
        offset: '0x00'
        access: RW
        reset: '0x00010000'
        desc: "STC Global Control Register 0"
        fields:
          - { name: "INTCOUNT", msb: 31, lsb: 16, access: RW, desc: "Number of intervals of self-test run. Specifies the number of intervals to run for the self-test run. This corresponds to the number of intervals to be ran from the value reflected in the current interval counter." }
          - { name: "RS_CNT", bit: 0, access: RW, desc: "Restart or Continue. This bit specifies whether to continue the run from next interval onwards or to restart from interval 0. This bit gets reset after the completion of a self-test run. 0=Continue STC run from the previous interval. 1=Restart STC run from interval 0." }
      STCGCR1:
        offset: '0x04'
        access: RW
        reset: '0x00000005'
        desc: "STC Global Control Register 1"
        fields:
          - { name: "STC_ENA", msb: 3, lsb: 0, access: RW, desc: "Self-test run enable key. 0xA=Self-test run is enabled. All Others=Self-test run is disabled." }
      STCTPR:
        offset: '0x08'
        access: RW
        reset: '0xFFFFFFFF'
        desc: "Self-Test Run Timeout Counter Preload Register"
        fields:
          - { name: "RTOD", msb: 31, lsb: 0, access: RW, desc: "Self-test timeout count preload. This register contains the total number of VBUS clock cycles it will take before an self-test timeout error (TO_ERR) will be triggered after the initiation of the self-test run. This is a fail safe feature to prevent the device from hanging up due to a run away test during the self-test." }
      STC_CADDR:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "STC Current ROM Address Register"
        fields:
          - { name: "ADDR", msb: 31, lsb: 0, access: RW, desc: "Current ROM Address. This register reflects the current ROM address (for micro code load) which is the current value of the STC program counter." }
      STCCICR:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "STC Current Interval Count Register"
        fields:
          - { name: "N", msb: 15, lsb: 0, access: RW, desc: "Interval Number. This specifies the last executed interval number." }
      STCGSTAT:
        offset: '0x14'
        access: RO
        reset: '0x00000000'
        desc: "Self-Test Global Status Register"
        fields:
          - { name: "TEST_FAIL", bit: 1, access: RW, desc: "Test Fail. 0=Self-test run has not failed. 1=Self-test run has failed." }
          - { name: "TEST_DONE", bit: 0, access: RW, desc: "Test Done. 0=Not completed. 1=Self-test run completed. The test done flag is set to a 1 for any of the following conditions: 1) When the STC run is complete without any failure 2) When a failure occurs on a STC run 3) When a timeout failure occurs. Reset is generated to the CPU on which the STC run is being performed when TEST_DONE goes high." }
      STCFSTAT:
        offset: '0x18'
        access: RO
        reset: '0x00000000'
        desc: "Self-Test Fail Status Register"
        fields:
          - { name: "TO_ERR", bit: 2, access: RW, desc: "Timeout Error. 0=No time out error occurred. 1=Self-test run failed due to a timeout error." }
          - { name: "CPU2_FAIL", bit: 1, access: RW, desc: "CPU2 failure info. 0=No MISR mismatch for CPU2. 1=Self-test run failed due to MISR mismatch for CPU2." }
          - { name: "CPU1_FAIL", bit: 0, access: RW, desc: "CPU1 failure info. 0=No MISR mismatch for CPU1. 1=Self-test run failed due to MISR mismatch for CPU1." }
      CPU1_CURMISR3:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "CPU1 Current MISR Register 3"
        fields:
          - { name: "MISR", msb: 31, lsb: 0, access: RW, desc: "MISR data from CPU1 bits [31:0]. This register contains the MISR data from the CPU1 for the most recent interval. This value is compared with the GOLDEN MISR value copied from ROM." }
      CPU1_CURMISR2:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "CPU1 Current MISR Register 2"
        fields:
          - { name: "MISR", msb: 31, lsb: 0, access: RW, desc: "MISR data from CPU1 bits [63:32]. This register contains the MISR data from the CPU1 for the most recent interval. This value is compared with the GOLDEN MISR value copied from ROM." }
      CPU1_CURMISR1:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "CPU1 Current MISR Register 1"
        fields:
          - { name: "MISR", msb: 31, lsb: 0, access: RW, desc: "MISR data from CPU1 bits [95:64]. This register contains the MISR data from the CPU1 for the most recent interval. This value is compared with the GOLDEN MISR value copied from ROM." }
      CPU1_CURMISR0:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "CPU1 Current MISR Register 0"
        fields:
          - { name: "MISR", msb: 31, lsb: 0, access: RW, desc: "MISR data from CPU1 bits [127:96]. This register contains the MISR data from the CPU1 for the most recent interval. This value is compared with the GOLDEN MISR value copied from ROM." }
      CPU2_CURMISR3:
        offset: '0x2C'
        access: RW
        reset: '0x00000000'
        desc: "CPU2 Current MISR Register 3"
        fields:
          - { name: "MISR", msb: 31, lsb: 0, access: RW, desc: "MISR data from CPU2 bits [31:0]. This register contains the MISR data from the CPU2 for the most recent interval. This value is compared with the GOLDEN MISR value copied from ROM." }
      CPU2_CURMISR2:
        offset: '0x30'
        access: RW
        reset: '0x00000000'
        desc: "CPU2 Current MISR Register 2"
        fields:
          - { name: "MISR", msb: 31, lsb: 0, access: RW, desc: "MISR data from CPU2 bits [63:32]. This register contains the MISR data from the CPU2 for the most recent interval. This value is compared with the GOLDEN MISR value copied from ROM." }
      CPU2_CURMISR1:
        offset: '0x34'
        access: RW
        reset: '0x00000000'
        desc: "CPU2 Current MISR Register 1"
        fields:
          - { name: "MISR", msb: 31, lsb: 0, access: RW, desc: "MISR data from CPU2 bits [95:64]. This register contains the MISR data from the CPU2 for the most recent interval. This value is compared with the GOLDEN MISR value copied from ROM." }
      CPU2_CURMISR0:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "CPU2 Current MISR Register 0"
        fields:
          - { name: "MISR", msb: 31, lsb: 0, access: RW, desc: "MISR data from CPU2 bits [127:96]. This register contains the MISR data from the CPU2 for the most recent interval. This value is compared with the GOLDEN MISR value copied from ROM." }
      STCSCSCR:
        offset: '0x3C'
        access: RW
        reset: '0x00000005'
        desc: "Signature Compare Self-Check Register"
        fields:
          - { name: "FAULT_INS", bit: 4, access: RW, desc: "Enable/Disable fault insertion. 0=No fault is inserted. 1=Insert stuck-at-fault inside CPU so that STC signature compare will fail." }
          - { name: "SELF_CHECK_KEY", msb: 3, lsb: 0, access: RW, desc: "Signature compare logic self-check enable key. 0xA=Signature compare logic self-check is enabled. Any other value=Signature compare logic self-check is disabled." }

  TIMER:
    base_address: '0x00000000'
    desc: ''
    registers:
      HETGCR:
        offset: '0x00'
        access: RW
        reset: '0x01000000'
        desc: "Global Configuration Register"
        fields:
          - { name: "HET_PIN_ENA", bit: 24, access: RW, desc: "Enables output buffers of pin structures when nDIS and DIR.x are set" }
          - { name: "MP", msb: 22, lsb: 21, access: RW, desc: "Master Priority - prioritize master accesses to N2HET RAM" }
          - { name: "PPF", bit: 18, access: RW, desc: "Protect Program Fields - prevents writing to program fields when TO=1" }
          - { name: "IS", bit: 17, access: RW, desc: "Ignore Suspend - timer continues operating when set to 1" }
          - { name: "CMS", bit: 16, access: RW, desc: "Clk_master/slave - synchronize multi-N2HETs, must be 1 for single N2HET" }
          - { name: "TO", bit: 0, access: RW, desc: "Turn On/Off - starts/stops N2HET program execution" }
      HETPFR:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "Prescale Factor Register - determines loop and high resolution clock rates"
        fields:
          - { name: "LRPFC", msb: 10, lsb: 8, access: RW, desc: "Loop-Resolution Pre-scale Factor Code (divide by 1,2,4,8,16,32,64,128)" }
          - { name: "HRPFC", msb: 5, lsb: 0, access: RW, desc: "High-Resolution Pre-scale Factor Code (divide by 1-64)" }
      HETADDR:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Current Address Register"
        fields:
          - { name: "HETADDR", msb: 8, lsb: 0, access: RO, desc: "Current N2HET program address (read-only)" }
      HETOFF1:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "Offset Index Priority Level 1 Register - indexes high-priority interrupt"
        fields:
          - { name: "OFFSET1", msb: 5, lsb: 0, access: RW, desc: "Offset value for pending high-priority interrupt, reading clears flag" }
      HETOFF2:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "Offset Index Priority Level 2 Register - indexes low-priority interrupt"
        fields:
          - { name: "OFFSET2", msb: 5, lsb: 0, access: RW, desc: "Offset value for pending low-priority interrupt, reading clears flag" }
      HETINTENAS:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Enable Set Register"
        fields:
          - { name: "HETINTENAS", msb: 31, lsb: 0, access: RW, desc: "Write 1 to enable interrupts for N2HET instructions at addresses x+0, x+32, x+64" }
      HETINTENAC:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Enable Clear Register"
        fields:
          - { name: "HETINTENAC", msb: 31, lsb: 0, access: RW, desc: "Write 1 to disable interrupts for N2HET instructions" }
      HETEXC1:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "Exception Control Register 1 - enables and sets priority for exceptions"
        fields:
          - { name: "APCNT_OVRFL_ENA", bit: 24, access: RW, desc: "APCNT Overflow Enable" }
          - { name: "APCNT_UNRFL_ENA", bit: 16, access: RW, desc: "APCNT Underflow Enable" }
          - { name: "PRGM_OVRFL_ENA", bit: 8, access: RW, desc: "Program Overflow Enable" }
          - { name: "APCNT_OVRFL_PRY", bit: 2, access: RW, desc: "APCNT Overflow Exception Interrupt Priority (0=level2, 1=level1)" }
          - { name: "APCNT_UNRFL_PRY", bit: 1, access: RW, desc: "APCNT Underflow Exception Interrupt Priority" }
          - { name: "PRGM_OVRFL_PRY", bit: 0, access: RW, desc: "Program Overflow Exception Interrupt Priority" }
      HETEXC2:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "Exception Control Register 2 - exception flags"
        fields:
          - { name: "DEBUG_STATUS_FLAG", bit: 8, access: RW, desc: "Set when N2HET stopped at breakpoint, generates debug request to CPU" }
          - { name: "APCNT_OVRFL_FLAG", bit: 2, access: RWC, desc: "APCNT Overflow Flag - write 1 to clear" }
          - { name: "APCNT_UNDFL_FLAG", bit: 1, access: RWC, desc: "APCNT Underflow Flag - write 1 to clear" }
          - { name: "PRGM_OVERFL_FLAG", bit: 0, access: RWC, desc: "Program Overflow Flag - write 1 to clear" }
      HETPRY:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Priority Register - selects priority level for 32 interrupt sources"
        fields:
          - { name: "HETPRY", msb: 31, lsb: 0, access: RW, desc: "0=priority level 2 (low), 1=priority level 1 (high)" }
      HETFLG:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Flag Register - interrupt condition flags"
        fields:
          - { name: "HETFLAG", msb: 31, lsb: 0, access: RWC, desc: "Interrupt flag bits, set when condition occurs, write 1 to clear" }
      HETAND:
        offset: '0x2C'
        access: RW
        reset: '0x00000000'
        desc: "AND Share Control Register - enables AND sharing of HR structures"
        fields:
          - { name: "ANDSHARE", msb: 15, lsb: 0, access: RW, desc: "Enable AND sharing between consecutive HR structure pairs for output" }
      HETHRSH:
        offset: '0x34'
        access: RW
        reset: '0x00000000'
        desc: "HR Share Control Register - enables HR structure sharing for inputs"
        fields:
          - { name: "HRSHARE", msb: 15, lsb: 0, access: RW, desc: "Enable sharing same pin for two HR input structures" }
      HETXOR:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "HR XOR-Share Control Register - enables XOR sharing for symmetric PWM"
        fields:
          - { name: "XORSHARE", msb: 15, lsb: 0, access: RW, desc: "Enable XOR sharing of same pin for two output HR structures" }
      HETREQENS:
        offset: '0x3C'
        access: RW
        reset: '0x00000000'
        desc: "Request Enable Set Register - enables DMA/HTU request lines"
        fields:
          - { name: "REQENA", msb: 7, lsb: 0, access: RW, desc: "Write 1 to enable N2HET request line n to DMA/HTU" }
      HETREQENC:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: "Request Enable Clear Register - disables DMA/HTU request lines"
        fields:
          - { name: "REQDIS", msb: 7, lsb: 0, access: RW, desc: "Write 1 to disable N2HET request line n" }
      HETREQDS:
        offset: '0x44'
        access: RW
        reset: '0x00000000'
        desc: "Request Destination Select Register - assigns request lines to HTU or DMA"
        fields:
          - { name: "TDBS", msb: 23, lsb: 16, access: RW, desc: "HTU, DMA or Both Select - 1=assign to both HTU and DMA" }
          - { name: "TDS", msb: 7, lsb: 0, access: RW, desc: "HTU or DMA Select - 0=HTU, 1=DMA (when TDBS=0)" }
      HETDIR:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Direction Register - configures pins as input or output"
        fields:
          - { name: "HETDIR", msb: 31, lsb: 0, access: RW, desc: "Data direction: 0=input (tristate), 1=output" }
      HETDIN:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Data Input Register - reads logic state of pins"
        fields:
          - { name: "HETDIN", msb: 31, lsb: 0, access: RW, desc: "Data input: 0=logic low, 1=logic high" }
      HETDOUT:
        offset: '0x54'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Data Output Register - sets output pin states"
        fields:
          - { name: "HETDOUT", msb: 31, lsb: 0, access: RW, desc: "Data output: 0=low, 1=high (or high-Z if open-drain enabled)" }
      HETDSET:
        offset: '0x58'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Data Set Register - atomic set operation"
        fields:
          - { name: "HETDSET", msb: 31, lsb: 0, access: RW, desc: "Write 1 to set corresponding HETDOUT bit, 0=no change" }
      HETDCLR:
        offset: '0x5C'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Data Clear Register - atomic clear operation"
        fields:
          - { name: "HETDCLR", msb: 31, lsb: 0, access: RWC, desc: "Write 1 to clear corresponding HETDOUT bit, 0=no change" }
      HETPDR:
        offset: '0x60'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Open Drain Register - enables open drain mode"
        fields:
          - { name: "HETPDR", msb: 31, lsb: 0, access: RW, desc: "0=push/pull, 1=open drain (tristate when HETDOUT=1)" }
      HETPULDIS:
        offset: '0x64'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Pull Disable Register - disables pull-up/-down"
        fields:
          - { name: "HETPULDIS", msb: 31, lsb: 0, access: RW, desc: "0=pull enabled, 1=pull disabled" }
      HETPSL:
        offset: '0x68'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Pull Select Register - selects pull-up or pull-down"
        fields:
          - { name: "HETPSL", msb: 31, lsb: 0, access: RW, desc: "0=pull-down (if enabled), 1=pull-up (if enabled)" }
      HETPCR:
        offset: '0x74'
        access: RW
        reset: '0x00000005'
        desc: "Parity Control Register - enables/disables parity checking"
        fields:
          - { name: "TEST", bit: 8, access: RW, desc: "Test mode - makes parity bits memory mapped when set" }
          - { name: "PARITY_ENA", msb: 3, lsb: 0, access: RW, desc: "Enable parity checking: 0x5=disabled, 0xA=enabled (recommended)" }
      HETPAR:
        offset: '0x78'
        access: RW
        reset: '0x00000000'
        desc: "Parity Address Register - captures address of first parity error"
        fields:
          - { name: "PAOFF", msb: 12, lsb: 2, access: RW, desc: "Parity error address offset in bytes from N2HET RAM start" }
      HETPPR:
        offset: '0x7C'
        access: RW
        reset: '0x00000000'
        desc: "Parity Pin Register - selects pins driven to safe state on parity error"
        fields:
          - { name: "HETPPR", msb: 31, lsb: 0, access: RW, desc: "1=drive to safe state on parity error, 0=not affected" }
      HETSFPRLD:
        offset: '0x80'
        access: RW
        reset: '0x00000000'
        desc: "Suppression Filter Preload Register - configures input noise filters"
        fields:
          - { name: "CCDIV", msb: 17, lsb: 16, access: RW, desc: "Counter clock divider: 0=/1, 1=/2, 2=/3, 3=/4 of VCLK2" }
          - { name: "CPRLD", msb: 9, lsb: 0, access: RW, desc: "Counter preload value (10-bit)" }
      HETSFENA:
        offset: '0x84'
        access: RW
        reset: '0x00000000'
        desc: "Suppression Filter Enable Register - enables filters per pin"
        fields:
          - { name: "HETSFENA", msb: 31, lsb: 0, access: RW, desc: "0=filter disabled, 1=filter enabled for pin n" }
      HETLBPSEL:
        offset: '0x8C'
        access: RW
        reset: '0x00000000'
        desc: "Loop Back Pair Select Register - enables loopback test mode"
        fields:
          - { name: "LBPTYPE", msb: 31, lsb: 16, access: RW, desc: "Loopback type: 0=digital, 1=analog loopback" }
          - { name: "LBPSEL", msb: 15, lsb: 0, access: RW, desc: "1=enable loopback between HR structure pair n+1/n" }
      HETLBPDIR:
        offset: '0x90'
        access: RW
        reset: '0x00050000'
        desc: "Loop Back Pair Direction Register - sets loopback direction"
        fields:
          - { name: "LBPTSTENA", msb: 19, lsb: 16, access: RW, desc: "Loopback test enable key: 0x5=disabled, 0xA=enabled" }
          - { name: "LBPDIR", msb: 15, lsb: 0, access: RW, desc: "Loopback direction: 0=n input/n+1 output, 1=n output/n+1 input" }
      HETPINDIS:
        offset: '0x94'
        access: RW
        reset: '0x00000000'
        desc: "N2HET Pin Disable Register - enables nDIS pin control"
        fields:
          - { name: "HETPINDIS", msb: 31, lsb: 0, access: RW, desc: "1=pin controlled by nDIS input, 0=normal operation" }
      HWAPINSEL:
        offset: '0x9C'
        access: RW
        reset: '0x00000002'
        desc: "HWAG Pin Select Register - selects toothed-wheel input pin"
        fields:
          - { name: "PINSEL", msb: 4, lsb: 0, access: RW, desc: "Select HET pin 0-31 for HWAG toothed-wheel input (default=2)" }
      HWAGCR0:
        offset: '0xA0'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Global Control Register 0"
        fields:
          - { name: "RESET", bit: 0, access: RW, desc: "HWAG module reset: 0=reset, 1=not in reset" }
      HWAGCR1:
        offset: '0xA4'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Global Control Register 1"
        fields:
          - { name: "PPWN", bit: 0, access: RW, desc: "Legacy power down bit (no functionality, controlled by NHET)" }
      HWAGCR2:
        offset: '0xA8'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Global Control Register 2 - main control register"
        fields:
          - { name: "ARST", bit: 24, access: RW, desc: "Angle reset - validates singularity, cleared when ACNT cleared" }
          - { name: "TED", bit: 17, access: RW, desc: "Tooth edge select: 0=falling, 1=rising" }
          - { name: "CRI", bit: 16, access: RW, desc: "Criteria enable: 0=disabled, 1=enabled" }
          - { name: "FIL", bit: 8, access: RW, desc: "Input filter enable: 0=disabled, 1=enabled" }
          - { name: "STRT", bit: 0, access: RW, desc: "Start bit - starts HWAG counting on next active edge" }
      HWAENASET:
        offset: '0xAC'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Interrupt Enable Set Register"
        fields:
          - { name: "SETINTENA", msb: 7, lsb: 0, access: RW, desc: "Write 1 to enable HWAG interrupt n" }
      HWAENACLR:
        offset: '0xB0'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Interrupt Enable Clear Register"
        fields:
          - { name: "CLRINTENA", msb: 7, lsb: 0, access: RW, desc: "Write 1 to disable HWAG interrupt n" }
      HWALVLSET:
        offset: '0xB4'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Interrupt Level Set Register"
        fields:
          - { name: "SETINTLVL", msb: 7, lsb: 0, access: RW, desc: "Write 1 to set interrupt n to high priority" }
      HWALVLCLR:
        offset: '0xB8'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Interrupt Level Clear Register"
        fields:
          - { name: "CLRINTLVL", msb: 7, lsb: 0, access: RW, desc: "Write 1 to set interrupt n to low priority" }
      HWAFLG:
        offset: '0xBC'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Interrupt Flag Register"
        fields:
          - { name: "INTFLG", msb: 7, lsb: 0, access: RWC, desc: "HWAG interrupt flags, write 1 to clear" }
      HWAOFF0:
        offset: '0xC0'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Interrupt Offset Register 0 - high priority"
        fields:
          - { name: "OFFSET1", msb: 7, lsb: 0, access: RW, desc: "Offset for high-priority interrupt, reading clears flag" }
      HWAOFF1:
        offset: '0xC4'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Interrupt Offset Register 1 - low priority"
        fields:
          - { name: "OFFSET2", msb: 7, lsb: 0, access: RW, desc: "Offset for low-priority interrupt, reading clears flag" }
      HWAACNT:
        offset: '0xC8'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Angle Value Register - current angle counter value"
        fields:
          - { name: "ACNT", msb: 31, lsb: 0, access: RW, desc: "Angle counter value" }
      HWAPCNT1:
        offset: '0xCC'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Previous Tooth Period Value Register"
        fields:
          - { name: "PCNT1", msb: 23, lsb: 0, access: RW, desc: "Previous tooth period value" }
      HWAPCNT:
        offset: '0xD0'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Current Tooth Period Value Register"
        fields:
          - { name: "PCNT", msb: 23, lsb: 0, access: RW, desc: "Current tooth period value" }
      HWASTWD:
        offset: '0xD4'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Step Width Register"
        fields:
          - { name: "STWD", msb: 9, lsb: 0, access: RW, desc: "Step width value (4-512)" }
      HWATHNB:
        offset: '0xD8'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Teeth Number Register"
        fields:
          - { name: "THNB", msb: 7, lsb: 0, access: RW, desc: "Number of teeth on wheel (1-256)" }
      HWATHVL:
        offset: '0xDC'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Current Teeth Number Register"
        fields:
          - { name: "THVL", msb: 7, lsb: 0, access: RW, desc: "Current tooth counter value" }
      HWAFIL:
        offset: '0xE0'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Filter Register - input noise filter"
        fields:
          - { name: "FIL", msb: 9, lsb: 0, access: RW, desc: "Filter value for normal teeth" }
      HWAFIL2:
        offset: '0xE8'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Filter Register 2 - singularity filter"
        fields:
          - { name: "FIL2", msb: 9, lsb: 0, access: RW, desc: "Filter value for singularity tooth" }
      HWAANGI:
        offset: '0xF0'
        access: RW
        reset: '0x00000000'
        desc: "HWAG Angle Increment Register - interface to NHET"
        fields:
          - { name: "ANGI", msb: 3, lsb: 0, access: RW, desc: "Angle increment value sent to NHET (0-15)" }

  USB:
    base_address: '0x00000000'
    desc: ''
    registers:
      REV:
        offset: '0x00'
        access: RW
        reset: '0x0061'
        desc: "USB Device Controller Revision Number"
        fields:
          - { name: "REV_NB", msb: 7, lsb: 0, access: RW, desc: "Revision number of current USB device controller module - value fixed by hardware" }
      EP_NUM:
        offset: '0x02'
        access: RW
        reset: '0x0000'
        desc: "Endpoint Selection Register"
        fields:
          - { name: "SETUP_SEL", bit: 6, access: RO, desc: "Set by CPU to access EP0 read-only Setup FIFO when reading DATA register" }
          - { name: "EP_SEL", bit: 5, access: RW, desc: "Set by CPU to access status and data registers for selected endpoint" }
          - { name: "EP_DIR", bit: 4, access: RW, desc: "Endpoint direction - 0=OUT, 1=IN" }
          - { name: "EP_NUM", msb: 3, lsb: 0, access: RW, desc: "Endpoint number binary encoded (0-15)" }
      HCREVISION:
        offset: '0x8B00'
        access: RW
        reset: '0x00000010'
        desc: "OHCI Revision Number Register"
        fields:
          - { name: "REV", msb: 7, lsb: 0, access: RW, desc: "OHCI specification revision number" }
      HCCONTROL:
        offset: '0x8B04'
        access: RW
        reset: '0x00000000'
        desc: "HC Operating Mode Register"
        fields:
          - { name: "RWE", bit: 10, access: RW, desc: "Remote wake-up enable (no effect in device)" }
          - { name: "RWC", bit: 9, access: RW, desc: "Remote wake-up connected (no effect in device)" }
          - { name: "IR", bit: 8, access: RW, desc: "Interrupt routing - must be 0" }
          - { name: "HCFS", msb: 7, lsb: 6, access: RW, desc: "Host controller functional state - 0=USB reset, 1=USB resume, 2=USB operational, 3=USB suspend" }
          - { name: "BLE", bit: 5, access: RW, desc: "Bulk list enable" }
          - { name: "CLE", bit: 4, access: RW, desc: "Control list enable" }
          - { name: "IE", bit: 3, access: RW, desc: "Isochronous enable" }
          - { name: "PLE", bit: 2, access: RW, desc: "Periodic list enable" }
          - { name: "CBSR", msb: 1, lsb: 0, access: RW, desc: "Control/bulk service ratio" }

  VIM:
    base_address: '0xFFFFFE00'
    desc: "Vectored Interrupt Manager (VIM) Module"
    registers:
      PARFLG:
        offset: '0xEC'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Vector Table Parity Flag Register"
        fields:
          - { name: "PARFLG", bit: 0, access: RW, desc: "Indicates parity error has been found and Interrupt Vector Table is bypassed" }
          - { name: "Reserved", msb: 31, lsb: 1, access: RW, desc: "Reserved, reads return 0, writes have no effect" }
      PARCTL:
        offset: '0xF0'
        access: RW
        reset: '0x00000005'
        desc: "Interrupt Vector Table Parity Control Register"
        fields:
          - { name: "PARENA", msb: 3, lsb: 0, access: RW, desc: "VIM parity enable. 0x5=disabled, 0xA=enabled (recommended)" }
          - { name: "TEST", bit: 8, access: RW, desc: "Maps parity bits into Interrupt Vector Table frame for CPU access" }
      ADDERR:
        offset: '0xF4'
        access: RW
        reset: '0xFFF82000'
        desc: "Address Parity Error Register - gives address of first parity error location"
        fields:
          - { name: "Word_offset", msb: 1, lsb: 0, access: RW, desc: "Word offset, always reads 0" }
          - { name: "ADDERR", msb: 8, lsb: 2, access: RW, desc: "Address of first encountered parity error since flag cleared" }
          - { name: "IVT_offset", msb: 31, lsb: 9, access: RW, desc: "Interrupt Vector Table offset, always reads 0xFFF82xxx" }
      FBPARERR:
