        fields:
          - { name: "ABO_TIME", msb: 31, lsb: 0, access: RW, desc: "Number of VBUS clock cycles before Bus-Off recovery" }
      DCAN_IF1CMD:
        offset: '0x100'
        access: RW
        reset: '0x00000001'
        desc: "IF1 Command Register"
        fields:
          - { name: "MessageNumber", msb: 7, lsb: 0, access: RW, desc: "Number of message object in Message RAM" }
          - { name: "DMA_Active", bit: 14, access: RW, desc: "Activation of DMA feature for subsequent internal IF1 update" }
          - { name: "Busy", bit: 15, access: RW, desc: "Busy flag" }
          - { name: "DataB", bit: 16, access: RW, desc: "Access Data Bytes 4-7" }
          - { name: "DataA", bit: 17, access: RW, desc: "Access Data Bytes 0-3" }
          - { name: "TxRqst_NewDat", bit: 18, access: RW, desc: "Access Transmission Request bit" }
          - { name: "ClrIntPnd", bit: 19, access: RW, desc: "Clear Interrupt Pending bit" }
          - { name: "Control", bit: 20, access: RW, desc: "Access Control bits" }
          - { name: "Arb", bit: 21, access: RW, desc: "Access Arbitration bits" }
          - { name: "Mask", bit: 22, access: RW, desc: "Access Mask bits" }
          - { name: "WR_RD", bit: 23, access: RW, desc: "Write/Read direction" }
      DCAN_IF1MSK:
        offset: '0x104'
        access: RW
        reset: '0xDFFFFFFF'
        desc: "IF1 Mask Register"
        fields:
          - { name: "Msk", msb: 28, lsb: 0, access: RW, desc: "Identifier Mask" }
          - { name: "MDir", bit: 30, access: RW, desc: "Mask Message Direction" }
          - { name: "MXtd", bit: 31, access: RW, desc: "Mask Extended Identifier" }
      DCAN_IF1ARB:
        offset: '0x108'
        access: RW
        reset: '0x00000000'
        desc: "IF1 Arbitration Register"
        fields:
          - { name: "ID", msb: 28, lsb: 0, access: RW, desc: "Message Identifier" }
          - { name: "Dir", bit: 29, access: RW, desc: "Message direction" }
          - { name: "Xtd", bit: 30, access: RW, desc: "Extended Identifier" }
          - { name: "MsgVal", bit: 31, access: RW, desc: "Message Valid" }
      DCAN_IF1MCTL:
        offset: '0x10C'
        access: RW
        reset: '0x00000000'
        desc: "IF1 Message Control Register"
        fields:
          - { name: "DLC", msb: 3, lsb: 0, access: RW, desc: "Data Length Code" }
          - { name: "EoB", bit: 7, access: RW, desc: "End of Block" }
          - { name: "TxRqst", bit: 8, access: RW, desc: "Transmit Request" }
          - { name: "RmtEn", bit: 9, access: RW, desc: "Remote Enable" }
          - { name: "RxIE", bit: 10, access: RW, desc: "Receive Interrupt Enable" }
          - { name: "TxIE", bit: 11, access: RW, desc: "Transmit Interrupt Enable" }
          - { name: "UMask", bit: 12, access: RW, desc: "Use Acceptance Mask" }
          - { name: "IntPnd", bit: 13, access: RW, desc: "Interrupt Pending" }
          - { name: "MsgLst", bit: 14, access: RW, desc: "Message Lost" }
          - { name: "NewDat", bit: 15, access: RW, desc: "New Data" }
      DCAN_TIOC:
        offset: '0x1E0'
        access: RW
        reset: '0x00000000'
        desc: "CAN TX IO Control Register"
        fields:
          - { name: "In", bit: 0, access: RW, desc: "CAN_TX data in" }
          - { name: "Out", bit: 1, access: RW, desc: "CAN_TX data out write" }
          - { name: "Dir", bit: 2, access: RW, desc: "CAN_TX data direction" }
          - { name: "Func", bit: 3, access: RW, desc: "CAN_TX function" }
          - { name: "OD", bit: 16, access: RW, desc: "CAN_TX open drain enable" }
          - { name: "PD", bit: 17, access: RW, desc: "CAN_TX pull disable" }
          - { name: "PU", bit: 18, access: RW, desc: "CAN_TX Pullup/Pulldown select" }
      DCAN_RIOC:
        offset: '0x1E4'
        access: RW
        reset: '0x00000000'
