          - { name: "CHPEN", bit: 0, access: RW, desc: "PWM-Chopper Enable" }

  ESM:
    base_address: '0x00000000'
    desc: ''
    registers:
      ESMEEPAPR1:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "ESM Enable ERROR Pin Action/Response Register 1"
        fields:
          - { name: "IEPSET", msb: 31, lsb: 0, access: RW, desc: "Enable ERROR Pin Action/Response on Group 1. 0=No influence on ERROR pin, 1=Failure has influence on ERROR pin" }
      ESMDEPAPR1:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "ESM Disable ERROR Pin Action/Response Register 1"
        fields:
          - { name: "IEPCLR", msb: 31, lsb: 0, access: RW, desc: "Disable ERROR Pin Action/Response on Group 1. 0=No influence on ERROR pin, 1=Disables failure influence" }
      ESMIESR1:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "ESM Interrupt Enable Set Register 1"
        fields:
          - { name: "INTENSET", msb: 31, lsb: 0, access: RW, desc: "Set interrupt enable. 0=Interrupt disabled, 1=Interrupt enabled" }
      ESMIECR1:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "ESM Interrupt Enable Clear Register 1"
        fields:
          - { name: "INTENCLR", msb: 31, lsb: 0, access: RW, desc: "Clear interrupt enable. 0=Interrupt disabled, 1=Disables interrupt" }
      ESMILSR1:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Level Set Register 1"
        fields:
          - { name: "INTLVLSET", msb: 31, lsb: 0, access: RW, desc: "Set interrupt priority. 0=Low-level interrupt line, 1=High-level interrupt line" }
      ESMILCR1:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Level Clear Register 1"
        fields:
          - { name: "INTLVLCLR", msb: 31, lsb: 0, access: RW, desc: "Clear interrupt priority. 0=Low-level interrupt line, 1=Maps to low-level interrupt" }
      ESMSR1:
        offset: '0x18'
        access: RO
        reset: '0x00000000'
        desc: "ESM Status Register 1"
        fields:
          - { name: "ESF", msb: 31, lsb: 0, access: RW, desc: "Error Status Flag. 0=No error/no interrupt pending, 1=Error occurred/interrupt pending" }
      ESMSR2:
        offset: '0x1C'
        access: RO
        reset: '0x00000000'
        desc: "ESM Status Register 2"
        fields:
          - { name: "ESF", msb: 31, lsb: 0, access: RW, desc: "Error Status Flag for Group2. 0=No error/no interrupt pending, 1=Error occurred/interrupt pending" }
      ESMSR3:
        offset: '0x20'
        access: RO
        reset: '0x00000000'
        desc: "ESM Status Register 3"
        fields:
          - { name: "ESF", msb: 31, lsb: 0, access: RW, desc: "Error Status Flag for Group3. 0=No error occurred, 1=Error occurred" }
      ESMEPSR:
        offset: '0x24'
        access: RO
        reset: '0x00000001'
        desc: "ESM ERROR Pin Status Register"
        fields:
          - { name: "EPSF", bit: 0, access: RW, desc: "ERROR Pin Status Flag. 0=ERROR pin low (active), 1=ERROR pin high (no error)" }
          - { name: "Reserved", msb: 31, lsb: 1, access: RW, desc: "Reserved" }
      ESMIOFFHR:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "ESM Interrupt Offset High Register"
        fields:
          - { name: "INTOFFH", msb: 6, lsb: 0, access: RW, desc: "Offset High-Level Interrupt. Channel number of highest-pending interrupt for high-level interrupt line" }
          - { name: "Reserved", msb: 31, lsb: 7, access: RW, desc: "Reserved" }
      ESMIOFFLR:
        offset: '0x2C'
        access: RW
        reset: '0x00000000'
        desc: "ESM Interrupt Offset Low Register"
        fields:
          - { name: "INTOFFL", msb: 6, lsb: 0, access: RW, desc: "Offset Low-Level Interrupt. Channel number of highest-pending interrupt for low-level interrupt line" }
          - { name: "Reserved", msb: 31, lsb: 7, access: RW, desc: "Reserved" }
      ESMLTCR:
        offset: '0x30'
        access: RW
        reset: '0x00003FFF'
        desc: "ESM Low-Time Counter Register"
        fields:
          - { name: "LTC", msb: 15, lsb: 0, access: RW, desc: "ERROR Pin Low-Time Counter. 16-bit preloadable down-counter to control low-time of ERROR pin" }
          - { name: "Reserved", msb: 31, lsb: 16, access: RW, desc: "Reserved" }
      ESMLTCPR:
        offset: '0x34'
        access: RW
        reset: '0x00003FFF'
        desc: "ESM Low-Time Counter Preload Register"
        fields:
          - { name: "LTCP", msb: 15, lsb: 0, access: RW, desc: "ERROR Pin Low-Time Counter Pre-load Value. Defines minimum period ERROR pin driven (16384 VCLK cycles default)" }
          - { name: "Reserved", msb: 31, lsb: 16, access: RW, desc: "Reserved" }
      ESMEKR:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "ESM Error Key Register"
        fields:
          - { name: "EKEY", msb: 3, lsb: 0, access: RW, desc: "Error Key. 0=Normal mode, 5h=ERROR pin set high when LTC completes, Ah=Force error on ERROR pin" }
          - { name: "Reserved", msb: 31, lsb: 4, access: RW, desc: "Reserved" }
      ESMSSR2:
        offset: '0x3C'
        access: RO
        reset: '0x00000000'
        desc: "ESM Status Shadow Register 2"
        fields:
          - { name: "ESF", msb: 31, lsb: 0, access: RW, desc: "Error Status Flag shadow register. Errors stored until cleared by software or PORRST" }
      ESMIEPSR4:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: "ESM Influence ERROR Pin Set Register 4"
        fields:
          - { name: "IEPSET", msb: 31, lsb: 0, access: RW, desc: "Set influence on ERROR pin for Group1 channels 32-63" }
      ESMIEPCR4:
        offset: '0x44'
        access: RW
        reset: '0x00000000'
        desc: "ESM Influence ERROR Pin Clear Register 4"
        fields:
          - { name: "IEPCLR", msb: 31, lsb: 0, access: RW, desc: "Clear influence on ERROR pin for Group1 channels 32-63" }
      ESMIESR4:
        offset: '0x48'
        access: RW
        reset: '0x00000000'
        desc: "ESM Interrupt Enable Set Register 4"
        fields:
          - { name: "INTENSET", msb: 31, lsb: 0, access: RW, desc: "Set interrupt enable for Group1 channels 32-63" }
      ESMIECR4:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: "ESM Interrupt Enable Clear Register 4"
        fields:
          - { name: "INTENCLR", msb: 31, lsb: 0, access: RW, desc: "Clear interrupt enable for Group1 channels 32-63" }
      ESMILSR4:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Level Set Register 4"
        fields:
          - { name: "INTLVLSET", msb: 31, lsb: 0, access: RW, desc: "Set interrupt level for Group1 channels 32-63" }
      ESMILCR4:
        offset: '0x54'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Level Clear Register 4"
        fields:
          - { name: "INTLVLCLR", msb: 31, lsb: 0, access: RW, desc: "Clear interrupt level for Group1 channels 32-63" }
      ESMSR4:
        offset: '0x58'
        access: RO
        reset: '0x00000000'
        desc: "ESM Status Register 4"
        fields:
          - { name: "ESF", msb: 31, lsb: 0, access: RW, desc: "Error Status Flag for Group1 channels 32-63" }

  FMC:
    base_address: '0x00000000'
    desc: ''
    registers:
      FRDCNTL:
        offset: '0x00'
        access: RW
        reset: '0x00000100'
        desc: "Flash Option Control Register"
        fields:
          - { name: "RWAIT", msb: 11, lsb: 8, access: RW, desc: "Random/data Read Wait State. Indicates how many wait states are added to a Flash read access. In Pipeline mode there is always one wait state even when RWAIT is cleared to 0." }
          - { name: "ASWSTEN", bit: 4, access: RW, desc: "Address Setup Wait State Enable. 0=disabled, 1=enabled. Address is latched one cycle before decoding to determine pipeline hit or miss. Only available in pipeline mode." }
          - { name: "ENPIPE", bit: 0, access: RW, desc: "Enable Pipeline Mode. 0=Pipeline mode disabled, 1=Pipeline mode enabled" }
      FEDACCTRL1:
        offset: '0x08'
        access: RW
        reset: '0x000A0005'
        desc: "Flash Error Detection and Correction Control Register 1"
        fields:
          - { name: "SUSP_IGNR", bit: 24, access: RW, desc: "Suspend Ignore. Determines whether the CPU suspend signal is ignored by the Flash module. 0=CPU suspend signal blocks error bits setting and unfreezing, 1=CPU suspend has no effect" }
          - { name: "EDACMODE", msb: 19, lsb: 16, access: RW, desc: "Error Correction Mode for the main Flash banks. 5h=Single-bit errors during reads from OTP, ECC and mirrored space treated as uncorrectable errors" }
          - { name: "EOFEN", bit: 10, access: RW, desc: "Event on One's Fail Enable. 0=No ESM error event, 1=ESM error event generated on single-bit error where 1 reads as 0" }
          - { name: "EZFEN", bit: 9, access: RW, desc: "Event on Zero's Fail Enable. 0=No ESM error event, 1=ESM error event generated on single-bit error where 0 reads as 1" }
          - { name: "EPEN", bit: 8, access: RW, desc: "Error Profiling Enable. 0=disabled, 1=enabled. Correctable error event generated when threshold reached" }
          - { name: "EDACEN", msb: 3, lsb: 0, access: RW, desc: "Error Detection and Correction Enable. 5h=CPU single and double error event signals blocked, all other values=events captured and sent to ESM" }
      FEDACCTRL2:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "Flash Error Correction and Correction Control Register 2"
        fields:
          - { name: "SEC_THRESHOLD", msb: 15, lsb: 0, access: RW, desc: "Single Error Correction Threshold. When error profiling is enabled, contains threshold value for SEC occurrences before correctable error event is generated. Zero disables threshold." }
      FCOR_ERR_CNT:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "Flash Correctable Error Count Register"
        fields:
          - { name: "FERRCNT", msb: 15, lsb: 0, access: RW, desc: "Single Error Correction Count. Contains number of SEC occurrences. Writing any value resets count to 0. Only increments when profiling mode enabled." }
      FCOR_ERR_ADD:
        offset: '0x14'
        access: RW
        reset: 'undefined'
        desc: "Flash Correctable Error Address Register"
        fields:
          - { name: "COR_ERR_ADD", msb: 31, lsb: 3, access: RW, desc: "Correctable Error Address. Records CPU logical address where correctable error detected. Frozen from update until read by CPU." }
          - { name: "B_OFF", msb: 2, lsb: 0, access: RW, desc: "Byte Offset. Address bits for ECC location or 64-bit aligned address for main memory/OTP" }
      FCOR_ERR_POS:
        offset: '0x18'
        access: RW
        reset: 'undefined'
        desc: "Flash Correctable Error Position Register"
        fields:
          - { name: "BUS2", bit: 9, access: RW, desc: "Bus 2 Error. 0=error in main Flash, 1=error from OTP read" }
          - { name: "TYPE", bit: 8, access: RW, desc: "Error Type. 0=error in 64 data bits, 1=error in 8 check bits" }
          - { name: "ERR_POS", msb: 7, lsb: 0, access: RW, desc: "The bit address of the single-bit error" }
      FEDACSTATUS:
        offset: '0x1C'
        access: RO
        reset: 'undefined'
        desc: "Flash Error Detection and Correction Status Register"
        fields:
          - { name: "FSM_DONE", bit: 24, access: RW, desc: "Flash State Machine Done. Set when FSM completes program or erase operation. Generates interrupt on VIM channel 61 if FSM_EVT_EN bit set." }
          - { name: "COMB2_MAL_G", bit: 19, access: RW, desc: "Bus 2 Compare Malfunction Flag. 0=malfunction detected or not in diag mode, 1=no malfunction detected or entered diag mode 4" }
          - { name: "ECC_B2_MAL_ERR", bit: 18, access: RW, desc: "Bus 2 ECC Malfunction Error Flag. Set if Bus 2 data not corrected and single-bit error seen, or data corrected and single-bit error not seen" }
          - { name: "B2_UNC_ERR", bit: 17, access: RW, desc: "Bus 2 Uncorrectable Error Flag. 0=no errors, 1=uncorrectable error detected. Generates ESM group 3 channel 7 event." }
          - { name: "B2_COR_ERR", bit: 16, access: RW, desc: "Bus 2 Correctable Error Flag. 0=no error, 1=correctable error detected. Generates ESM group 1 channel 6 event." }
          - { name: "D_UNC_ERR", bit: 12, access: RW, desc: "Diagnostic Uncorrectable Error Flag. Set when diagnostic mode 1 discovers multi-bit error using ECC" }
          - { name: "ADD_TAG_ERR", bit: 11, access: RW, desc: "Address Tag Register Error Flag. Set if primary address tag has hit but duplicate doesn't match. Generates ESM group 3 channel 7 event." }
          - { name: "ADD_PAR_ERR", bit: 10, access: RW, desc: "Address Parity Error Flag. 0=no error, 1=parity error on incoming address bus. Generates ESM group 2 channel 4 event." }
          - { name: "B1_UNC_ERR", bit: 8, access: RW, desc: "Bus 1 Uncorrectable Error Flag. 0=no errors, 1=uncorrectable error detected. Generates ESM group 3 channel 7 event." }
          - { name: "D_COR_ERR", bit: 3, access: RW, desc: "Diagnostic Correctable Error Status Flag. Set when diagnostic mode 1 discovers single-bit correctable error using ECC" }
          - { name: "ERR_ONE_FLG", bit: 2, access: RW, desc: "Error on One Fail Status Flag. 0=no error, 1=correctable error on bus 2 where 1 read as 0. Generates ESM group 1 channel 6 event." }
          - { name: "ERR_ZERO_FLG", bit: 1, access: RW, desc: "Error on Zero Fail Status Flag. 0=no error, 1=correctable error on bus 1 or bus 2 where 0 read as 1. Generates ESM group 1 channel 6 event." }
          - { name: "ERR_PRF_FLG", bit: 0, access: RW, desc: "Error Profiling Status Flag. Set when error profiling enabled and number of correctable errors reached threshold" }
      FUNC_ERR_ADD:
        offset: '0x20'
        access: RW
        reset: 'undefined'
        desc: "Flash Uncorrectable Error Address Register"
        fields:
          - { name: "UNC_ERR_ADD", msb: 31, lsb: 3, access: RW, desc: "Uncorrectable Error Address. Records CPU logical address where uncorrectable error detected or address bus parity mismatch. Frozen until read by CPU." }
          - { name: "B_OFF", msb: 2, lsb: 0, access: RW, desc: "Byte offset. Address bits for ECC location or 64-bit aligned address" }
      FEDACSDIS:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "Flash Error Detection and Correction Sector Disable Register"
        fields:
          - { name: "BankID1_Inverse", msb: 31, lsb: 29, access: RW, desc: "Bank ID inverse bits used with BankID1 to select bank for sector disable. 0=if BankID1=7h and valid sector selected, that sector has ECC disabled" }
          - { name: "SectorID1_inverse", msb: 27, lsb: 24, access: RW, desc: "Sector ID inverse bits used with SectorID1 to determine which sector disabled" }
          - { name: "BankID1", msb: 23, lsb: 21, access: RW, desc: "Bank ID bits for selecting bank. 7h=bank 7 (only bank supporting sector disable)" }
          - { name: "SectorID1", msb: 19, lsb: 16, access: RW, desc: "Sector ID bits used with SectorID1_inverse to determine which sector disabled" }
          - { name: "BankID0_Inverse", msb: 15, lsb: 13, access: RW, desc: "Bank ID inverse bits used with BankID0 to select bank for sector disable" }
          - { name: "SectorID0_inverse", msb: 11, lsb: 8, access: RW, desc: "Sector ID inverse bits used with SectorID0 to determine which sector disabled" }
          - { name: "BankID0", msb: 7, lsb: 5, access: RW, desc: "Bank ID bits for selecting bank. 7h=bank 7" }
          - { name: "SectorID0", msb: 3, lsb: 0, access: RW, desc: "Sector ID bits used with SectorID0_inverse to determine which sector disabled" }
      FPRIM_ADD_TAG:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "Flash Primary Address Tag Register"
        fields:
          - { name: "PRIM_ADD_TAG", msb: 31, lsb: 4, access: RW, desc: "Primary Address Tag Register. Selected via DIAG_BUF_SEL in FDIAGCTRL. Writable in privileged mode when diagnostic mode enabled with DIAG_EN_KEY=5h and DIAG_MODE=5h" }
      FDUP_ADD_TAG:
        offset: '0x2C'
        access: RW
        reset: '0x00000000'
        desc: "Flash Duplicate Address Tag Register"
        fields:
          - { name: "DUP_ADD_TAG", msb: 31, lsb: 4, access: RW, desc: "Duplicate Address Tag Register. Selected via DIAG_BUF_SEL in FDIAGCTRL. Writable in privileged mode when diagnostic mode enabled" }
      FBPROT:
        offset: '0x30'
        access: RW
        reset: '0x00000000'
        desc: "Flash Bank Protection Register"
        fields:
          - { name: "PROTL1DIS", bit: 0, access: RW, desc: "Level 1 Protection Disabled. 0=Level 1 protection enabled, 1=Level 1 protection disabled. Controls write access to OTPPROTDIS and FBSE registers" }
      FBSE:
        offset: '0x34'
        access: RW
        reset: '0x00000000'
        desc: "Flash Bank Sector Enable Register"
        fields:
          - { name: "BSE", msb: 15, lsb: 0, access: RW, desc: "Bank Sector Enable. One bit per Flash sector. 0=sector disabled for program/erase, 1=sector enabled. Can be set only when PROTL1DIS=1 and in privilege mode" }
      FBBUSY:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "Flash Bank Busy Register"
        fields:
          - { name: "BUSY", msb: 7, lsb: 0, access: RW, desc: "Bank Busy. One bit per Flash bank. 0=bank not busy, 1=bank busy with state machine or bus 2 operation, or not implemented" }
      FBAC:
        offset: '0x3C'
        access: RW
        reset: '0x00000F00'
        desc: "Flash Bank Access Control Register"
        fields:
          - { name: "OTPPROTDIS", msb: 23, lsb: 16, access: RW, desc: "OTP Sector Protection Disable. One bit per Flash bank. 0=OTP programming disabled, 1=enabled. Can be set only when PROTL1DIS=1 and in privilege mode" }
          - { name: "BAGP", msb: 15, lsb: 8, access: RW, desc: "Bank Active Grace Period. Starting count for BAGP down counter. Delays 0-255 prescaled HCLK cycles before bank enters fallback power mode. Must be >1 when fallback not ACTIVE" }
          - { name: "VREADST", msb: 7, lsb: 0, access: RW, desc: "VREAD Setup. Bank power up sequencing starts VREADST HCLK cycles after VREAD power supply stable" }
      FBFALLBACK:
        offset: '0x40'
        access: RW
        reset: '0x0505CFFF'
        desc: "Flash Bank Fallback Power Register"
        fields:
          - { name: "BANKPWR7", msb: 15, lsb: 14, access: RW, desc: "Bank 7 Fallback Power Mode. 0=sleep, 1=standby, 3=active" }
          - { name: "BANKPWR1", msb: 3, lsb: 2, access: RW, desc: "Bank 1 Fallback Power Mode. 0=sleep, 1=standby, 3=active" }
          - { name: "BANKPWR0", msb: 1, lsb: 0, access: RW, desc: "Bank 0 Fallback Power Mode. 0=sleep, 1=standby, 3=active" }
      FBPRDY:
        offset: '0x44'
        access: RW
        reset: '0x00008001'
        desc: "Flash Bank/Pump Ready Register"
        fields:
          - { name: "BANKBUSY", msb: 23, lsb: 16, access: RW, desc: "Bank busy bits. One bit per bank. 0=bank not busy, 1=bank busy/not ready or not implemented" }
          - { name: "PUMPRDY", bit: 15, access: RW, desc: "Flash pump ready flag. 0=not ready, 1=ready for Flash accesses" }
          - { name: "BANKRDY", msb: 7, lsb: 0, access: RW, desc: "Bank ready bits. One bit per bank. 0=bank in sleep/standby, 1=bank in active state or not implemented" }
      FPAC1:
        offset: '0x48'
        access: RW
        reset: '0x00640001'
        desc: "Flash Pump Access Control Register 1"
        fields:
          - { name: "PSLEEP", msb: 26, lsb: 16, access: RW, desc: "Pump Sleep. Starting count for charge pump sleep down counter. Delays 0 to PSLEEP pump sleep down clock cycles before putting pump into active mode" }
          - { name: "PUMPPWR", bit: 0, access: RW, desc: "Flash Charge Pump Fallback Power Mode. 0=Sleep (all pump circuits disabled), 1=Active (all pump circuits active)" }
      FPAC2:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: "Flash Pump Access Control Register 2"
        fields:
          - { name: "PAGP", msb: 15, lsb: 0, access: RW, desc: "Pump Active Grace Period. Starting count for PAGP down counter. Delays 0-65535 prescaled HCLK cycles before entering charge pump fallback power mode" }
      FMAC:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "Flash Module Access Control Register"
        fields:
          - { name: "BANK", msb: 2, lsb: 0, access: RW, desc: "Bank Enable. Selects which bank enabled for operations. 000=bank 0, 011=bank 3, etc." }
      FMSTAT:
        offset: '0x54'
        access: RO
        reset: '0x00000000'
        desc: "Flash Module Status Register"
        fields:
          - { name: "ILA", bit: 14, access: RW, desc: "Illegal Address. Set when illegal address detected" }
          - { name: "PGV", bit: 12, access: RW, desc: "Program Verify. Set when word not successfully programmed after max program pulses" }
          - { name: "EV", bit: 10, access: RW, desc: "Erase Verify. Set when sector not successfully erased after max erase pulses" }
          - { name: "BUSY", bit: 8, access: RW, desc: "Busy. Set when program, erase, or suspend operation being processed" }
          - { name: "ERS", bit: 7, access: RW, desc: "Erase Active. Set when Flash actively performing erase operation" }
          - { name: "PGM", bit: 6, access: RW, desc: "Program Active. Set when Flash currently performing program operation" }
          - { name: "INVDAT", bit: 5, access: RW, desc: "Invalid Data. Set when user attempted to program 1 where 0 already present" }
          - { name: "CSTAT", bit: 4, access: RW, desc: "Command Status. Set when program, erase, or validate sector command failed" }
          - { name: "VOLTSTAT", bit: 3, access: RW, desc: "Core Voltage Status. Set when core voltage generator dipped below limit during program/erase" }
          - { name: "ESUSP", bit: 2, access: RW, desc: "Erase Suspended. Set when erase suspend operation received and processed" }
          - { name: "PSUSP", bit: 1, access: RW, desc: "Program Suspended. Set when program suspend operation received and processed" }
          - { name: "SLOCK", bit: 0, access: RW, desc: "Sector Lock Status. Set when operation halted because target sector locked" }
      FEMU_DMSW:
        offset: '0x58'
        access: RW
        reset: '0x00000000'
        desc: "EEPROM Emulation Data MSW Register"
        fields:
          - { name: "EMU_DMSW", msb: 31, lsb: 0, access: RW, desc: "EEPROM Emulation Most-Significant Data Word. Upper 32 bits of 64-bit data for ECC check bit calculation. Also used in diagnostic modes 1 and 2." }
      FEMU_DLSW:
        offset: '0x5C'
        access: RW
        reset: '0x00000000'
        desc: "EEPROM Emulation Data LSW Register"
        fields:
          - { name: "EMU_DLSW", msb: 31, lsb: 0, access: RW, desc: "EEPROM Emulation Least-Significant Data Word. Lower 32 bits of 64-bit data for ECC check bit calculation. Write to this register triggers ECC calculation. Also used in diagnostic modes 1 and 2." }
      FEMU_ECC:
        offset: '0x60'
        access: RW
        reset: '0x00000003'
        desc: "EEPROM Emulation ECC Register"
        fields:
          - { name: "EMU_ECC", msb: 7, lsb: 0, access: RW, desc: "EEPROM Emulation ECC Check Bit Value. Contains ECC check bits calculated by FMC. Also used in diagnostic modes 1 and 2." }
      FEMU_ADDR:
        offset: '0x68'
        access: RW
        reset: '0x00000000'
        desc: "EEPROM Emulation Address Register"
        fields:
          - { name: "EMU_ADDR", msb: 21, lsb: 3, access: RW, desc: "EEPROM Emulation Address. Address of 64-bit data word for ECC calculation. Only bits 21:3 written and used. Also used in diagnostic modes 1 and 2." }
      FDIAGCTRL:
        offset: '0x6C'
        access: RW
        reset: '0x000A0000'
        desc: "Diagnostic Control Register"
        fields:
          - { name: "DIAG_TRIG", bit: 24, access: RW, desc: "Diagnostic Trigger. Final qualifier for diagnostic result. Set to 1 to activate diagnostic logic for one access, then auto-clears" }
          - { name: "DIAG_EN_KEY", msb: 19, lsb: 16, access: RW, desc: "Diagnostic Enable Key. 5h=enabled, all other values=disabled" }
          - { name: "DIAG_ECC_SEL", msb: 14, lsb: 12, access: RW, desc: "Diagnostic SECDED Select. 0=SECDED0, 1=SECDED1, 2=SECDED2, 3=SECDED3, 4=BUS2 SECDED, 5=FEE SECDED" }
          - { name: "DIAG_BUF_SEL", msb: 9, lsb: 8, access: RW, desc: "Diagnostic Buffer Select. Selects Instruction or Data buffer when accessing address tag registers" }
          - { name: "DIAG_MODE", msb: 2, lsb: 0, access: RW, desc: "Diagnostic Mode. 0=disabled, 1=ECC data correction, 2=ECC syndrome reporting, 3=ECC malfunction mode 1, 4=ECC malfunction mode 2, 5=address tag register, 7=ECC data correction diagnostic" }
      FRAW_DATAH:
        offset: '0x70'
        access: RW
        reset: 'undefined'
        desc: "Uncorrected Raw Data High Register"
        fields:
          - { name: "RAW_DATA", msb: 31, lsb: 0, access: RW, desc: "Uncorrected Raw Data. Upper 32 bits of 64-bit raw data used in diagnostic testing of ECC logic" }
      FRAW_DATAL:
        offset: '0x74'
        access: RW
        reset: 'undefined'
        desc: "Uncorrected Raw Data Low Register"
        fields:
          - { name: "RAW_DATA", msb: 31, lsb: 0, access: RW, desc: "Uncorrected Raw Data. Lower 32 bits of 64-bit raw data used in diagnostic testing of ECC logic" }
      FRAW_ECC:
        offset: '0x78'
        access: RW
        reset: 'undefined'
        desc: "Uncorrected Raw ECC Register"
        fields:
          - { name: "PIPE_BUF", bit: 8, access: RW, desc: "Error came from pipeline buffer hit. Cleared when RAW_ECC updated or by writing 1" }
          - { name: "RAW_ECC", msb: 7, lsb: 0, access: RW, desc: "Uncorrected Raw ECC. ECC data used in diagnostic testing of ECC logic" }
      FPAR_OVR:
        offset: '0x7C'
        access: RW
        reset: '0x00005200'
        desc: "Parity Override Register"
        fields:
          - { name: "BNK_INV_PAR", bit: 16, access: RW, desc: "Buffer Invert Parity. When 1 and PAR_OVR_KEY=101, inverts SYS_ODD_PARITY for bank parity calculations. Only for parity configurations." }
          - { name: "BUS_PAR_DIS", msb: 15, lsb: 12, access: RW, desc: "Disable Bus Parity. When 1010, address/buffer parity errors disabled. Any other value enables checking." }
          - { name: "PAR_OVR_KEY", msb: 11, lsb: 9, access: RW, desc: "Parity Override Key. When 101, ADD_INV_PAR and DAT_INV_PAR become active. Otherwise uses global system parity bit." }
          - { name: "ADD_INV_PAR", bit: 8, access: RW, desc: "Address Odd Parity. Active when PAR_OVR_KEY=101. When 1, inverts SYS_ODD_PARITY for incoming address parity" }
          - { name: "DAT_INV_PAR", msb: 7, lsb: 0, access: RW, desc: "Data Odd Parity. Active when PAR_OVR_KEY=101. When bit set, inverts SYS_ODD_PARITY for output read data parity. Also ECC corrupting value for SIL3 diagnostic mode 7 when ECC in CPU" }
      FEDACSDIS2:
        offset: '0xC0'
        access: RW
        reset: '0x00000000'
        desc: "Flash Error Detection and Correction Sector Disable Register 2"
        fields:
          - { name: "BankID3_Inverse", msb: 31, lsb: 29, access: RW, desc: "Bank ID inverse bits for disable ID 3. 0 with BankID3=7h disables ECC for selected sector" }
          - { name: "SectorID3_inverse", msb: 27, lsb: 24, access: RW, desc: "Sector ID inverse bits for disable ID 3. Used with SectorID3 to determine disabled sector" }
          - { name: "BankID3", msb: 23, lsb: 21, access: RW, desc: "Bank ID bits for disable ID 3. 7h=bank 7 (only bank supporting sector disable)" }
          - { name: "SectorID3", msb: 19, lsb: 16, access: RW, desc: "Sector ID bits for disable ID 3. Used with SectorID3_inverse to determine disabled sector" }
          - { name: "BankID2_Inverse", msb: 15, lsb: 13, access: RW, desc: "Bank ID inverse bits for disable ID 2. 0 with BankID2=7h disables ECC for selected sector" }
          - { name: "SectorID2_inverse", msb: 11, lsb: 8, access: RW, desc: "Sector ID inverse bits for disable ID 2. Used with SectorID2 to determine disabled sector" }
          - { name: "BankID2", msb: 7, lsb: 5, access: RW, desc: "Bank ID bits for disable ID 2. 7h=bank 7" }
          - { name: "SectorID2", msb: 3, lsb: 0, access: RW, desc: "Sector ID bits for disable ID 2. Used with SectorID2_inverse to determine disabled sector" }
      FSM_WR_ENA:
        offset: '0x288'
        access: RW
        reset: '0x00000002'
        desc: "FSM Register Write Enable"
        fields:
          - { name: "WR_ENA", msb: 2, lsb: 0, access: RW, desc: "Flash State Machine Write Enable. Must contain 101 to write to FSM registers (FFF8 7200h to FFF8 72FFh). First register to write when setting up FSM." }
      FSM_SECTOR:
        offset: '0x2A4'
        access: RW
        reset: '0x00000000'
        desc: "FSM Sector Register"
        fields:
          - { name: "SECT_ERASED", msb: 31, lsb: 16, access: RW, desc: "Sectors Erased. One bit per sector. After bank erase, bit for each erased sector changes from 0 to 1. 0=sector will be erased during bank erase, 1=sector will not be erased" }
      EEPROM_CONFIG:
        offset: '0x2B8'
        access: RW
        reset: '0x00010002'
        desc: "EEPROM Emulation Configuration Register"
        fields:
          - { name: "EWAIT", msb: 19, lsb: 16, access: RW, desc: "EEPROM Wait State Counter. Replaces RWAIT count in EEPROM register. Same formulas as RWAIT apply." }
          - { name: "AUTOSUSP_EN", bit: 8, access: RW, desc: "Auto Suspend Enable. 0=disabled, 1=enabled. Auto-suspend begins when CPU/Bus 2 accesses bank with active suspendable FSM operation" }
          - { name: "AUTOSTART_GRACE", msb: 7, lsb: 0, access: RW, desc: "Auto-suspend Startup Grace Period. Determines how many cycles FMC waits after last CPU/Bus 2 access before issuing FSM resume. Each count = 16 HCLK periods. 0=16 periods. Each access resets counter." }
      EE_CTRL1:
        offset: '0x308'
        access: RW
        reset: '0x050A0005'
        desc: "EEPROM Emulation Error Detection and Correction Control Register 1"
        fields:
          - { name: "EE_EDACMODE", msb: 19, lsb: 16, access: RW, desc: "Error Correction Mode for EEPROM Emulation Flash bank (bank 7). 5h=Detection only mode (single-bit errors not corrected, treated as uncorrectable), all other values=single-bit errors corrected" }
          - { name: "EE_EOFEN", bit: 10, access: RW, desc: "EEPROM Emulation Event on correctable One's Fail Enable. 0=no ESM event, 1=ESM group 1 channel 35 event on single-bit error when 1 reads as 0" }
          - { name: "EE_EZFEN", bit: 9, access: RW, desc: "EEPROM Emulation Event on correctable Zero's Fail Enable. 0=no ESM event, 1=ESM group 1 channel 35 event on single-bit error when 0 reads as 1" }
          - { name: "EE_EPEN", bit: 8, access: RW, desc: "EEPROM Emulation Error Profiling Enable. 0=disabled, 1=enabled. ESM group 1 channel 35 event when threshold reached" }
          - { name: "EE_ALL1_OK", bit: 5, access: RW, desc: "EEPROM Emulation All One Condition Valid. 0=all 1s generates errors, 1=all 1s valid (no ECC errors generated)" }
          - { name: "EE_ALL0_OK", bit: 4, access: RW, desc: "EEPROM Emulation All Zero Condition Valid. 0=all 0s generates errors, 1=all 0s valid (no ECC errors generated)" }
          - { name: "EE_EDACEN", msb: 3, lsb: 0, access: RW, desc: "EEPROM Emulation Error Detection and Correction Enable. 5h=disabled, all other values=enabled" }
      EE_CTRL2:
        offset: '0x30C'
        access: RW
        reset: '0x00000000'
        desc: "EEPROM Emulation Error Correction and Correction Control Register 2"
        fields:
          - { name: "EE_SEC_THRESHOLD", msb: 15, lsb: 0, access: RW, desc: "EEPROM Emulation Single Error Correction Threshold. Threshold value for SEC occurrences before single interrupt generated. Zero disables threshold." }
      EE_COR_ERR_CNT:
        offset: '0x310'
        access: RW
        reset: '0x00000000'
        desc: "EEPROM Emulation Correctable Error Count Register"
        fields:
          - { name: "EE_ERRCNT", msb: 15, lsb: 0, access: RW, desc: "Single Error Correction Count. Number of SEC occurrences. Writing any value resets to 0. Only increments when profiling enabled." }
      EE_COR_ERR_ADD:
        offset: '0x314'
        access: RW
        reset: 'undefined'
        desc: "EEPROM Emulation Correctable Error Address Register"
        fields:
          - { name: "COR_ERR_ADD", msb: 31, lsb: 3, access: RW, desc: "Correctable Error Address. Records CPU logical address where correctable error detected. Frozen until read by CPU." }
          - { name: "B_OFF", msb: 2, lsb: 0, access: RW, desc: "Byte offset. 64-bit aligned address for main memory/OTP, or ECC location address" }
      EE_COR_ERR_POS:
        offset: '0x318'
        access: RW
        reset: 'undefined'
        desc: "EEPROM Emulation Correctable Error Position Register"
        fields:
          - { name: "TYPE", bit: 8, access: RW, desc: "Error Type. 0=error in 64 data bits, 1=error in 8 check bits" }
          - { name: "EE_ERR_POS", msb: 7, lsb: 0, access: RW, desc: "The bit address of the single-bit error" }
      EE_STATUS:
        offset: '0x31C'
        access: RO
        reset: 'undefined'
        desc: "EEPROM Emulation Error Status Register"
        fields:
          - { name: "EE_D_UNC_ERR", bit: 12, access: RW, desc: "Diagnostic Mode Uncorrectable Error Status Flag. 0=no error, 1=uncorrectable error in diagnostic mode 1" }
          - { name: "EE_UNC_ERR", bit: 8, access: RW, desc: "EEPROM Emulation Uncorrectable Error Flag. 0=no errors, 1=uncorrectable error in bank 7" }
          - { name: "EE_CMG", bit: 6, access: RW, desc: "EEPROM Emulation Compare Malfunction Good. 0=compare malfunction detected, 1=no malfunction detected" }
          - { name: "EE_CME", bit: 4, access: RW, desc: "EEPROM Emulation Compare Malfunction Error. 0=no malfunction, 1=compare malfunction detected" }
          - { name: "EE_D_COR_ERR", bit: 3, access: RW, desc: "Diagnostic Correctable Error Flag. 0=no error, 1=correctable error detected" }
          - { name: "EE_ERR_ONE_FLG", bit: 2, access: RW, desc: "Error on One Fail Error Flag. 0=no error, 1=correctable error detected" }
          - { name: "EE_ERR_ZERO_FLG", bit: 1, access: RW, desc: "Error on Zero Fail Error Flag. 0=no error, 1=correctable error detected" }
          - { name: "EE_ERR_PRF_FLG", bit: 0, access: RW, desc: "Error Profiling Error Flag. 0=no error, 1=correctable error detected" }
      EE_UNC_ERR_ADD:
        offset: '0x320'
        access: RW
        reset: 'undefined'
        desc: "EEPROM Emulation Uncorrectable Error Address Register"
        fields:
          - { name: "UNC_ERR_ADD", msb: 31, lsb: 3, access: RW, desc: "Uncorrectable Error Address. Records CPU logical address where uncorrectable error detected. Frozen until read by CPU." }
          - { name: "B_OFF", msb: 2, lsb: 0, access: RW, desc: "Byte offset. 64-bit aligned address for main memory/OTP, or ECC location address" }
      FCFG_BANK:
        offset: '0x400'
        access: RW
        reset: '0x90019002'
        desc: "Flash Bank Configuration Register"
        fields:
          - { name: "EE_BANK_WIDTH", msb: 31, lsb: 20, access: RW, desc: "Bank 7 width (144-bits wide). Maximum number of bits that can be programmed in bank in one operation. Includes 128 data bits and 16 ECC bits." }
          - { name: "MAIN_BANK_WIDTH", msb: 15, lsb: 4, access: RW, desc: "Width of main Flash banks (144-bits wide). Maximum number of bits that can be programmed in bank in one operation. Includes 128 data bits and 16 ECC bits." }

  GIO:
    base_address: '0xFFF7BC00'
    desc: ''
    registers:
      GIOGCR0:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "GIO Global Control Register"
        fields:
          - { name: "RESET", bit: 0, access: RW, desc: "GIO reset. 0=GIO in reset state, 1=GIO operating normally" }
          - { name: "Reserved", msb: 31, lsb: 1, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOINTDET:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: >-
          GIO Interrupt Detect Register - configures interrupt detection on both edges or single edge
        fields:
          - { name: "GIOINTDET0", msb: 7, lsb: 0, access: RW, desc: "Interrupt detection select for pins GIOA[7:0]. 0=flag sets on single edge per GIOPOL, 1=flag sets on both edges" }
          - { name: "GIOINTDET1", msb: 15, lsb: 8, access: RW, desc: "Interrupt detection select for pins GIOB[7:0]. 0=flag sets on single edge per GIOPOL, 1=flag sets on both edges" }
          - { name: "GIOINTDET2", msb: 23, lsb: 16, access: RW, desc: "Interrupt detection select for pins GIOC[7:0]. 0=flag sets on single edge per GIOPOL, 1=flag sets on both edges" }
          - { name: "GIOINTDET3", msb: 31, lsb: 24, access: RW, desc: "Interrupt detection select for pins GIOD[7:0]. 0=flag sets on single edge per GIOPOL, 1=flag sets on both edges" }
      GIOPOL:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "GIO Interrupt Polarity Register - configures rising or falling edge detection"
        fields:
          - { name: "GIOPOL0", msb: 7, lsb: 0, access: RW, desc: "Interrupt polarity select for pins GIOA[7:0]. Normal mode: 0=falling edge, 1=rising edge. Low-power mode: 0=low level, 1=high level" }
          - { name: "GIOPOL1", msb: 15, lsb: 8, access: RW, desc: "Interrupt polarity select for pins GIOB[7:0]. Normal mode: 0=falling edge, 1=rising edge. Low-power mode: 0=low level, 1=high level" }
          - { name: "GIOPOL2", msb: 23, lsb: 16, access: RW, desc: "Interrupt polarity select for pins GIOC[7:0]. Normal mode: 0=falling edge, 1=rising edge. Low-power mode: 0=low level, 1=high level" }
          - { name: "GIOPOL3", msb: 31, lsb: 24, access: RW, desc: "Interrupt polarity select for pins GIOD[7:0]. Normal mode: 0=falling edge, 1=rising edge. Low-power mode: 0=low level, 1=high level" }
      GIOENASET:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "GIO Interrupt Enable Set Register"
        fields:
          - { name: "GIOENASET0", msb: 7, lsb: 0, access: RW, desc: "Interrupt enable for pins GIOA[7:0]. Read: 0=disabled, 1=enabled. Write: 1=enable interrupt, 0=no effect" }
          - { name: "GIOENASET1", msb: 15, lsb: 8, access: RW, desc: "Interrupt enable for pins GIOB[7:0]. Read: 0=disabled, 1=enabled. Write: 1=enable interrupt, 0=no effect" }
          - { name: "GIOENASET2", msb: 23, lsb: 16, access: RW, desc: "Interrupt enable for pins GIOC[7:0]. Read: 0=disabled, 1=enabled. Write: 1=enable interrupt, 0=no effect" }
          - { name: "GIOENASET3", msb: 31, lsb: 24, access: RW, desc: "Interrupt enable for pins GIOD[7:0]. Read: 0=disabled, 1=enabled. Write: 1=enable interrupt, 0=no effect" }
      GIOENACLR:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "GIO Interrupt Enable Clear Register"
        fields:
          - { name: "GIOENACLR0", msb: 7, lsb: 0, access: RW, desc: "Interrupt disable for pins GIOA[7:0]. Read: 0=disabled, 1=enabled. Write: 1=disable interrupt, 0=no effect" }
          - { name: "GIOENACLR1", msb: 15, lsb: 8, access: RW, desc: "Interrupt disable for pins GIOB[7:0]. Read: 0=disabled, 1=enabled. Write: 1=disable interrupt, 0=no effect" }
          - { name: "GIOENACLR2", msb: 23, lsb: 16, access: RW, desc: "Interrupt disable for pins GIOC[7:0]. Read: 0=disabled, 1=enabled. Write: 1=disable interrupt, 0=no effect" }
          - { name: "GIOENACLR3", msb: 31, lsb: 24, access: RW, desc: "Interrupt disable for pins GIOD[7:0]. Read: 0=disabled, 1=enabled. Write: 1=disable interrupt, 0=no effect" }
      GIOLVLSET:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "GIO Interrupt Priority Set Register - configures high-level (level A) interrupt"
        fields:
          - { name: "GIOLVLSET0", msb: 7, lsb: 0, access: RW, desc: "GIO high-priority interrupt for pins GIOA[7:0]. Read: 0=low-level, 1=high-level. Write: 1=set high-level, 0=no effect" }
          - { name: "GIOLVLSET1", msb: 15, lsb: 8, access: RW, desc: "GIO high-priority interrupt for pins GIOB[7:0]. Read: 0=low-level, 1=high-level. Write: 1=set high-level, 0=no effect" }
          - { name: "GIOLVLSET2", msb: 23, lsb: 16, access: RW, desc: "GIO high-priority interrupt for pins GIOC[7:0]. Read: 0=low-level, 1=high-level. Write: 1=set high-level, 0=no effect" }
          - { name: "GIOLVLSET3", msb: 31, lsb: 24, access: RW, desc: "GIO high-priority interrupt for pins GIOD[7:0]. Read: 0=low-level, 1=high-level. Write: 1=set high-level, 0=no effect" }
      GIOLVLCLR:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "GIO Interrupt Priority Clear Register - configures low-level (level B) interrupt"
        fields:
          - { name: "GIOLVLCLR0", msb: 7, lsb: 0, access: RW, desc: "GIO low-priority interrupt for pins GIOA[7:0]. Read: 0=low-level, 1=high-level. Write: 1=set low-level, 0=no effect" }
          - { name: "GIOLVLCLR1", msb: 15, lsb: 8, access: RW, desc: "GIO low-priority interrupt for pins GIOB[7:0]. Read: 0=low-level, 1=high-level. Write: 1=set low-level, 0=no effect" }
          - { name: "GIOLVLCLR2", msb: 23, lsb: 16, access: RW, desc: "GIO low-priority interrupt for pins GIOC[7:0]. Read: 0=low-level, 1=high-level. Write: 1=set low-level, 0=no effect" }
          - { name: "GIOLVLCLR3", msb: 31, lsb: 24, access: RW, desc: "GIO low-priority interrupt for pins GIOD[7:0]. Read: 0=low-level, 1=high-level. Write: 1=set low-level, 0=no effect" }
      GIOFLG:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "GIO Interrupt Flag Register"
        fields:
          - { name: "GIOFLG0", msb: 7, lsb: 0, access: RW, desc: "GIO flag for pins GIOA[7:0]. Read: 0=no transition, 1=transition occurred. Write: 1=clear flag, 0=no effect. Also cleared by reading GIOOFF1/GIOOFF2" }
          - { name: "GIOFLG1", msb: 15, lsb: 8, access: RW, desc: "GIO flag for pins GIOB[7:0]. Read: 0=no transition, 1=transition occurred. Write: 1=clear flag, 0=no effect. Also cleared by reading GIOOFF1/GIOOFF2" }
          - { name: "GIOFLG2", msb: 23, lsb: 16, access: RW, desc: "GIO flag for pins GIOC[7:0]. Read: 0=no transition, 1=transition occurred. Write: 1=clear flag, 0=no effect. Also cleared by reading GIOOFF1/GIOOFF2" }
          - { name: "GIOFLG3", msb: 31, lsb: 24, access: RW, desc: "GIO flag for pins GIOD[7:0]. Read: 0=no transition, 1=transition occurred. Write: 1=clear flag, 0=no effect. Also cleared by reading GIOOFF1/GIOOFF2" }
      GIOOFF1:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "GIO Offset 1 Register - offset value for high-priority pending interrupt"
        fields:
          - { name: "GIOOFF1", msb: 5, lsb: 0, access: RW, desc: "GIO offset 1. Index of currently pending high-priority interrupt. 0=no interrupt, 1-32=interrupt number. Reading clears register, GIOEMU1 and flag bit except in emulation mode" }
          - { name: "Reserved", msb: 31, lsb: 6, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOOFF2:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "GIO Offset 2 Register - offset value for low-priority pending interrupt"
        fields:
          - { name: "GIOOFF2", msb: 5, lsb: 0, access: RW, desc: "GIO offset 2. Index of currently pending low-priority interrupt. 0=no interrupt, 1-32=interrupt number. Reading clears register, GIOEMU2 and flag bit except in emulation mode" }
          - { name: "Reserved", msb: 31, lsb: 6, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOEMU1:
        offset: '0x2C'
        access: RO
        reset: '0x00000000'
        desc: "GIO Emulation 1 Register - read-only copy of GIOOFF1 that does not clear flags"
        fields:
          - { name: "GIOEMU1", msb: 5, lsb: 0, access: RW, desc: "GIO offset emulation 1. Index of currently pending high-priority interrupt. 0=no interrupt, 1-32=interrupt number. Reading does NOT clear registers or flags" }
          - { name: "Reserved", msb: 31, lsb: 6, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOEMU2:
        offset: '0x30'
        access: RO
        reset: '0x00000000'
        desc: "GIO Emulation 2 Register - read-only copy of GIOOFF2 that does not clear flags"
        fields:
          - { name: "GIOEMU2", msb: 5, lsb: 0, access: RW, desc: "GIO offset emulation 2. Index of currently pending low-priority interrupt. 0=no interrupt, 1-32=interrupt number. Reading does NOT clear registers or flags" }
          - { name: "Reserved", msb: 31, lsb: 6, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODIRA:
        offset: '0x34'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Direction Register - Port A"
        fields:
          - { name: "GIODIR", msb: 7, lsb: 0, access: RW, desc: "GIO data direction of port A, pins [7:0]. 0=input (output buffer tristated), 1=output" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODINA:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Input Register - Port A"
        fields:
          - { name: "GIODIN", msb: 7, lsb: 0, access: RW, desc: "GIO data input for port A, pins [7:0]. 0=pin at logic low, 1=pin at logic high" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODOUTA:
        offset: '0x3C'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Output Register - Port A"
        fields:
          - { name: "GIODOUT", msb: 7, lsb: 0, access: RW, desc: "GIO data output of port A, pins[7:0]. 0=pin driven low, 1=pin driven high (or high-Z if open drain enabled)" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODSETA:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Set Register - Port A"
        fields:
          - { name: "GIODSET", msb: 7, lsb: 0, access: RW, desc: "GIO data set for port A, pins[7:0]. Write 1 to drive pin high. Writing 0 has no effect. Reflects current state of GIODOUT" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODCLRA:
        offset: '0x44'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Clear Register - Port A"
        fields:
          - { name: "GIODCLR", msb: 7, lsb: 0, access: RW, desc: "GIO data clear for port A, pins[7:0]. Write 1 to drive pin low. Writing 0 has no effect. Reflects current state of GIODOUT" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOPDRA:
        offset: '0x48'
        access: RW
        reset: '0x00000000'
        desc: "GIO Open Drain Register - Port A"
        fields:
          - { name: "GIOPDR", msb: 7, lsb: 0, access: RW, desc: "GIO open drain for port A, pins[7:0]. 0=push/pull mode, 1=open drain (GIODOUT=0 drives low, GIODOUT=1 tristates)" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOPULDISA:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: "GIO Pull Disable Register - Port A"
        fields:
          - { name: "GIOPULDIS", msb: 7, lsb: 0, access: RW, desc: "GIO pull disable for port A, pins[7:0]. 0=pull functionality enabled, 1=pull functionality disabled. Only effective when pin is input" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOPSLA:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "GIO Pull Select Register - Port A"
        fields:
          - { name: "GIOPSL", msb: 7, lsb: 0, access: RW, desc: "GIO pull select for port A, pins[7:0]. 0=pull down selected, 1=pull up selected (when pull enabled via GIOPULDIS)" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODIRB:
        offset: '0x54'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Direction Register - Port B"
        fields:
          - { name: "GIODIR", msb: 7, lsb: 0, access: RW, desc: "GIO data direction of port B, pins [7:0]. 0=input (output buffer tristated), 1=output" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODINB:
        offset: '0x58'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Input Register - Port B"
        fields:
          - { name: "GIODIN", msb: 7, lsb: 0, access: RW, desc: "GIO data input for port B, pins [7:0]. 0=pin at logic low, 1=pin at logic high" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODOUTB:
        offset: '0x5C'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Output Register - Port B"
        fields:
          - { name: "GIODOUT", msb: 7, lsb: 0, access: RW, desc: "GIO data output of port B, pins[7:0]. 0=pin driven low, 1=pin driven high (or high-Z if open drain enabled)" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODSETB:
        offset: '0x60'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Set Register - Port B"
        fields:
          - { name: "GIODSET", msb: 7, lsb: 0, access: RW, desc: "GIO data set for port B, pins[7:0]. Write 1 to drive pin high. Writing 0 has no effect. Reflects current state of GIODOUT" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIODCLRB:
        offset: '0x64'
        access: RW
        reset: '0x00000000'
        desc: "GIO Data Clear Register - Port B"
        fields:
          - { name: "GIODCLR", msb: 7, lsb: 0, access: RW, desc: "GIO data clear for port B, pins[7:0]. Write 1 to drive pin low. Writing 0 has no effect. Reflects current state of GIODOUT" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOPDRB:
        offset: '0x68'
        access: RW
        reset: '0x00000000'
        desc: "GIO Open Drain Register - Port B"
        fields:
          - { name: "GIOPDR", msb: 7, lsb: 0, access: RW, desc: "GIO open drain for port B, pins[7:0]. 0=push/pull mode, 1=open drain (GIODOUT=0 drives low, GIODOUT=1 tristates)" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOPULDISB:
        offset: '0x6C'
        access: RW
        reset: '0x00000000'
        desc: "GIO Pull Disable Register - Port B"
        fields:
          - { name: "GIOPULDIS", msb: 7, lsb: 0, access: RW, desc: "GIO pull disable for port B, pins[7:0]. 0=pull functionality enabled, 1=pull functionality disabled. Only effective when pin is input" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }
      GIOPSLB:
        offset: '0x70'
        access: RW
        reset: '0x00000000'
        desc: "GIO Pull Select Register - Port B"
        fields:
          - { name: "GIOPSL", msb: 7, lsb: 0, access: RW, desc: "GIO pull select for port B, pins[7:0]. 0=pull down selected, 1=pull up selected (when pull enabled via GIOPULDIS)" }
          - { name: "Reserved", msb: 31, lsb: 8, access: RW, desc: "Reserved. Reads return 0. Writes have no effect." }

  HTU:
    base_address: '0x00000000'
    desc: ''
    registers:
      HTU_GC:
        offset: '0x00'
        access: RW
        reset: '0x00000000'
        desc: "Global Control Register"
        fields:
          - { name: "VBUSHOLD", bit: 24, access: RW, desc: "Hold the VBUS bus. When set, holds the bus used to transfer data between HTU and N2HET module." }
          - { name: "HTUEN", bit: 16, access: RW, desc: "Transfer Unit Enable Bit. Enables/disables the HTU module." }
          - { name: "DEBM", bit: 8, access: RW, desc: "Debug Mode. 0=HTU stopped in debug mode, 1=HTU continues in debug mode." }
          - { name: "HTURES", bit: 0, access: RW, desc: "HTU Software Reset Request. Writing 1 issues reset request to HTU module." }
      HTU_CPENA:
        offset: '0x04'
        access: RW
        reset: '0x00000000'
        desc: "Control Packet Enable Register"
        fields:
          - { name: "CPENA", msb: 15, lsb: 0, access: RW, desc: "CP Enable Bits. Bits (2*x) and (2*x+1) control double control packet x. 00=disabled, 01=CPA enabled, 10=CPB enabled, 11=both disabled." }
      HTU_BUSY0:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "Control Packet Busy Register 0"
        fields:
          - { name: "BUSY0A", bit: 24, access: RW, desc: "Busy Flag for CP A of DCP 0. Set when frame starts, cleared at end of frame." }
          - { name: "BUSY0B", bit: 16, access: RW, desc: "Busy Flag for CP B of DCP 0" }
          - { name: "BUSY1A", bit: 8, access: RW, desc: "Busy Flag for CP A of DCP 1" }
          - { name: "BUSY1B", bit: 0, access: RW, desc: "Busy Flag for CP B of DCP 1" }
      HTU_BUSY1:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "Control Packet Busy Register 1"
        fields:
          - { name: "BUSY2A", bit: 24, access: RW, desc: "Busy Flag for CP A of DCP 2" }
          - { name: "BUSY2B", bit: 16, access: RW, desc: "Busy Flag for CP B of DCP 2" }
          - { name: "BUSY3A", bit: 8, access: RW, desc: "Busy Flag for CP A of DCP 3" }
          - { name: "BUSY3B", bit: 0, access: RW, desc: "Busy Flag for CP B of DCP 3" }
      HTU_BUSY2:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "Control Packet Busy Register 2"
        fields:
          - { name: "BUSY4A", bit: 24, access: RW, desc: "Busy Flag for CP A of DCP 4" }
          - { name: "BUSY4B", bit: 16, access: RW, desc: "Busy Flag for CP B of DCP 4" }
          - { name: "BUSY5A", bit: 8, access: RW, desc: "Busy Flag for CP A of DCP 5" }
          - { name: "BUSY5B", bit: 0, access: RW, desc: "Busy Flag for CP B of DCP 5" }
      HTU_BUSY3:
        offset: '0x14'
        access: RW
        reset: '0x00000000'
        desc: "Control Packet Busy Register 3"
        fields:
          - { name: "BUSY6A", bit: 24, access: RW, desc: "Busy Flag for CP A of DCP 6" }
          - { name: "BUSY6B", bit: 16, access: RW, desc: "Busy Flag for CP B of DCP 6" }
          - { name: "BUSY7A", bit: 8, access: RW, desc: "Busy Flag for CP A of DCP 7" }
          - { name: "BUSY7B", bit: 0, access: RW, desc: "Busy Flag for CP B of DCP 7" }
      HTU_ACPE:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "Active Control Packet and Error Register"
        fields:
          - { name: "ERRF", bit: 31, access: RW, desc: "Error Flag. Set when error occurs, cleared when reading upper 16-bit word or writing 1." }
          - { name: "ERRETC", msb: 28, lsb: 24, access: RW, desc: "Error Element Transfer Count. Captures element counter when error occurs." }
          - { name: "ERRCPN", msb: 19, lsb: 16, access: RW, desc: "Error Control Packet Number. Captures CP number that caused error." }
          - { name: "TIPF", bit: 15, access: RW, desc: "Transfer in Progress Flag. Logical OR of all BUSYxx flags." }
          - { name: "BUSBUSY", bit: 14, access: RW, desc: "Bus is Busy. Set when bus between N2HET and HTU is busy." }
          - { name: "CETCOUNT", msb: 12, lsb: 8, access: RW, desc: "Current Element Transfer Count. Shows current element counter for active frame." }
          - { name: "NACP", msb: 3, lsb: 0, access: RW, desc: "Number of Active Control Packet. Indicates which CP is processing a frame." }
      HTU_RLBECTRL:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "Request Lost and Bus Error Control Register"
        fields:
          - { name: "BERINTENA", bit: 16, access: RW, desc: "Bus Error Interrupt Enable Bit. Enables bus error interrupt for all DCPs." }
          - { name: "CORL", bit: 8, access: RW, desc: "Continue On Request Lost Error. 0=stop frame on request lost, 1=continue frame." }
          - { name: "RLINTENA", bit: 0, access: RW, desc: "Request Lost Interrupt Enable Bit. Enables request lost interrupt for all DCPs." }
      HTU_BFINTS:
        offset: '0x24'
        access: RW
        reset: '0x00000000'
        desc: "Buffer Full Interrupt Enable Set Register"
        fields:
          - { name: "BFINTENA", msb: 15, lsb: 0, access: RW, desc: "Buffer Full Interrupt Enable Bits. Writing 1 enables interrupt for corresponding CP." }
      HTU_BFINTC:
        offset: '0x28'
        access: RW
        reset: '0x00000000'
        desc: "Buffer Full Interrupt Enable Clear Register"
        fields:
          - { name: "BFINTDIS", msb: 15, lsb: 0, access: RW, desc: "Buffer Full Interrupt Disable Bits. Writing 1 disables interrupt for corresponding CP." }
      HTU_INTMAP:
        offset: '0x2C'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Mapping Register"
        fields:
          - { name: "MAPSEL", bit: 16, access: RW, desc: "Interrupt Mapping Select Bit. 0=priority mapping, 1=line mapping." }
          - { name: "CPINTMAP", msb: 15, lsb: 0, access: RW, desc: "CP Interrupt Mapping Bits. Maps CP interrupts to line 0 or 1." }
      HTU_INTOFF0:
        offset: '0x34'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Offset Register 0"
        fields:
          - { name: "INTTYPE0", msb: 9, lsb: 8, access: RW, desc: "Interrupt Type of Interrupt Line 0. 0=none, 1=buffer full, 2=RLOST, 3=BER." }
          - { name: "CPOFF0", msb: 3, lsb: 0, access: RW, desc: "CP Offset. Indicates which CP has pending interrupt on line 0." }
      HTU_INTOFF1:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "Interrupt Offset Register 1"
        fields:
          - { name: "INTTYPE1", msb: 9, lsb: 8, access: RW, desc: "Interrupt Type of Interrupt Line 1. 0=none, 1=buffer full, 2=RLOST, 3=BER." }
          - { name: "CPOFF1", msb: 3, lsb: 0, access: RW, desc: "CP Offset. Indicates which CP has pending interrupt on line 1." }
      HTU_BIM:
        offset: '0x3C'
        access: RW
        reset: '0x00000000'
        desc: "Buffer Initialization Mode Register"
        fields:
          - { name: "BIM", msb: 7, lsb: 0, access: RW, desc: "Buffer Initialization Mode. Determines when buffer is initialized with initial values." }
      HTU_RLOSTFL:
        offset: '0x40'
        access: RW
        reset: '0x00000000'
        desc: "Request Lost Flag Register"
        fields:
          - { name: "CPRLFL", msb: 15, lsb: 0, access: RW, desc: "CP Request Lost Flags. Set when request lost on CP, cleared by reading INTOFFx or writing 1." }
      HTU_BFINTFL:
        offset: '0x44'
        access: RW
        reset: '0x00000000'
        desc: "Buffer Full Interrupt Flag Register"
        fields:
          - { name: "BFINTFL", msb: 15, lsb: 0, access: RW, desc: "Buffer Full Interrupt Flags. Set when buffer full condition detected." }
      HTU_BERINTFL:
        offset: '0x48'
        access: RW
        reset: '0x00000000'
        desc: "BER Interrupt Flag Register"
        fields:
          - { name: "BERINTFL", msb: 15, lsb: 0, access: RW, desc: "Bus Error Interrupt Flags. Set when bus error condition detected." }
      HTU_MP1S:
        offset: '0x4C'
        access: RW
        reset: '0x00000000'
        desc: "Memory Protection 1 Start Address Register"
        fields:
          - { name: "STARTADDRESS1", msb: 31, lsb: 2, access: RW, desc: "Start address of memory protection region 1 (32-bit aligned)." }
      HTU_MP1E:
        offset: '0x50'
        access: RW
        reset: '0x00000000'
        desc: "Memory Protection 1 End Address Register"
        fields:
          - { name: "ENDADDRESS1", msb: 31, lsb: 2, access: RW, desc: "End address of memory protection region 1 (32-bit aligned)." }
      HTU_DCTRL:
        offset: '0x54'
        access: RW
        reset: '0x00000000'
        desc: "Debug Control Register"
        fields:
          - { name: "CPNUM", msb: 27, lsb: 24, access: RW, desc: "CP Number. Indicates CP that should cause watch point to match." }
          - { name: "HTUDBGS", bit: 16, access: RW, desc: "HTU Debug Status. Set when watch point condition detected." }
          - { name: "DBREN", bit: 0, access: RW, desc: "Debug Request Enable. When set with watch point match, stops code execution." }
      HTU_WPR:
        offset: '0x58'
        access: RW
        reset: '0x00000000'
        desc: "Watch Point Register"
        fields:
          - { name: "WP", msb: 31, lsb: 0, access: RW, desc: "Watch Point Register. 32-bit address programmed as watch point." }
      HTU_WMR:
        offset: '0x5C'
        access: RW
        reset: '0x00000000'
        desc: "Watch Mask Register"
        fields:
          - { name: "WM", msb: 31, lsb: 0, access: RW, desc: "Watch Mask Register. Mask for watch point address comparison." }
      HTU_ID:
        offset: '0x60'
        access: RW
        reset: 'Device-specific'
        desc: "Module Identification Register"
        fields:
          - { name: "CLASS", msb: 23, lsb: 16, access: RO, desc: "Module Class. Module class number (read-only)." }
          - { name: "TYPE", msb: 15, lsb: 8, access: RO, desc: "Subtype within a Class (read-only)." }
          - { name: "REV", msb: 7, lsb: 0, access: RO, desc: "Module Revision Number (read-only)." }
      HTU_PCR:
        offset: '0x64'
        access: RW
        reset: '0x00000005'
        desc: "Parity Control Register"
        fields:
          - { name: "COPE", bit: 16, access: RW, desc: "Continue on Parity Error. 0=stop on parity error, 1=continue on parity error." }
          - { name: "TEST", bit: 8, access: RW, desc: "Test. When set, parity bits are memory-mapped for testing." }
          - { name: "PARITY_ENA", msb: 3, lsb: 0, access: RW, desc: "Enable/Disable Parity Checking. 0x5=disabled, others=enabled (recommend 0xA)." }
      HTU_PAR:
        offset: '0x68'
        access: RW
        reset: '0x00000000'
        desc: "Parity Address Register"
        fields:
          - { name: "PEFT", bit: 16, access: RW, desc: "Parity Error Fault Flag. Set when parity error detected." }
          - { name: "PAOFF", msb: 8, lsb: 0, access: RW, desc: "Parity Error Address Offset. Offset address of erroneous byte in DCP memory." }
      HTU_MPCS:
        offset: '0x70'
        access: RO
        reset: '0x00000000'
        desc: "Memory Protection Control and Status Register"
        fields:
          - { name: "CPNUM0", msb: 27, lsb: 24, access: RW, desc: "Control Packet Number for single region. CP that caused first memory protection error." }
          - { name: "MPEFT1", bit: 17, access: RW, desc: "Memory Protection Error Fault Flag 1 for dual region configuration." }
          - { name: "MPEFT0", bit: 16, access: RW, desc: "Memory Protection Error Fault Flag 0 for single region configuration." }
          - { name: "CPNUM1", msb: 11, lsb: 8, access: RW, desc: "Control Packet Number for dual region. CP that caused first memory protection error." }
          - { name: "INTENA01", bit: 5, access: RW, desc: "Interrupt Enable 01. Enables error signaling for dual region." }
          - { name: "ACCR01", bit: 4, access: RW, desc: "Access Rights 01. 0=read allowed write signaled, 1=any access forbidden." }
          - { name: "REG01ENA", bit: 3, access: RW, desc: "Region Enable 01. Enables dual memory region protection." }
          - { name: "INTENA0", bit: 2, access: RW, desc: "Interrupt Enable 0. Enables error signaling for single region." }
          - { name: "ACCR0", bit: 1, access: RW, desc: "Access Rights 0. 0=read allowed write signaled, 1=any access forbidden." }
          - { name: "REG0ENA", bit: 0, access: RW, desc: "Region Enable 0. Enables single memory region protection." }
      HTU_MP0S:
        offset: '0x74'
        access: RW
        reset: '0x00000000'
        desc: "Memory Protection 0 Start Address Register"
        fields:
          - { name: "STARTADDRESS0", msb: 31, lsb: 2, access: RW, desc: "Start address of memory protection region 0 (32-bit aligned)." }
      HTU_MP0E:
        offset: '0x78'
        access: RW
        reset: '0x00000000'
        desc: "Memory Protection 0 End Address Register"
        fields:
          - { name: "ENDADDRESS0", msb: 31, lsb: 2, access: RW, desc: "End address of memory protection region 0 (32-bit aligned)." }
      HTU_IFADDRA:
        offset: '0x00'
        access: RW
        reset: '0xXXXXXXXX'
        desc: "Initial Full Address A Register (in DCP RAM)"
        fields:
          - { name: "IFADDRA", msb: 31, lsb: 2, access: RW, desc: "Initial byte address of buffer A in main memory (32-bit aligned)." }
      HTU_IFADDRB:
        offset: '0x04'
        access: RW
        reset: '0xXXXXXXXX'
        desc: "Initial Full Address B Register (in DCP RAM)"
        fields:
          - { name: "IFADDRB", msb: 31, lsb: 2, access: RW, desc: "Initial byte address of buffer B in main memory (32-bit aligned)." }
      HTU_IHADDRCT:
        offset: '0x08'
        access: RW
        reset: '0xXXXXXXXX'
        desc: "Initial N2HET Address and Control Register (in DCP RAM)"
        fields:
          - { name: "DIR", bit: 23, access: RW, desc: "Direction of Transfer. 0=read HET write memory, 1=read memory write HET." }
          - { name: "SIZE", bit: 22, access: RW, desc: "Size of Transferred Data. 0=32-bit, 1=64-bit." }
          - { name: "ADDMH", bit: 21, access: RW, desc: "Addressing Mode N2HET. 0=increment by 16 bytes, 1=increment by 8 bytes." }
          - { name: "ADDMF", bit: 20, access: RW, desc: "Addressing Mode Main Memory. 0=post-increment, 1=constant." }
          - { name: "TMBA", msb: 19, lsb: 18, access: RW, desc: "Transfer Mode for Buffer A. 0=one-shot, 1=circular, 2-3=auto switch." }
          - { name: "TMBB", msb: 17, lsb: 16, access: RW, desc: "Transfer Mode for Buffer B. 0=one-shot, 1=circular, 2-3=auto switch." }
          - { name: "IHADDR", msb: 12, lsb: 2, access: RW, desc: "Initial N2HET Address. Points to N2HET field for first element of frame." }
      HTU_ITCOUNT:
        offset: '0x0C'
        access: RW
        reset: '0xXXXXXXXX'
        desc: "Initial Transfer Count Register (in DCP RAM)"
        fields:
          - { name: "IETCOUNT", msb: 20, lsb: 16, access: RW, desc: "Initial Element Transfer Count. Number of element transfers per frame." }
          - { name: "IFTCOUNT", msb: 7, lsb: 0, access: RW, desc: "Initial Frame Transfer Count. Number of frame transfers." }
      HTU_CFADDRA:
        offset: '0x100'
        access: RW
        reset: '0xXXXXXXXX'
        desc: "Current Full Address A Register (in DCP RAM)"
        fields:
          - { name: "CFADDRA", msb: 31, lsb: 0, access: RW, desc: "Current byte address of buffer A. Updated at end of each frame." }
      HTU_CFADDRB:
        offset: '0x104'
        access: RW
        reset: '0xXXXXXXXX'
        desc: "Current Full Address B Register (in DCP RAM)"
        fields:
          - { name: "CFADDRB", msb: 31, lsb: 0, access: RW, desc: "Current byte address of buffer B. Updated at end of each frame." }
      HTU_CFCOUNT:
        offset: '0x108'
        access: RW
        reset: '0xXXXXXXXX'
        desc: "Current Frame Count Register (in DCP RAM)"
        fields:
          - { name: "CFTCTA", msb: 23, lsb: 16, access: RW, desc: "Current Frame Transfer Count for CP A. Updated at end of each frame." }
          - { name: "CFTCTB", msb: 7, lsb: 0, access: RW, desc: "Current Frame Transfer Count for CP B. Updated at end of each frame." }

  INTER:
    base_address: '0x00000000'
    desc: ''
    registers:
      I2COAR:
        offset: '0x00'
        access: RW
        reset: '0x0000'
        desc: "I2C Own Address Manager"
        fields:
          - { name: "OA", msb: 9, lsb: 0, access: RW, desc: "Own address - bus address of the I2C module. In 7-bit mode use OA[6:0], in 10-bit mode use OA[9:0]" }
      I2CIMR:
        offset: '0x04'
        access: RW
        reset: '0x0000'
        desc: "I2C Interrupt Mask Register"
        fields:
          - { name: "AASEN", bit: 6, access: RW, desc: "Address As Slave Interrupt Enable" }
          - { name: "SCDEN", bit: 5, access: RW, desc: "Stop Condition Interrupt Enable" }
          - { name: "TXRDYEN", bit: 4, access: RW, desc: "Transmit Data Ready Interrupt Enable" }
          - { name: "RXRDYEN", bit: 3, access: RW, desc: "Receive Data Ready Interrupt Enable" }
          - { name: "ARDYEN", bit: 2, access: RW, desc: "Register Access Ready Interrupt Enable" }
          - { name: "NACKEN", bit: 1, access: RW, desc: "No Acknowledgement Interrupt Enable" }
          - { name: "ALEN", bit: 0, access: RW, desc: "Arbitration Lost Interrupt Enable" }
      I2CSTR:
        offset: '0x08'
        access: RO
        reset: '0x0420'
        desc: "I2C Status Register"
        fields:
          - { name: "SDIR", bit: 14, access: RW, desc: "Slave direction - 1 indicates slave transmitter, 0 indicates master or slave receiver" }
          - { name: "NACKSNT", bit: 13, access: RW, desc: "No acknowledge sent - set when NACK sent because NACKMOD was set" }
          - { name: "BB", bit: 12, access: RW, desc: "Bus busy - indicates state of serial bus" }
          - { name: "RSFULL", bit: 11, access: RW, desc: "Receiver shift full - indicates receiver overrun" }
          - { name: "XSMT", bit: 10, access: RW, desc: "Transmit shift empty - 0 indicates transmitter underflow" }
          - { name: "AAS", bit: 9, access: RW, desc: "Address as slave - set when I2C recognizes own slave address or general call" }
          - { name: "AD0", bit: 8, access: RW, desc: "Address zero status - 1 indicates general call detected" }
          - { name: "SCD", bit: 5, access: RW, desc: "Stop condition detect interrupt flag" }
          - { name: "TXRDY", bit: 4, access: RW, desc: "Transmit data ready interrupt flag" }
          - { name: "RXRDY", bit: 3, access: RW, desc: "Receive data ready interrupt flag" }
          - { name: "ARDY", bit: 2, access: RW, desc: "Register access ready interrupt flag" }
          - { name: "NACK", bit: 1, access: RW, desc: "No acknowledgement interrupt - set when master does not receive ACK" }
          - { name: "AL", bit: 0, access: RW, desc: "Arbitration lost interrupt flag" }
      I2CCKL:
        offset: '0x0C'
        access: RW
        reset: '0x0000'
        desc: "I2C Clock Divider Low Register"
        fields:
          - { name: "CLKL", msb: 15, lsb: 0, access: RW, desc: "Low time clock division factor - divides module clock to create SCL low time" }
      I2CCKH:
        offset: '0x10'
        access: RW
        reset: '0x0000'
        desc: "I2C Clock Control High Register"
        fields:
          - { name: "CLKH", msb: 15, lsb: 0, access: RW, desc: "High time clock division factor - divides module clock to create SCL high time" }
      I2CCNT:
        offset: '0x14'
        access: RW
        reset: '0x0000'
        desc: "I2C Data Count Register"
        fields:
          - { name: "CNT", msb: 15, lsb: 0, access: RW, desc: "Data counter - down counter to generate stop condition" }
      I2CDRR:
        offset: '0x18'
        access: RW
        reset: '0x0000'
        desc: "I2C Data Receive Register"
        fields:
          - { name: "DATARX", msb: 7, lsb: 0, access: RW, desc: "Receive data - reading clears RXRDY bit" }
      I2CSAR:
        offset: '0x1C'
        access: RW
        reset: '0x03FF'
        desc: "I2C Slave Address Register"
        fields:
          - { name: "SA", msb: 9, lsb: 0, access: RW, desc: "7- or 10-bit programmable slave address" }
      I2CDXR:
        offset: '0x20'
        access: RW
        reset: '0x0000'
        desc: "I2C Data Transmit Register"
        fields:
          - { name: "DATATX", msb: 7, lsb: 0, access: RW, desc: "Transmit data - writing clears TXRDY bit" }
      I2CMDR:
        offset: '0x24'
        access: RW
        reset: '0x0000'
        desc: "I2C Mode Register"
        fields:
          - { name: "NACKMOD", bit: 15, access: RW, desc: "No-acknowledge mode - 1 sends NACK to transmitter" }
          - { name: "FREE", bit: 14, access: RW, desc: "Free running bit - determines behavior at breakpoint" }
          - { name: "STT", bit: 13, access: RW, desc: "Start condition - set to 1 to generate START" }
          - { name: "STP", bit: 11, access: RW, desc: "Stop condition - set to 1 to generate STOP" }
          - { name: "MST", bit: 10, access: RW, desc: "Master/slave mode bit - 1 for master, 0 for slave" }
          - { name: "TRX", bit: 9, access: RW, desc: "Transmit/receive bit - 1 for transmit, 0 for receive" }
          - { name: "XA", bit: 8, access: RW, desc: "Expand address enable - 1 for 10-bit mode, 0 for 7-bit mode" }
          - { name: "RM", bit: 7, access: RW, desc: "Repeat mode enable - 1 enables continuous transmit/receive" }
          - { name: "DLB", bit: 6, access: RW, desc: "Digital loop back enable - 1 enables loopback mode" }
          - { name: "nIRS", bit: 5, access: RW, desc: "I2C reset enable - 0 puts I2C in reset, 1 takes out of reset" }
          - { name: "STB", bit: 4, access: RW, desc: "Start byte mode enable - 1 enables start byte mode" }
          - { name: "FDF", bit: 3, access: RW, desc: "Free data format enable - 1 enables free data format" }
          - { name: "BC", msb: 2, lsb: 0, access: RW, desc: "Bit count - defines number of bits per transfer (2-8 bits)" }
      I2CIVR:
        offset: '0x28'
        access: RW
        reset: '0x0000'
        desc: "I2C Interrupt Vector Register"
        fields:
          - { name: "TESTMD", msb: 11, lsb: 8, access: RW, desc: "Reserved for internal testing" }
          - { name: "INTCODE", msb: 2, lsb: 0, access: RW, desc: "Interrupt Code - indicates which interrupt occurred" }
      I2CEMDR:
        offset: '0x2C'
        access: RW
        reset: '0x0001'
        desc: "I2C Extended Mode Register"
        fields:
          - { name: "IGNACK", bit: 1, access: RW, desc: "Ignore NACK mode - 1 ignores NACK from slave" }
          - { name: "BCM", bit: 0, access: RW, desc: "Backwards compatibility mode - 1 enables compatibility with previous versions" }
      I2CPSC:
        offset: '0x30'
        access: RW
        reset: '0x0000'
        desc: "I2C Prescale Register"
        fields:
          - { name: "PSC", msb: 7, lsb: 0, access: RW, desc: "Prescale - divides VBUS clock to obtain module clock (6.7-13.3 MHz)" }
      I2CPID1:
        offset: '0x34'
        access: RW
        reset: '0x0146'
        desc: "I2C Peripheral ID Register 1"
        fields:
          - { name: "CLASS", msb: 15, lsb: 8, access: RW, desc: "Peripheral class" }
          - { name: "REVISION", msb: 7, lsb: 0, access: RW, desc: "Revision level of the I2C" }
      I2CPID2:
        offset: '0x38'
        access: RW
        reset: '0x0005'
        desc: "I2C Peripheral ID Register 2"
        fields:
          - { name: "TYPE", msb: 7, lsb: 0, access: RW, desc: "Peripheral type" }
      I2CDMACR:
        offset: '0x3C'
        access: RW
        reset: '0x0003'
        desc: "I2C DMA Control Register"
        fields:
          - { name: "TXDMAEN", bit: 1, access: RW, desc: "Transmitter DMA enable" }
          - { name: "RXDMAEN", bit: 0, access: RW, desc: "Receive DMA enable" }
      I2CPFNC:
        offset: '0x48'
        access: RW
        reset: '0x0000'
        desc: "I2C Pin Function Register"
        fields:
          - { name: "PINFUNC", bit: 0, access: RW, desc: "SDA and SCL pin function - 0 for I2C, 1 for GPIO" }
      I2CPDIR:
        offset: '0x4C'
        access: RW
        reset: '0x0000'
        desc: "I2C Pin Direction Register"
        fields:
          - { name: "SDADIR", bit: 1, access: RW, desc: "SDA direction - 0 for input, 1 for output" }
          - { name: "SCLDIR", bit: 0, access: RW, desc: "SCL direction - 0 for input, 1 for output" }
      I2CDIN:
        offset: '0x50'
        access: RW
        reset: '0x0000'
        desc: "I2C Data Input Register"
        fields:
          - { name: "SDAIN", bit: 1, access: RW, desc: "Serial data in - reflects value on SDA pin" }
          - { name: "SCLIN", bit: 0, access: RW, desc: "Serial clock data in - reflects value on SCL pin" }
      I2CDOUT:
        offset: '0x54'
        access: RW
        reset: '0x0000'
        desc: "I2C Data Output Register"
        fields:
          - { name: "SDAOUT", bit: 1, access: RW, desc: "SDA data output - value sent to SDA pin" }
          - { name: "SCLOUT", bit: 0, access: RW, desc: "SCL data output - value sent to SCL pin" }
      I2CDSET:
        offset: '0x58'
        access: RW
        reset: '0x0000'
        desc: "I2C Data Set Register"
        fields:
          - { name: "SDASET", bit: 1, access: RW, desc: "Serial data set - sets SDA GPIO pin to high" }
          - { name: "SCLSET", bit: 0, access: RW, desc: "Serial clock set - sets SCL GPIO pin to high" }
      I2CDCLR:
        offset: '0x5C'
        access: RW
        reset: '0x0000'
        desc: "I2C Data Clear Register"
        fields:
          - { name: "SDACLR", bit: 1, access: RW, desc: "Serial data clear - clears SDA GPIO pin to low" }
          - { name: "SCLCLR", bit: 0, access: RW, desc: "Serial clock clear - clears SCL GPIO pin to low" }
      I2CPDR:
        offset: '0x60'
        access: RW
        reset: '0x0000'
        desc: "I2C Pin Open Drain Register"
        fields:
          - { name: "SDAPDR", bit: 1, access: RW, desc: "SDA pin open drain enable - 0 enables open drain" }
          - { name: "SCLPDR", bit: 0, access: RW, desc: "SCL pin open drain enable - 0 enables open drain" }
      I2CPDIS:
        offset: '0x64'
        access: RW
        reset: '0x0003'
        desc: "I2C Pull Disable Register"
        fields:
          - { name: "SDAPDIS", bit: 1, access: RW, desc: "SDA pull disable - 0 enables pull, 1 disables" }
          - { name: "SCLPDIS", bit: 0, access: RW, desc: "SCL pull disable - 0 enables pull, 1 disables" }
      I2CPSEL:
        offset: '0x68'
        access: RW
        reset: '0x0000'
        desc: "I2C Pull Select Register"
        fields:
          - { name: "SDAPSEL", bit: 1, access: RW, desc: "SDA pull select - 0 for pull down, 1 for pull up" }
          - { name: "SCLPSEL", bit: 0, access: RW, desc: "SCL pull select - 0 for pull down, 1 for pull up" }
      I2CSRS:
        offset: '0x6C'
        access: RW
        reset: '0x0000'
        desc: "I2C Pins Slew Rate Select Register"
        fields:
          - { name: "SDASRS", bit: 1, access: RW, desc: "SDA slew rate select - 0 for slow, 1 for normal" }
          - { name: "SCLSRS", bit: 0, access: RW, desc: "SCL slew rate select - 0 for slow, 1 for normal" }

  IOMM:
    base_address: '0x00000000'
    desc: ''
    registers:
      REVISION_REG:
        offset: '0x00'
        access: RW
        reset: '0x4E840102'
        desc: "Revision Register - provides revision information about the IOMM"
        fields:
          - { name: "REV_SCHEME", msb: 31, lsb: 30, access: RW, desc: "Revision Scheme, value = 01" }
          - { name: "REV_MODULE", msb: 27, lsb: 16, access: RW, desc: "Module Id, value = E84h" }
          - { name: "REV_RTL", msb: 15, lsb: 11, access: RW, desc: "RTL Revision, value = 0" }
          - { name: "REV_MAJOR", msb: 10, lsb: 8, access: RW, desc: "Major Revision, value = 001" }
          - { name: "REV_CUSTOM", msb: 7, lsb: 6, access: RW, desc: "Custom Revision, value = 0" }
          - { name: "REV_MINOR", msb: 5, lsb: 0, access: RW, desc: "Minor Revision, value = 2h" }
      ENDIAN_REG:
        offset: '0x20'
        access: RW
        reset: '0x00000000'
        desc: "Device Endianness Register - reflects the state of device endianness"
        fields:
          - { name: "ENDIAN", bit: 0, access: RW, desc: "Device endianness. 0=little-endian, 1=big-endian" }
      KICK_REG0:
        offset: '0x38'
        access: RW
        reset: '0x00000000'
        desc: "Kicker Register 0 - first part of unlock sequence for PINMMRn registers"
        fields:
          - { name: "KICK0", msb: 31, lsb: 0, access: RW, desc: "Kicker 0 Register. Value 0x83E70B13 must be written to unlock PINMMRn write access" }
      KICK_REG1:
        offset: '0x3C'
        access: RW
        reset: '0x00000000'
        desc: "Kicker Register 1 - second part of unlock sequence for PINMMRn registers"
        fields:
          - { name: "KICK1", msb: 31, lsb: 0, access: RW, desc: "Kicker 1 Register. Value 0x95A4F1E0 must be written to unlock PINMMRn write access" }
      ERR_RAW_STATUS_REG:
        offset: '0xE0'
        access: RO
        reset: '0x00000000'
        desc: >-
          Error Raw Status / Set Register - shows status of error conditions before enabling
        fields:
          - { name: "ADDR_ERR", bit: 1, access: RW, desc: "Addressing Error Status. Set when unimplemented location inside IOMM is accessed" }
          - { name: "PROT_ERR", bit: 0, access: RW, desc: "Protection Error Status. Set when IOMM register written in CPU user mode" }
      ERR_ENABLED_STATUS_REG:
        offset: '0xE4'
        access: RO
        reset: '0x00000000'
        desc: >-
          Error Enabled Status / Clear Register - shows status and allows clearing of error status
        fields:
          - { name: "ENABLED_ADDR_ERR", bit: 1, access: RW, desc: "Addressing Error Signaling Enable and Status Clear" }
          - { name: "ENABLED_PROT_ERR", bit: 0, access: RW, desc: "Protection Error Signaling Enable and Status Clear" }
      ERR_ENABLE_REG:
        offset: '0xE8'
        access: RW
        reset: '0x00000000'
        desc: "Error Signaling Enable Register - shows and allows enabling of interrupts"
        fields:
          - { name: "ADDR_ERR_EN", bit: 1, access: RW, desc: "Addressing Error Signaling Enable" }
          - { name: "PROT_ERR_EN", bit: 0, access: RW, desc: "Protection Error Signaling Enable" }
      ERR_ENABLE_CLR_REG:
        offset: '0xEC'
        access: RO
        reset: '0x00000000'
        desc: >-
          Error Signaling Enable Clear Register - shows status and allows disabling of error signaling
        fields:
          - { name: "ADDR_ERR_EN_CLR", bit: 1, access: RW, desc: "Addressing Error Signaling Enable Clear" }
          - { name: "PROT_ERR_EN_CLR", bit: 0, access: RW, desc: "Protection Error Signaling Enable Clear" }
      FAULT_ADDRESS_REG:
        offset: '0xF4'
        access: RW
        reset: '0x00000000'
        desc: "Fault Address Register - holds address of first fault transfer"
        fields:
          - { name: "FAULT_ADDR", msb: 8, lsb: 0, access: RW, desc: "Fault Address offset in case of address or protection error" }
      FAULT_STATUS_REG:
        offset: '0xF8'
        access: RO
        reset: '0x00000000'
        desc: "Fault Status Register - holds status and attributes of first fault transfer"
        fields:
          - { name: "FAULT_ID", msb: 27, lsb: 24, access: RW, desc: "Faulting Transaction ID" }
          - { name: "FAULT_MSTID", msb: 23, lsb: 16, access: RW, desc: "ID of Master that initiated the faulting transaction" }
          - { name: "FAULT_PRIVID", msb: 12, lsb: 9, access: RW, desc: "Faulting Privilege ID" }
          - { name: "FAULT_TYPE", msb: 5, lsb: 0, access: RW, desc: "Type of fault detected (0=no fault, 1=user exec, 2=user write, 4=user read, 8=super exec, 16=super write, 32=super read)" }
      FAULT_CLEAR_REG:
        offset: '0xFC'
        access: RW
        reset: '0x00000000'
        desc: "Fault Clear Register - allows clearing current fault to capture another"
        fields:
          - { name: "FAULT_CLEAR", bit: 0, access: RWC, desc: "Fault Clear. Write 1 to clear current fault" }
      PINMMR0:
        offset: '0xB10'
        access: RW
        reset: '0x01010101'
        desc: "Pin Multiplexing Control Register 0"
        fields:
          - { name: "PINMMR0_31_24", msb: 31, lsb: 24, access: RW, desc: "Controls functionality on ball/pin (MIBSPI3NCS[2]/I2C_SDA/N2HET1[27]/nTZ2)" }
          - { name: "PINMMR0_23_16", msb: 23, lsb: 16, access: RW, desc: "Controls functionality on ball/pin (MIBSPI3NCS[3]/I2C_SCL/N2HET1[29]/nTZ1)" }
          - { name: "PINMMR0_15_8", msb: 15, lsb: 8, access: RW, desc: "Controls functionality on ball/pin (GIOA[0]/USB2.VP/USB_FUNC.RXDPI)" }
          - { name: "PINMMR0_7_0", msb: 7, lsb: 0, access: RW, desc: "Controls functionality on ball/pin (GIOB[3]/USB2.RCV/USB_FUNC.RXDI)" }
      PINMMR1:
        offset: '0xB14'
        access: RW
        reset: '0x01010101'
        desc: "Pin Multiplexing Control Register 1"
      PINMMR2:
