        fields:
          - { name: "In", bit: 0, access: RW, desc: "CAN_RX data in" }
          - { name: "Out", bit: 1, access: RW, desc: "CAN_RX data out write" }
          - { name: "Dir", bit: 2, access: RW, desc: "CAN_RX data direction" }
          - { name: "Func", bit: 3, access: RW, desc: "CAN_RX function" }
          - { name: "OD", bit: 16, access: RW, desc: "CAN_RX open drain enable" }
          - { name: "PD", bit: 17, access: RW, desc: "CAN_RX pull disable" }
          - { name: "PU", bit: 18, access: RW, desc: "CAN_RX Pullup/Pulldown select" }

  DCC:
    base_address: '0x00000000'
    desc: ''
    registers:
      DCCGCTRL:
        offset: '0x00'
        access: RW
        reset: '0x00005555'
        desc: "DCC Global Control Register"
        fields:
          - { name: "DONE_INT_ENA", msb: 15, lsb: 12, access: RW, desc: "Done Interrupt Enable. 5h=No interrupt, Others=DONE interrupt enabled" }
          - { name: "SINGLE_SHOT", msb: 11, lsb: 8, access: RW, desc: "Single-Shot Mode Enable. Ah=Stop when counter0 and valid0 reach zero, Bh=Stop when counter1 reaches zero, Others=Continuous counting" }
          - { name: "ERR_ENA", msb: 7, lsb: 4, access: RW, desc: "Error Interrupt Enable. 5h=No interrupt, Others=ERROR interrupt enabled" }
          - { name: "DCC_ENA", msb: 3, lsb: 0, access: RW, desc: "DCC Enable. 5h=Counters stopped, Others=Counters enabled. Write Ah to enable" }
      DCCREV:
        offset: '0x04'
        access: RW
        reset: '0x44002204'
        desc: "DCC Revision Id Register"
        fields:
          - { name: "SCHEME", msb: 31, lsb: 30, access: RW, desc: "Reads return 01" }
          - { name: "FUNC", msb: 27, lsb: 16, access: RW, desc: "Functional release number. Reads return 0x000" }
          - { name: "RTL", msb: 15, lsb: 11, access: RW, desc: "Design release number. Reads return 0x00" }
          - { name: "MAJOR", msb: 10, lsb: 8, access: RW, desc: "Major revision number. Reads return 0x2" }
          - { name: "CUSTOM", msb: 7, lsb: 6, access: RW, desc: "Custom version number. Reads return 0x0" }
          - { name: "MINOR", msb: 5, lsb: 0, access: RW, desc: "Minor revision number. Reads return 0x4" }
      DCCCNT0SEED:
        offset: '0x08'
        access: RW
        reset: '0x00000000'
        desc: "DCC Counter0 Seed Register"
        fields:
          - { name: "COUNT0_SEED", msb: 19, lsb: 0, access: RW, desc: "Seed value for DCC counter0. Must be non-zero" }
      DCCVALID0SEED:
        offset: '0x0C'
        access: RW
        reset: '0x00000000'
        desc: "DCC Valid0 Seed Register"
        fields:
          - { name: "VALID0_SEED", msb: 15, lsb: 0, access: RW, desc: "Seed value for DCC Valid0. Defines window within which counter1 must reach 0. Must be at least 0x4" }
      DCCCNT1SEED:
        offset: '0x10'
        access: RW
        reset: '0x00000000'
        desc: "DCC Counter1 Seed Register"
        fields:
          - { name: "COUNT1_SEED", msb: 19, lsb: 0, access: RW, desc: "Seed value for DCC counter1. Must be non-zero" }
      DCCSTAT:
        offset: '0x14'
        access: RO
        reset: '0x00000000'
        desc: "DCC Status Register"
        fields:
          - { name: "DONE", bit: 1, access: RW, desc: "Single-Shot Sequence Done flag. Write 1 in privileged mode to clear" }
          - { name: "ERR", bit: 0, access: RW, desc: "Error flag. Indicates DCC error has occurred. Write 1 in privileged mode to clear" }
      DCCCNT0:
        offset: '0x18'
        access: RW
        reset: '0x00000000'
        desc: "DCC Counter0 Value Register"
        fields:
          - { name: "COUNT0", msb: 19, lsb: 0, access: RO, desc: "Current value of DCC counter0. Read-only" }
      DCCVALID0:
        offset: '0x1C'
        access: RW
        reset: '0x00000000'
        desc: "DCC Valid0 Value Register"
        fields:
