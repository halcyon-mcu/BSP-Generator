      HWCHENAR:
        offset: '0x1C'
        access: RO
        reset: '0x00000000'
        desc: "HW Channel Enable Reset and Status Register"
        fields:
          - { name: "HWCHDIS", msb: 15, lsb: 0, access: RW, desc: "HW channel disable bit. Bit 0=channel 0, bit 1=channel 1. Write 1 to disable corresponding channel." }
      SWCHENAS:
