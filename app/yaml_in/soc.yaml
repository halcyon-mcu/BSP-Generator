ir_schema_version: "1.1.0"
chip: "RM46L852"
vendor: "Texas Instruments"
family: "Hercules RM46"
revision: "Rev B"   # TODO: confirm silicon rev string convention

soc:
  cpu:
    cores:
      - name: "Cortex-R4F"
        arch: "armv7-r"
        endianness: big      # TODO: confirm project endianness (RM46 supports both)
        word_size_bits: 32
        fpu: "VFPv3-D16"     # TODO: confirm FPU config

  peripherals:
    - name: "GIO"
      type: "gpio"
      instance: 1
      regs_ref: "GIO"
      irq_ref: []            # GIO interrupt numbers not listed in md; add when known
      clock_ref: "VCLK1"

provenance:
  notes:
    - "Addresses and clocks taken from RM46_Hardware_Info.md"
