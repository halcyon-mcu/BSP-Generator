# Paste this under peripherals[name=SYSTEM].x-ext in app/yaml_in/soc.yaml
# Order is mandatory.
name: SYSTEM
x-ext:
  init:
    # 0xFFFFFFD0
    - reg: CLKCNTL
      op: set_bits
      value: "0x00000100"

    # 0xFFFFFFD0
    - reg: CLKCNTL
      op: write
      value: "0x00010000"

    # 0xFFFFFF5C
    - reg: MINITGCR
      op: set_bits
      value: "0x0000000A"

    # 0xFFFFFF60
    - reg: MSINENA
      op: write
      value: "0xFFFFFFFF"

    # 0xFFFFFF68
    - reg: MSTCGSTAT
      op: write
      value: "0x00000100"

    # 0xFFFFFF5C
    - reg: MINITGCR
      op: clear_bits
      value: "0x00000005"

    # 0xFFFFFF54
    - reg: CSVSTAT
      op: write
      value: "0x00000000"
