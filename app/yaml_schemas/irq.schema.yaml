$id: irq.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema

type: object
additionalProperties: false
required: [ir_schema_version, irqs]

properties:
  ir_schema_version: { type: string, const: "1.1.0" }

  # For Cortex-R4 / RM46, you are using VIM (not NVIC)
  interrupt_controller: { $ref: "#/$defs/ic" }

  # Keep this optional in case you ever reuse the schema for ARM NVIC parts
  nvic:
    type: object
    additionalProperties: false
    properties:
      vector_base: { $ref: "#/$defs/hex" }

  irqs:
    type: array
    minItems: 1
    items: { $ref: "#/$defs/irq" }

  priorities: { type: object, additionalProperties: true }
  provenance: { type: object, additionalProperties: true }

$defs:
  hex: { type: string, pattern: "^0x[0-9A-Fa-f]+$" }
  ext: { type: object, additionalProperties: true }

  ic:
    type: object
    additionalProperties: false
    required: [name, type, vector_table]
    properties:
      name: { type: string }          # "VIM"
      type: { type: string }          # "vim"
      vector_table:
        type: object
        additionalProperties: false
        required: [base_address, entries, entry_size_bytes]
        properties:
          base_address: { $ref: "#/$defs/hex" }
          entries: { type: integer, minimum: 1 }
          entry_size_bytes: { type: integer, minimum: 1 }
          phantom_entry: { type: integer, minimum: 0 }
          valid_channels:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: integer, minimum: 0 }
          reserved_channels:
            type: array
            items: { type: integer, minimum: 0 }
      x-ext: { $ref: "#/$defs/ext" }

  irq:
    type: object
    additionalProperties: false
    required: [name, id]
    properties:
      name: { type: string }
      id: { type: integer, minimum: 0 }
      peripheral_refs: { type: array, items: { type: string } }
      desc: { type: string }
      x-ext: { $ref: "#/$defs/ext" }
