$id: pinmux.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [ir_schema_version, package, pins]
properties:
  ir_schema_version: { type: string, const: "1.1.0" }
  package: { type: string }
  pins:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, functions]
      properties:
        # Added: Physical pin number on the chip package (e.g., 96)
        package_pin: { type: integer, description: "Physical Pin Number on the PGE144 package" }
        
        # Internal Signal Name (from Datasheet)
        name: { type: string }
        
        # Added: Board-level connections (from Schematic)
        board:
          type: object
          properties:
            net: { type: string, description: "Net name as it appears on the schematic wires" }
            connects_to: { type: string, description: "External component (e.g., 'U5 TLIN1029', 'D5 LED')" }
            headers: { type: array, items: { type: string }, description: "Available on headers (e.g., 'J1.1', 'J4.5')" }
            electrical: { type: string, description: "External pull-ups/downs or dividers" }
        
        defaults:
          type: object
          properties:
            pull:  { enum: [none, up, down] }
            drive: { type: string }
            
        functions:
          type: array
          minItems: 1
          items:
            type: object
            required: [af, signal, mux]
            properties:
              af:     { type: string }
              signal: { type: string }
              mux:
                type: object
                required: [register, bit]
                properties:
                  register: { type: string }
                  bit: { type: integer }
              requires_pull: { enum: [up, down] }