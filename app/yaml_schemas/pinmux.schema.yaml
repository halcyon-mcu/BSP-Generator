$id: pinmux.schema.yaml
$schema: https://json-schema.org/draft/2020-12/schema
type: object
additionalProperties: false
required: [ir_schema_version, package, pins]
properties:
  ir_schema_version: { type: string, const: "1.1.0" }
  package: { type: string }
  pins:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, functions] # 'pad' is optional until schematic data is available
      properties:
        pad: { type: string, description: "Physical ball/pin ID (e.g., N17) from schematic/datasheet" }
        name: { type: string, description: "Primary signal name or functional group name" }
        defaults:
          type: object
          additionalProperties: false
          properties:
            pull:  { enum: [none, up, down] }
            drive: { type: string }
        functions:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [af, signal, mux]
            properties:
              af:     { type: string, description: "Alternate Function ID/Index" }
              signal: { type: string, description: "Signal name e.g. SCI1.TX" }
              mux:
                type: object
                required: [register, bit]
                properties:
                  register: { type: string, description: "Register name (e.g. PINMMR0)" }
                  bit: { type: integer, minimum: 0, maximum: 31, description: "Bit index within the register" }
              requires_pull: { enum: [up, down] }
              x-ext:  { type: object }
  constraints: { type: object }
  provenance:  { type: object }